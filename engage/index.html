<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valuation Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;600;700&family=Noto+Sans+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="/charts.js"></script>
<style>
/* Palette: off-black #2e2e38 / #1a1a24, ground #f6f6fa, greys #c4c4cd / #747480, yellow #ffe600, blue #1a9afa. */
:root {
  --ground: #f6f6fa; --surface: #ffffff; --raised: #fbfbfd; --ink: #2e2e38; --muted: #6b6b78; --rule: #e1e1e6;
  --rule-strong: #c4c4cd; --bar: #1a1a24; --bar-ink: #ffffff; --bar-muted: #c4c4cd; --yellow: #ffe600;
  --on-yellow: #2e2e38; --link: #1270c2; --blue: #1a9afa;
  --ok-bg: #e5f3ea; --ok: #16692f; --warn-bg: #fff3cc; --warn: #7a5200; --bad-bg: #fbe7e5; --bad: #a3261c;
  --info-bg: #e3f1fd; --info: #0f5a9c; --code-bg: #f0f0f4;
  --s1: #1a9afa; --s2: #747480; --s3: #2e2e38;
  --c1: #1a9afa; --c2: #2e2e38; --c3: #d97a00; --c4: #8a8a96; --c5: #16692f; --c6: #a3261c;
  --q1: #d6ebfd; --q2: #aed6fb; --q3: #7fbef8; --q4: #4ea5f5; --q5: #1a8ae6; --q6: #126cb8; --q7: #0b4f8a;
  --sans: "Noto Sans", system-ui, -apple-system, sans-serif; --mono: "Noto Sans Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #1a1a24; --surface: #23232f; --raised: #2a2a36; --ink: #f0f0f5; --muted: #a8a8b5; --rule: #34343f;
    --rule-strong: #4a4a57; --bar: #121219; --link: #4bb0fb; --blue: #1a9afa;
    --ok-bg: #173323; --ok: #7fd49a; --warn-bg: #3a3012; --warn: #f3cf62; --bad-bg: #3d1d1b; --bad: #f4a39b;
    --info-bg: #15304a; --info: #8cc8f7; --code-bg: #2e2e38; color-scheme: dark;
    --s1: #1a9afa; --s2: #9a9aa8; --s3: #f0f0f5;
    --c1: #4bb0fb; --c2: #f0f0f5; --c3: #f3a43b; --c4: #9a9aa8; --c5: #7fd49a; --c6: #f4a39b;
    --q1: #0b2e4f; --q2: #0f3d69; --q3: #154f87; --q4: #1a63a8; --q5: #1a7fd6; --q6: #4ba3f0; --q7: #8cc8f7;
  }
}
:root[data-theme="dark"] {
  --ground: #1a1a24; --surface: #23232f; --raised: #2a2a36; --ink: #f0f0f5; --muted: #a8a8b5; --rule: #34343f;
  --rule-strong: #4a4a57; --bar: #121219; --link: #4bb0fb; --blue: #1a9afa;
  --ok-bg: #173323; --ok: #7fd49a; --warn-bg: #3a3012; --warn: #f3cf62; --bad-bg: #3d1d1b; --bad: #f4a39b;
  --info-bg: #15304a; --info: #8cc8f7; --code-bg: #2e2e38; color-scheme: dark;
  --s1: #1a9afa; --s2: #9a9aa8; --s3: #f0f0f5;
  --c1: #4bb0fb; --c2: #f0f0f5; --c3: #f3a43b; --c4: #9a9aa8; --c5: #7fd49a; --c6: #f4a39b;
  --q1: #0b2e4f; --q2: #0f3d69; --q3: #154f87; --q4: #1a63a8; --q5: #1a7fd6; --q6: #4ba3f0; --q7: #8cc8f7;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 300 15px/1.55 var(--sans); }
b, strong, th, h1, h2, h3 { font-weight: 600; }
a { color: var(--link); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.small { font-size: 13px; }
.nowrap { white-space: nowrap; }

/* header */
header { background: var(--bar); color: var(--bar-ink); position: sticky; top: 0; z-index: 10; }
.hbar { display: flex; align-items: center; gap: 14px; padding: 10px 24px; max-width: 1360px; margin: 0 auto; flex-wrap: wrap; }
.brand { display: flex; align-items: flex-end; gap: 10px; text-decoration: none; color: inherit; }
.brand .mark { width: 5px; align-self: stretch; background: var(--yellow); border-radius: 1px; }
.brand .name { font-size: 18px; font-weight: 600; letter-spacing: .1px; line-height: 1; }
.brand .sub { font-size: 12px; color: var(--bar-muted); font-weight: 400; line-height: 1; margin-left: 2px; }
.hsp { flex: 1; }
.hctl { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--bar-muted); flex-wrap: wrap; }
.hctl select { background: #2e2e38; color: #fff; border: 1px solid #4a4a57; border-radius: 4px; padding: 4px 8px; font-size: 13px; max-width: 280px; }
.chip { background: #2e2e38; border: 1px solid #4a4a57; color: #fff; border-radius: 99px; padding: 3px 10px; font-size: 12.5px; cursor: default; white-space: nowrap; }
.yellow-rule { height: 3px; background: var(--yellow); }

.hbtn { background: #2e2e38; color: #fff; border: 1px solid #4a4a57; border-radius: 4px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
.hbtn:hover, .hbtn[aria-expanded="true"] { border-color: var(--yellow); }
.hbtn.ask { background: var(--yellow); border-color: var(--yellow); color: var(--on-yellow); font-weight: 600; }
.popover { position: absolute; right: 24px; top: 58px; z-index: 30; background: var(--surface); color: var(--ink); border: 1px solid var(--rule-strong);
  border-radius: 6px; padding: 12px 14px; width: 260px; display: grid; gap: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.popover label { font-size: 12px; color: var(--muted); margin-top: 6px; }

/* the shell: navigation on the left, the page, and Ask on the right when it's open */
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); max-width: 1600px; margin: 0 auto; }
.shell.asking { grid-template-columns: 220px minmax(0, 1fr) minmax(360px, 34%); }
.content { min-width: 0; }
nav.side { position: sticky; top: 62px; align-self: start; max-height: calc(100vh - 62px); overflow-y: auto; padding: 18px 10px 30px 18px; }
nav.side .sec { font-size: 11.5px; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); margin: 16px 8px 4px; }
nav.side button { display: flex; width: 100%; gap: 8px; align-items: center; background: none; border: 0; border-radius: 4px; padding: 7px 8px;
  color: var(--ink); cursor: pointer; font-size: 14px; text-align: left; }
nav.side button:hover { background: var(--raised); }
nav.side button.on { background: var(--surface); box-shadow: inset 3px 0 0 var(--yellow); font-weight: 600; }
nav.side button:disabled { opacity: .45; cursor: not-allowed; }
nav.side .nm { flex: 1; }
nav.side .cnt { background: var(--warn-bg); color: var(--warn); border-radius: 99px; font-size: 11.5px; padding: 0 7px; font-weight: 600; }
.drawer { position: sticky; top: 62px; align-self: start; height: calc(100vh - 62px); overflow-y: auto; border-left: 1px solid var(--rule); background: var(--ground); padding: 12px 14px; }
.drawer-head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 8px; }
.drawer-head .btn { margin-left: auto; }
.drawer .card { padding: 12px; }
.heads { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.head { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; }
.head .k { font-size: 12.5px; color: var(--muted); }
.head .v { font-size: 24px; font-weight: 600; margin: 2px 0; font-variant-numeric: tabular-nums; }
.head .s { font-size: 12.5px; color: var(--muted); }
.needs { list-style: none; margin: 0; padding: 0; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); }
.needs li { border-top: 1px solid var(--rule); }
.needs li:first-child { border-top: 0; }
.needs button { display: flex; width: 100%; justify-content: space-between; gap: 10px; background: none; border: 0; padding: 9px 12px; cursor: pointer; text-align: left; font-size: 14px; color: var(--ink); }
.needs button:hover { background: var(--raised); }
.needs .where { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.conf { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.conf li::before { content: "✓ "; color: var(--ok); font-weight: 700; }
.conf li.no::before { content: "✗ "; color: var(--bad); }
.conf li.wait::before { content: "… "; color: var(--muted); }
@media (max-width: 900px) { .shell, .shell.asking { grid-template-columns: minmax(0, 1fr); } nav.side { position: static; max-height: none; display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 16px; }
  nav.side .sec { display: none; } nav.side button { width: auto; } .drawer { position: static; height: auto; border-left: 0; border-top: 1px solid var(--rule); } }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #74747f; display: inline-grid; place-items: center; font-size: 11px; font-weight: 600; }
.dot.done { background: var(--yellow); border-color: var(--yellow); color: #2e2e38; }
.dot.work { border-color: var(--blue); color: var(--blue); }

main { max-width: 1360px; margin: 0; padding: 22px 24px 60px; display: grid; gap: 18px; }
.lede { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.lede h1 { font-size: 24px !important; margin: 0; font-weight: 300; }
.lede h1 b { font-weight: 600; }
.lede p { margin: 4px 0 0; color: var(--muted); max-width: 820px; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 18px; min-width: 0; }
.card > h2, .card h2, .lede h1, .node .small b { font-size: 16px; margin: 0 0 2px; overflow-wrap: anywhere; }
.card > .sub { font-size: 13.5px; color: var(--muted); margin: 0 0 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 18px; }
.stack { display: grid; gap: 18px; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px; }

.btn { background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 6px 14px; cursor: pointer; font-size: 14px; font-weight: 400; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--yellow); border-color: var(--yellow); color: var(--on-yellow); font-weight: 600; }
.btn.primary:hover { filter: brightness(.95); }
.btn.small { padding: 3px 9px; font-size: 12.5px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--link); padding-left: 4px; padding-right: 4px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
input[type=text], select.in, textarea { background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 6px 9px; font-size: 14px; }
textarea { width: 100%; font-family: var(--mono); font-size: 12.5px; min-height: 160px; }

.pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--code-bg); color: var(--muted); white-space: nowrap; letter-spacing: .1px; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.info { background: var(--info-bg); color: var(--info); }
.callout { border-radius: 4px; padding: 10px 14px; font-size: 14px; border-left: 4px solid; }
.callout.warn { background: var(--warn-bg); color: var(--warn); border-color: #e0b400; }
.callout.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.callout.info { background: var(--info-bg); color: var(--info); border-color: var(--blue); }
.dx { margin: 10px 0 0; padding-left: 22px; display: grid; gap: 14px; }
.dx p { margin: 3px 0 0; font-size: 13.5px; }
.dx .k { color: var(--muted); }
.dxhead { font-size: 15px; margin: 6px 0 4px; max-width: 900px; }
td.brk { background: var(--bad-bg); color: var(--bad); font-weight: 600; }
pre.dr { margin: 6px 0 0; background: var(--code-bg); padding: 8px 10px; border-radius: 4px; font: 12px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow: auto; }
.drlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.drlist li { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: baseline; font-size: 13.5px; }
.drlist li > .small { grid-column: 2; }
details.work .in { padding: 0 12px 10px; }

.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font-size: 12px; color: var(--muted); padding: 7px 10px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap; font-weight: 600; }
td { padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tr.sel td { background: var(--raised); }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--raised); }
.bar { height: 5px; border-radius: 3px; background: var(--rule); overflow: hidden; margin-top: 5px; min-width: 120px; }
.bar i { display: block; height: 100%; background: var(--blue); transition: width .4s; }

.drop { border: 2px dashed var(--rule-strong); border-radius: 6px; padding: 26px; text-align: center; background: var(--raised); cursor: pointer; }
.drop.over { border-color: var(--yellow); background: var(--warn-bg); }
.drop b { font-size: 16px; }
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; margin-top: 14px; text-align: left; }
.slot { border: 1px solid var(--rule); border-radius: 4px; padding: 9px 12px; background: var(--surface); font-size: 13px; }
.slot b { display: block; font-size: 13.5px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--rule); border-radius: 4px; padding: 10px 14px; background: var(--surface); }
.tile b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile span { font-size: 12.5px; color: var(--muted); }

.md { font-size: 14px; }
.md table { width: auto; margin: 8px 0; }
.md td, .md th { border: 1px solid var(--rule); padding: 4px 8px; }
.md h2 { font-size: 15px; border-top: 1px solid var(--rule); padding-top: 12px; margin-top: 18px; }
.md h3 { font-size: 14px; }
.review { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 900px) { .review { grid-template-columns: 1fr; } }
.review img { max-width: 100%; border: 1px solid var(--rule); background: #fff; border-radius: 3px; }
.checks { list-style: none; padding: 0; margin: 0; font-size: 12.5px; }
.checks li::before { content: "✓ "; color: var(--ok); font-weight: 700; }
.checks li.no::before { content: "✗ "; color: var(--bad); }
.checks li.unk::before { content: "? "; color: var(--warn); font-weight: 700; }
.checks li.over { color: var(--muted); }
.sumtab td, .sumtab th { vertical-align: top; }
.sumtab .sec td { background: var(--raised); font-weight: 600; font-size: 12px; color: var(--muted); padding-top: 10px; }
.sumtab .rng { font-size: 12px; color: var(--muted); }
.sumtab input { width: 84px; text-align: right; }
.sumtab .delta { font-size: 12px; }
.chartrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-top: 8px; }
.chartrow .src-img { border: 1px solid var(--rule); border-radius: 4px; background: #fff; padding: 6px; }
.chartrow .src-img img { width: 100%; height: auto; display: block; }
.vtree, .vtree ul { list-style: none; margin: 0; padding: 0; }
.vtree ul { margin-left: 10px; padding-left: 14px; border-left: 1px solid var(--rule); }
.vtree li { margin: 8px 0; }
.vtree li.leaf > .vt-head b { font-weight: 500; }
.vt-head { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.vt-val { font-variant-numeric: tabular-nums; }
.vt-words { color: var(--muted); font-family: var(--mono, ui-monospace, monospace); margin: 2px 0 0; overflow-wrap: anywhere; }
.vt-core { margin: 6px 0 4px; padding: 8px 10px; border: 1px solid var(--rule); border-left: 3px solid var(--blue); border-radius: 4px; background: var(--raised); }
.vt-parts { list-style: none; margin: 2px 0 0; padding-left: 14px; border-left: 1px dashed var(--rule); }
.vt-parts li { margin: 3px 0; font-size: 13px; }
.checks li.over::before { content: "↷ "; color: var(--muted); font-weight: 700; }
details > summary { cursor: pointer; color: var(--link); font-size: 13px; }
.quote { font-size: 12.5px; color: var(--muted); border-left: 3px solid var(--rule-strong); padding-left: 8px; margin-top: 4px; }
.why { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--muted); }
.why li { margin: 2px 0; overflow-wrap: anywhere; }

/* roles */
.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; align-items: stretch; }
@media (max-width: 900px) { .flow { grid-template-columns: 1fr; } }
.node { border: 1px solid var(--rule-strong); border-top: 4px solid var(--yellow); border-radius: 4px; padding: 12px 14px; background: var(--surface); position: relative; margin-right: 26px; }
.node:last-child { margin-right: 0; }
.node::after { content: "→"; position: absolute; right: -22px; top: 40%; color: var(--muted); font-size: 18px; }
.node:last-child::after { content: none; }
@media (max-width: 900px) { .node { margin-right: 0; margin-bottom: 22px; } .node::after { content: "↓"; right: 45%; top: auto; bottom: -24px; } }
.node h3 { margin: 0 0 6px; font-size: 14px; }
.node .small b { font-size: 13px; }
.node select { width: 100%; }
.sheets { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 12.5px; }
.sheets label { display: flex; gap: 4px; align-items: center; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--bar); color: #fff; padding: 9px 16px; border-radius: 4px; font-size: 14px; z-index: 30; border-left: 4px solid var(--yellow); max-width: 90vw; }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
/* model dashboards (map step) and charts */
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 4px; overflow: hidden; flex-wrap: wrap; }
.seg button { background: var(--surface); border: 0; border-right: 1px solid var(--rule-strong); padding: 5px 12px; font-size: 13px; cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--bar); color: #fff; font-weight: 600; box-shadow: inset 0 -3px 0 var(--yellow); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.chart { position: relative; height: 280px; }
.heat { border-collapse: separate; border-spacing: 2px; width: auto; font-size: 12px; }
.heat th { border: 0; padding: 2px 6px; font-weight: 400; color: var(--ink); }
.heat th.col { writing-mode: vertical-rl; transform: rotate(180deg); text-align: left; padding: 6px 2px; }
.heat th.ov { font-weight: 600; box-shadow: inset 3px 0 0 var(--yellow); }
.heat th.col.ov { box-shadow: inset 0 -3px 0 var(--yellow); }
.heat td { border: 0; width: 34px; height: 26px; padding: 0; text-align: center; border-radius: 3px; font-variant-numeric: tabular-nums; }
.heat td.z { background: var(--raised); }
.heat td:not(.z):hover { outline: 2px solid var(--ink); }
.legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 22px; height: 10px; border-radius: 2px; }
.hbar-cell { height: 8px; border-radius: 0 4px 4px 0; background: var(--s1); min-width: 2px; }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 3px; background: var(--warn-bg); color: var(--warn); margin: 1px 3px 1px 0; white-space: nowrap; }
.tag.lever { background: var(--info-bg); color: var(--info); }
.tag.out { background: var(--ok-bg); color: var(--ok); }
#tip { position: fixed; pointer-events: none; background: var(--bar); color: #fff; font-size: 12.5px; padding: 6px 9px; border-radius: 4px; z-index: 40; max-width: 320px; display: none; border-left: 3px solid var(--yellow); }
/* charts, the DCF tab and the chat (python overlay step), after the Model Desk's */
.chart-card { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px 12px; }
.chart-card h4 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
.chart-card .sub { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.chart-box { position: relative; height: 300px; }
.chart-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.chart-tools button { background: none; border: 1px solid var(--rule-strong); border-radius: 4px; padding: 3px 10px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.chart-tools button:hover, .chart-tools button.on { color: var(--ink); border-color: var(--ink); }
.chart-tools .src { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; }
.chart-note { font-size: 13px; margin: 8px 0 0; max-width: 80ch; }
details.creview { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
details.creview ul { margin: 4px 0 0; padding-left: 18px; }
.copy-panel { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.copy-panel textarea { height: 140px; }
.val-cases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .val-cases { grid-template-columns: minmax(0, 1fr); } }
.val-case { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; display: grid; gap: 2px; }
.val-case.base { border-color: var(--ink); box-shadow: inset 0 3px 0 var(--yellow); }
.val-case span { font-size: 12px; color: var(--muted); }
.val-case b { font-size: 22px; font-variant-numeric: tabular-nums; }
.val-case em { font-style: normal; font-size: 12.5px; }
.up { color: var(--ok); } .down { color: var(--bad); }
.sc-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px 18px; }
.sc-form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.sc-form input, .sc-form select { font-size: 14px; padding: 6px 8px; width: 100%; min-width: 0; background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 4px; }
.sc-pair { display: flex; gap: 6px; }
.sc-bridge { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); font-size: 13.5px; }
.sc-bridge label { display: flex; gap: 6px; align-items: center; }
tr.tot td { font-weight: 600; border-top: 1px solid var(--ink); }
tr.pick { cursor: pointer; } tr.pick:hover td { background: var(--raised); }
.dcf-card { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; display: grid; gap: 8px; }
.dcf-card h4 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.dcf-card .big { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dcf-card .facts { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--muted); }
.dcf-card .facts b { color: var(--ink); }
.dcf-card table { width: auto; font-size: 13px; }
.dcf-card td { padding: 3px 12px 3px 0; }
.thread { display: flex; flex-direction: column; gap: 22px; margin: 14px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 99px; padding: 6px 14px; font-size: 13.5px; cursor: pointer; text-align: left; }
.chips button:hover { border-color: var(--ink); }
.q { align-self: flex-end; max-width: 80%; background: var(--bar); color: #fff; padding: 10px 14px; border-radius: 10px 10px 2px 10px; white-space: pre-wrap; border-left: 3px solid var(--yellow); }
.a { display: flex; flex-direction: column; gap: 10px; }
details.work { border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); font-size: 13px; }
details.work summary { padding: 8px 12px; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 8px; }
details.work summary::-webkit-details-marker { display: none; }
details.work summary::before { content: "▸"; transition: transform .15s; }
details.work[open] summary::before { transform: rotate(90deg); }
.wsteps { border-top: 1px solid var(--rule); padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.wstep .call { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
.wstep .call b { color: var(--link); }
.wstep pre { margin: 4px 0 0; max-height: 180px; overflow: auto; background: var(--code-bg); padding: 8px 10px; border-radius: 4px; font: 12px/1.45 var(--mono); color: var(--muted); white-space: pre; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); animation: pulse 1s infinite alternate; flex: none; }
@keyframes pulse { from { opacity: .25; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } .bar i { transition: none; } }
.answer { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 18px; overflow-x: auto; font-size: 14.5px; }
.answer h1, .answer h2, .answer h3, .answer h4 { font-size: 15px; margin: 14px 0 6px; }
.answer code { font: 12.5px var(--mono); background: var(--code-bg); padding: 1px 5px; border-radius: 3px; }
.answer table { width: auto; }
.chat-stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chat-stats b { color: var(--ink); }
.composer { display: flex; gap: 10px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; min-height: 46px; max-height: 180px; font-family: var(--sans); font-size: 14.5px; padding: 10px 12px; }
/* the call log dialog */
dialog#callsDlg { border: 1px solid var(--rule-strong); border-radius: 8px; background: var(--ground); color: var(--ink); padding: 0; width: min(1100px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog#callsDlg::backdrop { background: rgb(0 0 0 / .4); }
.dlg-head { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--rule); background: var(--surface); position: sticky; top: 0; z-index: 1; }
.dlg-head h2 { margin: 0; font-size: 16px; flex: 1; }
.dlg-body { padding: 16px 18px 22px; display: grid; gap: 16px; }
.transcript pre { white-space: pre-wrap; word-break: break-word; background: var(--code-bg); padding: 10px 12px; border-radius: 4px; font: 12px/1.5 var(--mono); max-height: 420px; overflow: auto; margin: 4px 0 10px; }
/* the status panel: stages, what's happening now, what needs you */
.nowbox { max-width: 1360px; margin: 16px 0 0; padding: 0 24px; }
.pipe { list-style: none; margin: 0; padding: 12px 14px 10px; display: flex; align-items: flex-start; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px 6px 0 0; overflow-x: auto; }
.pipe > li { flex: none; }
.pipe > li.link { flex: 1 1 24px; min-width: 14px; height: 2px; background: var(--rule-strong); margin: 15px 2px 0; }
.pipe > li.link.done { background: var(--yellow); }
.pipe > li.link.flowing, .sf-link.flowing { background: repeating-linear-gradient(90deg, var(--blue) 0 6px, transparent 6px 12px); background-size: 12px 2px; animation: flow .7s linear infinite; }
.st { display: grid; justify-items: center; gap: 2px; background: none; border: 0; cursor: pointer; padding: 2px 6px; min-width: 104px; text-align: center; color: inherit; }
.st:hover .nm { text-decoration: underline; }
.st .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--rule-strong); font-weight: 700; font-size: 12.5px; position: relative; color: var(--muted); background: var(--surface); }
.st.done .ic { background: var(--yellow); border-color: var(--yellow); color: #2e2e38; }
.st.you .ic { border-color: #e0b400; color: var(--warn); background: var(--warn-bg); animation: glowy 1.8s ease-out infinite; }
.st.error .ic { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }
.st.running .ic { border-color: var(--rule); }
.st.running .ic::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--blue); border-top-color: transparent; border-right-color: transparent; animation: spin .9s linear infinite; }
.st .nm { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.st .ln { font-size: 11.5px; color: var(--muted); max-width: 150px; line-height: 1.3; }
.st.you .ln { color: var(--warn); font-weight: 600; }
.now-row { display: flex; gap: 10px 18px; align-items: center; flex-wrap: wrap; justify-content: space-between; padding: 10px 14px; background: var(--raised); border: 1px solid var(--rule); border-top: 0; border-radius: 0 0 6px 6px; }
.live { flex: 1 1 420px; min-width: 0; }
.live-head { display: flex; gap: 8px; align-items: center; font-size: 13.5px; flex-wrap: wrap; }
.todo { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dot-idle { width: 8px; height: 8px; border-radius: 50%; background: var(--rule-strong); display: inline-block; }
.subflow { display: flex; align-items: center; flex-wrap: wrap; row-gap: 6px; margin-top: 8px; font-size: 12px; }
.sf-node { padding: 3px 10px; border-radius: 99px; border: 1px solid var(--rule-strong); color: var(--muted); background: var(--surface); white-space: nowrap; }
.sf-node.past { color: var(--ink); border-color: var(--yellow); }
.sf-node.cur { color: #fff; background: var(--blue); border-color: var(--blue); font-weight: 600; animation: glow 1.6s ease-out infinite; }
.sf-link { width: 20px; height: 2px; background: var(--rule-strong); }
.sf-link.past { background: var(--yellow); }
.swap .arr { display: inline-block; animation: flip 1.2s steps(1) infinite; }
.dot.work { animation: glow 1.8s ease-out infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes flow { to { background-position: 12px 0; } }
@keyframes flip { 50% { transform: scaleX(-1); } }
@keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(26, 154, 250, .55); } 70%, 100% { box-shadow: 0 0 0 7px rgba(26, 154, 250, 0); } }
@keyframes glowy { 0% { box-shadow: 0 0 0 0 rgba(224, 180, 0, .6); } 70%, 100% { box-shadow: 0 0 0 7px rgba(224, 180, 0, 0); } }
@media (prefers-reduced-motion: reduce) {
  .st.running .ic::after, .pipe > li.link.flowing, .sf-link.flowing, .sf-node.cur, .swap .arr, .st.you .ic, .dot.work { animation: none; }
}
@media (max-width: 640px) { .hbar, nav.steps, main { padding-left: 16px; padding-right: 16px; } .nowbox { padding: 0 16px; } .st { min-width: 84px; } }
</style>

<body>
<header>
  <div class="hbar">
    <a class="brand" href="#" id="brand"><span class="mark" aria-hidden="true"></span><span><span class="name">Valuation Desk</span><br><span class="sub">Recurring valuation workbench</span></span></a>
    <div class="hsp"></div>
    <div class="hctl">
      <label for="engSel">Engagement</label><select id="engSel"></select>
      <button class="btn small" id="newEng" style="background:#2e2e38;color:#fff;border-color:#4a4a57">New</button>
    </div>
    <div class="hctl" id="hdrCtl" hidden>
      <button class="chip" id="spend" type="button" title="Tokens, time and the log of every model call" style="cursor:pointer">$0.00</button>
      <button class="hbtn" id="modelsBtn" type="button" aria-haspopup="true" aria-expanded="false" title="Which Azure models read, review and arbitrate">⚙ Models</button>
      <button class="hbtn ask" id="askBtn" type="button" aria-expanded="false">Ask</button>
    </div>
  </div>
  <div class="yellow-rule"></div>
  <div class="popover" id="modelCtl" hidden role="dialog" aria-label="Models">
    <p class="small muted" style="margin:0 0 8px">The Azure models this engagement uses.</p>
    <label for="mSel">Reads (extractor)</label><select id="mSel" class="in"></select>
    <label for="rSel">Reviews</label><select id="rSel" class="in"></select>
    <label for="aSel" title="Settles what the extractor and reviewer can't">Arbitrates</label><select id="aSel" class="in"></select>
  </div>
</header>
<dialog id="callsDlg" aria-labelledby="callsTitle"><div class="dlg-head"><h2 id="callsTitle">Tokens, time and the call log</h2><button class="btn small" type="button" id="callsClose">Close</button></div><div class="dlg-body" id="callsBody"><p class="muted">Loading…</p></div></dialog>
<div class="shell" id="shell">
  <nav class="side" id="steps" aria-label="Engagement"></nav>
  <div class="content"><div id="now" class="nowbox" hidden aria-live="polite"></div><main id="main"></main></div>
  <aside class="drawer" id="askDrawer" hidden aria-label="Ask about the engagement"><div class="drawer-head"><b>Ask</b><span class="small muted">about this engagement</span><button class="btn small ghost" id="askClose" type="button" aria-label="Close">Close</button></div><div id="askBody"></div></aside>
</div>
<div id="tip"></div>
<input type="file" id="picker" multiple accept=".pdf,.pptx,.xlsx,.xlsm" hidden>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const md = s => DOMPurify.sanitize(marked.parse(s || ""));
const fmt = (v, d = 1) => v == null || v === "" ? "" : (typeof v === "number" ? v.toLocaleString(undefined, {maximumFractionDigits: d, minimumFractionDigits: Math.abs(v) < 10 && d ? Math.min(d, 2) : 0}) : String(v));
const size = b => b > 1e6 ? (b / 1e6).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1e3)) + " KB";
const busy = s => ["queued", "processing", "running"].includes(s);
function toast(msg, ms = 3500) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), ms); }
async function api(path, opts = {}) {
  const r = await fetch(path, {headers: opts.body && !(opts.body instanceof FormData) ? {"Content-Type": "application/json"} : {}, ...opts,
    body: opts.body && !(opts.body instanceof FormData) ? JSON.stringify(opts.body) : opts.body});
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m } catch {} throw new Error(m); }
  return r.json();
}

const NAV = [
  {id: "overview", name: "Overview"}, {id: "doctor", name: "Doctor"},
  {sec: "Setup"}, {id: "files", name: "Files"}, {id: "roles", name: "Roles"},
  {sec: "Last year"}, {id: "reference", name: "The report"}, {id: "python", name: "Rebuild in Python"}, {id: "map", name: "Map"},
  {sec: "This year"}, {id: "summary", name: "Summary"}, {id: "bridge", name: "Value bridge"}, {id: "compare", name: "What changed"}];
const STEPS = NAV.filter(x => x.id);
const ROLE_HELP = {
  prior_report: "Last year's final report: conclusions and assumptions.",
  prior_model: "The client's model behind last year's valuation.",
  prior_overlay: "Our workings linking the client model to the report: a separate workbook, or sheets inside the client model.",
  current_model: "This year's client model, to roll the valuation forward.",
};
let CFG, E = null, state = {step: "files", doc: null, table: null, tableFilter: "flagged", factEdit: null, docView: null};
let uploads = [], pollTimer = null;

// ---- boot / navigation -------------------------------------------------------------------------------------
async function boot() {
  CFG = await api("/api/config");
  for (const id of ["mSel", "rSel", "aSel"]) $("#" + id).innerHTML = CFG.models.map(m => `<option>${esc(m)}</option>`).join("");
  const h = new URLSearchParams(location.hash.slice(1));
  state.step = h.get("s") || "overview";
  await loadList(+h.get("e") || null);
}
async function loadList(select) {
  const list = await api("/api/engagements");
  $("#engSel").innerHTML = list.length ? list.map(e => `<option value="${e.id}">${esc(e.name)}</option>`).join("") : `<option value="">No engagements yet</option>`;
  const id = select && list.some(e => e.id === select) ? select : list[0]?.id;
  if (id) { $("#engSel").value = id; await open(id); } else { E = null; render(); }
}
async function open(id) { E = await api(`/api/engagements/${id}`); E._fetched = Date.now(); state.doc = null; state.table = null; render(); schedule(); spend();
  if (!$("#askDrawer").hidden) drawAsk(); }
// While someone is typing (a fact or table edit, or any focused field), polling updates the data and the step
// dots but doesn't rebuild the page, so the edit isn't lost.
function editing() {
  const a = document.activeElement;
  return state.factEdit != null || state.editingTable || CHAT.streaming || !!(a && a.closest("main") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
async function refresh(force = false) {
  if (!E) return;
  E = await api(`/api/engagements/${E.id}`); E._fetched = Date.now();
  if (!force && editing()) { renderSteps(); renderNow(); } else render();
  schedule();
}
function schedule() {
  clearTimeout(pollTimer);
  if (!E) return;
  const working = E.documents.some(d => busy(d.status) || busy(d.facts_status) || ["queued", "reading"].includes(d.tables_status)) || E.workbooks.some(w => busy(w.status))
    || busy(E.compare_status) || busy(E.map_status) || busy(E.overlay_status) || busy(E.charts_status) || busy(E.doctor_status) || E.roles_pending || uploads.some(u => !u.done);
  if (working) pollTimer = setTimeout(async () => { await refresh(); spend(); }, 1500);
}
async function spend() {
  if (!E) return;
  try { const u = await api(`/api/usage?session=${encodeURIComponent(E.session)}`); const s = u.session || {};
    $("#spend").textContent = `$${(s.cost_usd || 0).toFixed(3)} · ${((s.input_tokens || 0) + (s.output_tokens || 0)).toLocaleString()} tokens`;
    $("#spend").title = `Azure model spend for this engagement: ${s.calls || 0} calls (list prices)`; } catch {}
}
$("#engSel").onchange = e => { if (e.target.value) { go(state.step, +e.target.value); open(+e.target.value); } };
$("#newEng").onclick = () => { E = null; state.step = "files"; render(true); };
$("#mSel").onchange = async e => { E = {...E, ...await api(`/api/engagements/${E.id}`, {method: "PATCH", body: {model: e.target.value}})}; toast(`Extraction model: ${e.target.value}`); };
$("#rSel").onchange = async e => { E = {...E, ...await api(`/api/engagements/${E.id}`, {method: "PATCH", body: {reviewer_model: e.target.value}})}; toast(`Reviewer model: ${e.target.value}`); };
$("#aSel").onchange = async e => { E = {...E, ...await api(`/api/engagements/${E.id}`, {method: "PATCH", body: {arbiter_model: e.target.value}})}; toast(`Arbiter: ${e.target.value}`); };
function go(step, eid = E?.id) { state.step = step; history.replaceState(null, "", `#e=${eid || ""}&s=${step}`); render(); }

// ---- progress of each step ---------------------------------------------------------------------------------
function progress() {
  if (!E) return {};
  const report = E.documents.find(d => d.id === E.roles.prior_report?.id) || E.documents[0];
  const f = E.facts, approved = f.filter(x => x.status === "approved").length;
  const r = E.roles, nConf = Object.values(r).filter(x => x.confirmed).length;
  return {
    files: E.documents.length && E.workbooks.length >= 2 && !E.documents.some(d => busy(d.status)) && !E.workbooks.some(w => busy(w.status)) ? "done" : (E.documents.length + E.workbooks.length ? "work" : ""),
    reference: approved && !f.some(x => x.status === "pending") && !E.documents.some(d => busy(d.status) || busy(d.facts_status) || ["queued", "reading"].includes(d.tables_status)) ? "done" : (f.length || report?.facts_status ? "work" : ""),
    roles: nConf === 4 ? "done" : (Object.keys(r).length ? "work" : ""),
    compare: E.compare_status === "done" ? "done" : (E.compare_status ? "work" : ""),
    map: E.map_status === "done" ? "done" : (E.map_status ? "work" : ""),
    python: E.overlay_status === "done" ? "done" : (E.overlay_status ? "work" : ""),
    summary: E.charts_status === "done" ? "done" : (E.charts_status ? "work" : ""),
    bridge: E.overlay_status === "done" && E.roles.current_model ? "done" : "",
    doctor: E.doctor_status === "done" ? "done" : (E.doctor_status ? "work" : ""),
  };
}
function renderSteps() {
  const p = progress();
  const counts = E ? needs().reduce((a, n) => (a[n.go] = (a[n.go] || 0) + 1, a), {}) : {};
  $("#steps").innerHTML = NAV.map(s => s.sec ? `<div class="sec">${esc(s.sec)}</div>` : `<button data-s="${s.id}" class="${state.step === s.id ? "on" : ""}" ${!E ? "disabled" : ""} ${state.step === s.id ? 'aria-current="page"' : ""}>
      <span class="dot ${p[s.id] || ""}" aria-hidden="true">${p[s.id] === "done" ? "✓" : ""}</span><span class="nm">${esc(s.name)}</span>${counts[s.id] ? `<span class="cnt" title="${counts[s.id]} need you">${counts[s.id]}</span>` : ""}</button>`).join("");
  $("#steps").querySelectorAll("button").forEach(b => b.onclick = () => go(b.dataset.s));
}

function render(creating = false) {
  $("#hdrCtl").hidden = !E;
  if (!E) { $("#modelCtl").hidden = true; setAsk(false); }
  if (E) { $("#mSel").value = E.model || CFG.default_model; $("#rSel").value = E.reviewer_model || CFG.default_reviewer;
    $("#aSel").value = E.arbiter_model || CFG.default_arbiter; }
  renderSteps();
  renderNow();
  const m = $("#main");
  if (!E || creating) { m.innerHTML = viewNew(); bindNew(); $("#now").hidden = true; return; }
  const views = {overview: viewOverview, files: viewFiles, reference: viewReference, roles: viewRoles, compare: viewCompare, map: viewMap,
    python: viewPython, summary: viewSummary, bridge: viewBridge, doctor: viewDoctor};
  keepOpen(m, () => { m.innerHTML = (views[state.step] || viewFiles)(); bind[state.step]?.(); });
}
// A redraw (the page refreshes every couple of seconds while work runs) mustn't close a section you opened, or open
// one you closed: each <details> has a data-k (or an id), and its state carries over.
function keepOpen(root, draw) {
  const was = new Map([...root.querySelectorAll("details")].map(d => [d.dataset.k || d.id, d.open]).filter(([k]) => k));
  draw();
  root.querySelectorAll("details").forEach(d => { const k = d.dataset.k || d.id; if (k && was.has(k) && d.open !== was.get(k)) d.open = was.get(k); });
}

// ---- the status panel: what's happening now, where each stage is, and what needs you ------------------------
// Worked out from the engagement on every refresh; redrawn only when something changed, so the animations run on.
const WB_FLOW = ["Open the file", "Row map, sheet by sheet", "Target and valuation date", "Compare with an earlier version"];

    else if (s === "error") Object.assign(x, {state: "error", line: "failed", todo: {text: `Retry: ${verb.toLowerCase()}`, go: id}});

// ---- time: elapsed, an estimate of what's left, and how long a finished job took ------------------------------
// The server's clock (E.now when the engagement was fetched), so timers agree with the recorded start times.
const clock = () => E ? E.now + (Date.now() - (E._fetched || Date.now())) / 1000 : Date.now() / 1000;
function dur(secs) {

  const m = Math.floor(secs / 60), h = Math.floor(m / 60);

}
function left(secs) {

// started: when it began (server seconds); pct: progress 0-1 if the job reports it; last: the last run's seconds
function timing(started, pct, last) {

  const el = Math.max(0, clock() - started), bits = [`${dur(el)} elapsed`];
  if (pct >= 0.05 && pct < 1 && el >= 5) bits.push(left(el * (1 - pct) / pct));
  else if (last && last > el) bits.push(`${left(last - el)} (last run took ${dur(last)})`);

}

function heatmap(box, flows, order, ov) {
  const live = flows.filter(f => f.live > 0);
  if (!live.length) { box.innerHTML = `<p class="muted small" style="margin:0">No links between sheets.</p>`; return; }
  const src = order.filter(s => live.some(f => f.src_sheet === s)), dst = order.filter(s => live.some(f => f.dst_sheet === s));
  const n = Object.fromEntries(live.map(f => [f.src_sheet + "\u0000" + f.dst_sheet, f.live]));
  const max = Math.max(...live.map(f => f.live));
  // seven log-spaced steps of one blue ramp: few (light) to many (dark)
  const step = v => Math.min(7, 1 + Math.floor(6 * Math.log(v) / Math.log(Math.max(max, 2))));
  const whiteText = tok("color-scheme") === "dark" ? [1, 2, 3, 4, 5] : [5, 6, 7];
  box.innerHTML = `<table class="heat"><thead><tr><th></th>${dst.map(s => `<th class="col ${ov.has(s) ? "ov" : ""}">${esc(s)}</th>`).join("")}</tr></thead><tbody>
    ${src.map(a => `<tr><th style="text-align:right" class="${ov.has(a) ? "ov" : ""}">${esc(a)}</th>${dst.map(b => {
      const v = n[a + "\u0000" + b];
      if (!v) return `<td class="z"></td>`;
      const k = step(v);
      return `<td style="background:var(--q${k});color:${whiteText.includes(k) ? "#fff" : "#1a1a24"}" data-tip="<b>${esc(a)}</b> reads <b>${esc(b)}</b><br>${nfmt(v)} row link${v > 1 ? "s" : ""}">${v >= 1000 ? kfmt(v) : v}</td>`;
    }).join("")}</tr>`).join("")}</tbody></table>
    <div class="legend">Fewer ${[1, 2, 3, 4, 5, 6, 7].map(k => `<i style="background:var(--q${k})"></i>`).join("")} more links (log scale, up to ${nfmt(max)})</div>`;
  const tip = $("#tip");
  box.onmousemove = ev => {
    const td = ev.target.closest("td[data-tip]");
    if (!td) { tip.style.display = "none"; return; }
    tip.innerHTML = td.dataset.tip; tip.style.display = "block";
    tip.style.left = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (ev.clientY + 14) + "px";
  };
  box.onmouseleave = () => tip.style.display = "none";
}

// ---- what needs you: one list, from everything the engagement knows ---------------------------------------
function needs() {
  if (!E) return [];
  const out = [], docs = E.documents, wbs = E.workbooks, r = E.roles, name = x => shortName(x.filename);
  const add = (text, go, why) => out.push({text, go, why});
  for (const x of [...docs, ...wbs]) if (x.status === "error") add(`Retry ${name(x)}: it couldn't be read`, "files");
  for (const d of docs) if (d.facts_status === "error") add(`Extract the key facts again from ${name(d)}`, "reference");
  if (!docs.length) add("Upload last year's report", "files");
  if (wbs.length < 2) add("Upload last year's client model, the overlay and this year's client model", "files");
  const reading = docs.some(d => busy(d.status) || busy(d.facts_status)) || wbs.some(w => busy(w.status));
  const nConf = Object.values(r).filter(x => x.confirmed).length;
  if (!reading && Object.keys(r).length && nConf < 4 && !E.roles_pending) add(`Confirm who's who: ${4 - nConf} file role(s) suggested, not confirmed`, "roles");
  const facts = E.facts.filter(needsYou).length;
  if (facts) add(`Decide ${facts} report fact(s) the agents couldn't settle`, "reference");
  const tables = docs.filter(d => d.status === "done").reduce((a, d) => a + (d.n_flagged || 0), 0);
  if (tables) add(`Check ${tables} table(s) the agents couldn't settle`, "reference");
  if (nConf === 4) for (const [key, go, verb] of [["compare", "compare", "Compare the client models"], ["map", "map", "Build the map"], ["overlay", "python", "Build the Python overlay"]]) {
    const st = E[`${key}_status`];
    if (st === "error") add(`${verb} again: it failed`, go);
    else if (!st) add(verb, go);
  }
  if (E.charts_status === "error") add("Recreate the report's charts again: it failed", "summary");
  const V = E.overlay?.validation;
  if (E.overlay_status === "done" && V && V.matched < V.cells) {
    const why = [Object.keys(V.unsupported || {}).length && `functions ${Object.keys(V.unsupported).slice(0, 4).join(", ")}`,
      E.overlay.stats?.missing_names?.length && `names ${E.overlay.stats.missing_names.slice(0, 3).join(", ")}`,
      E.overlay.not_compiled?.length && `${E.overlay.not_compiled.length} formula(s) not compiled`].filter(Boolean).join("; ");
    add(`The Python overlay differs from Excel in ${(V.cells - V.matched).toLocaleString()} formula cell(s)${why ? `: ${why}` : ""}${E.doctor_status ? "" : ". The doctor finds where and why"}`, "doctor");
  }
  if (E.overlay_status === "done" && E.overlay?.roll?.months_assumed) add(`Check the roll-forward: ${E.overlay.roll.months} months was assumed`, "python");
  const sumErr = ((OVR.eid === E.id ? OVR.sum : null)?.table?.rows || []).filter(r => r.kind === "conclusion" && Object.values(r.values || {}).some(v => typeof v === "string" && v.startsWith("#"))).length;
  if (E.overlay_status === "done" && sumErr && !(V && V.matched < V.cells) && !E.doctor_status) add(`Run the doctor: ${sumErr} figure(s) come out as errors on this year's model`, "doctor");
  if (E.doctor_status === "error") add("Run the doctor again: it failed", "doctor");
  const sum = OVR.eid === E.id ? OVR.sum : null;
  for (const row of sum?.table?.rows || []) if (row.kind === "conclusion" && row.tie && !row.tie.ok)
    add(`${row.label} doesn't tie: rebuilt ${sumNum(row, row.values?.rebuilt)} vs the report's ${row.report}`, "summary");
  for (const c of sum?.charts?.charts || []) if (c.picks && c.matches === false) add(`The report's chart “${c.caption || c.read?.title || c.id}” doesn't match its rebuild`, "summary");
  for (const b of (OVR.eid === E.id ? OVR.br?.bridges : null) || []) if (b.note) add(`${b.label}: ${b.note}`, "bridge");
  return out;
}

    for (;;) { const {value, done} = await reader.read(); if (done) break; buf += dec.decode(value, {stream: true});
      let i; while ((i = buf.indexOf("\n")) >= 0) { handle(JSON.parse(buf.slice(0, i))); buf = buf.slice(i + 1); } }
  } catch (e) { handle({type: "error", text: `Couldn't get an answer: ${e.message}`}); }
  a.querySelector(".pulse")?.remove();
  label.textContent = `Lookups: ${calls} tool call${calls === 1 ? "" : "s"}, ${nfmt(chars)} characters read`;
  if (answer) CHAT.history.push({role: "user", content: text}, {role: "assistant", content: answer});
  CHAT.streaming = false;
  if (CHAT.eid === eid) {
    // keep the thread without live chart objects; charts are re-mounted from their JSON when the tab is drawn again
    const copy = thread.cloneNode(true); copy.querySelectorAll(".chart-card").forEach(c => { c.querySelector(".chart-box").innerHTML = `<canvas role="img"></canvas>`; });
    CHAT.html = copy.innerHTML;
  }
  const s = $("#send"); if (s) { s.disabled = false; $("#question")?.focus(); }
  if (!$("#newChat") && CHAT.history.length && $("#ovAsk")) { $("#ovAsk").innerHTML = ovAskPane(); bindOvAsk(); }
  spend();
}

// ---- tables: a header sits the way its column does -------------------------------------------------------------
// App tables mark figure cells "num" (right-aligned); the header over such a column is right-aligned to match, and
// one over text isn't. Tables the app didn't write (report transcriptions, chat answers) have their figure
// columns right-aligned by content. Runs on every table drawn, by watching the page.
const FIGURE = /^[\s(−–-]*(?:[A-Z]{1,3}\s?)?[$€£]?\s?\d[\d,]*(?:\.\d+)?\s?(?:%|x|m|bn|k|pp|bp)?\)?\*?\s*$/i;
function alignColumns(root) {
  root.querySelectorAll("table").forEach(t => {
    if (t.classList.contains("heat") || !t.rows.length) return;
    const head = t.tHead?.rows[0] || ([...t.rows[0].cells].every(c => c.tagName === "TH") ? t.rows[0] : null);
    if (!head || [...head.cells].some(c => c.colSpan > 1)) return;
    const rows = [...t.rows].filter(r => r !== head && r.parentElement?.tagName !== "THEAD");
    if (!rows.length) return;
    const byContent = !!t.closest(".md, .answer");
    [...head.cells].forEach((th, i) => {
      let n = 0, right = 0;
      for (const tr of rows) {
        const td = tr.cells[i];
        if (!td || td.colSpan > 1 || !td.textContent.trim()) continue;
        n++;
        if (td.classList.contains("num") || (byContent && FIGURE.test(td.textContent.trim()))) right++;
      }
      const isFigures = n > 0 && right / n >= 0.6;
      th.classList.toggle("num", isFigures);
      if (byContent && isFigures) rows.forEach(tr => { const td = tr.cells[i]; if (td && td.colSpan === 1) td.classList.add("num"); });
    });
  });
}
let alignTimer = null;
new MutationObserver(() => { clearTimeout(alignTimer); alignTimer = setTimeout(() => alignColumns($("#main")), 20); })
  .observe($("#main"), {childList: true, subtree: true});

// ---- tokens, time and the call log (from the spend chip) ---------------------------------------------------------
let CALLS = null;
const tokfmt = n => (n || 0) >= 1e6 ? ((n || 0) / 1e6).toFixed(2) + "M" : (n || 0) >= 1e3 ? ((n || 0) / 1e3).toFixed(1) + "k" : String(n || 0);
const usdf = v => v == null ? "–" : v < 0.01 && v > 0 ? "<$0.01" : "$" + Number(v).toFixed(v < 1 ? 3 : 2);
function whose(r) {
  if (r.document) return CALLS.names.documents[r.document] || `report #${r.document}`;
  if (r.workbook) return CALLS.names.workbooks[r.workbook] || `workbook #${r.workbook}`;
  return "The engagement (roles, compare, chat)";
}
async function openCalls() {
  if (!E) return;
  $("#callsDlg").showModal();
  $("#callsBody").innerHTML = `<p class="muted">Loading…</p>`;
  try { CALLS = await api(`/api/engagements/${E.id}/calls`); } catch (e) { $("#callsBody").innerHTML = `<div class="callout bad">${esc(e.message)}</div>`; return; }
  const c = CALLS.calls, t = c.total || {};
  const sumCols = [["Calls", r => nfmt(r.calls), 1], ["Input tokens", r => tokfmt(r.input_tokens), 1], ["of them cached", r => tokfmt(r.cached_tokens), 1],
    ["Output tokens", r => tokfmt(r.output_tokens), 1], ["Cost", r => usdf(r.cost_usd), 1], ["Model time", r => dur(r.model_secs), 1]];
  const table = (rows, cols) => rows.length ? `<div class="scroll"><table><thead><tr>${cols.map(x => `<th${x[2] ? ' class="num"' : ""}>${x[0]}</th>`).join("")}</tr></thead><tbody>
    ${rows.map(r => `<tr${r.id ? ` class="click" data-call="${r.id}"` : ""}>${cols.map(x => `<td${x[2] ? ' class="num"' : ""}>${x[1](r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : `<p class="small muted" style="margin:0">Nothing yet.</p>`;
  $("#callsBody").innerHTML = `
    <div class="tiles">
      <div class="tile"><b>${nfmt(t.calls)}</b><span>model calls${t.failed ? ` (${t.failed} failed)` : ""}</span></div>
      <div class="tile"><b>${tokfmt((t.input_tokens || 0) + (t.output_tokens || 0))}</b><span>tokens (${tokfmt(t.cached_tokens)} input cached)</span></div>
      <div class="tile"><b>${usdf(t.cost_usd)}</b><span>at list prices</span></div>
      <div class="tile"><b>${dur(t.model_secs) || "0s"}</b><span>waiting on the models</span></div>
    </div>
    <div class="card"><h2>By file</h2><p class="sub">Model calls for each report and workbook, and for the engagement itself.</p>${table(c.by_file || [], [["File", r => esc(whose(r))], ...sumCols])}</div>
    <div class="card"><h2>Time on the clock, by job</h2><p class="sub">From start to finish, including waits for rate-limit room and work that needs no model.</p>
      ${table(CALLS.jobs, [["File", r => esc(r.file || "The engagement")], ["Job", r => esc(r.job)], ["Took", r => dur(r.secs) + (r.build_secs ? ` <span class="small muted">(row map ${dur(r.build_secs)})</span>` : ""), 1]])}</div>
    <div class="card"><h2>By step</h2><p class="sub">What each call was for, in the order the steps ran.</p>
      ${table(c.by_step || [], [["File", r => esc(whose(r))], ["Step", r => esc(r.step || "")], ["Purpose", r => `<span class="mono small">${esc(r.purpose || "")}</span>`], ["Model", r => esc(r.model)], ...sumCols])}</div>
    <div class="card"><h2>Latest calls</h2><p class="sub">Click a call to see exactly what was sent and what came back. Kept on this machine in <span class="mono">${esc(CALLS.log_file)}</span> (not in git; it holds report text). Calls from before this log existed aren't in it.</p>
      ${table(c.recent || [], [["When", r => new Date(r.ts * 1000).toLocaleTimeString()], ["File", r => esc(whose(r))], ["Step", r => esc(r.step || "")], ["Purpose", r => `<span class="mono small">${esc(r.purpose || "")}</span>`],
        ["Model", r => esc(r.model)], ["In", r => tokfmt(r.input_tokens), 1], ["Out", r => tokfmt(r.output_tokens), 1], ["Cost", r => usdf(r.cost_usd), 1], ["Time", r => dur(r.secs), 1],
        ["", r => r.ok ? "" : `<span class="pill bad" title="${esc(r.error || "")}">failed</span>`]])}
      <div id="callDetail" class="transcript"></div></div>`;
  document.querySelectorAll("#callsBody [data-call]").forEach(tr => tr.onclick = () => showCall(+tr.dataset.call));
}
function msgText(m) {
  if (typeof m === "string") return m;
  if (Array.isArray(m)) return m.map(msgText).join("\n\n");
  if (m && typeof m === "object") {
    if (m.type === "function_call_output") return `[tool result]\n${m.output}`;
    if (m.type === "function_call") return `[tool call] ${m.name}(${m.arguments})`;
    if (m.type === "input_image") return "[image sent: not kept]";
    if (m.type === "input_text" || m.type === "output_text") return m.text;
    if (m.content !== undefined) return `[${m.role || m.type || "message"}]\n${msgText(m.content)}`;
    if (m.type === "reasoning") return "[reasoning]";
    return JSON.stringify(m);
  }
  return String(m ?? "");
}
async function showCall(id) {
  const box = $("#callDetail"); box.innerHTML = `<p class="muted">Loading…</p>`;
  let c; try { c = await api(`/api/engagements/${E.id}/calls/${id}`); } catch (e) { box.innerHTML = `<div class="callout bad">${esc(e.message)}</div>`; return; }
  const q = c.request || {};
  box.innerHTML = `<div style="border-top:1px solid var(--rule);margin-top:12px;padding-top:12px">
    <div class="row small"><b>Call ${c.id}</b><span class="muted">${new Date(c.ts * 1000).toLocaleString()} · ${esc(c.model)} · ${esc(c.purpose)} · ${esc(c.step || "")} · ${tokfmt(c.input_tokens)} in, ${tokfmt(c.output_tokens)} out · ${usdf(c.cost_usd)} · ${dur(c.secs)}</span>${c.ok ? "" : `<span class="pill bad">${esc(c.error)}</span>`}</div>
    ${q.instructions ? `<div class="small muted" style="margin-top:8px">Instructions</div><pre>${esc(q.instructions)}</pre>` : ""}
    <div class="small muted">Sent${q.format ? ` (answer as ${esc(q.format)})` : ""}${q.tools ? ` with tools: ${esc(q.tools.join(", "))}` : ""}</div><pre>${esc(msgText(q.input))}</pre>
    <div class="small muted">Came back</div><pre>${esc(c.response || "(nothing)")}</pre></div>`;
  box.scrollIntoView({block: "nearest", behavior: "smooth"});
}
$("#spend").onclick = openCalls;
$("#callsClose").onclick = () => $("#callsDlg").close();

boot().catch(e => { $("#main").innerHTML = `<div class="callout bad">Couldn't start: ${esc(e.message)}</div>`; });
</script>
