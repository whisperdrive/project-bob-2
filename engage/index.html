<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valuation Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;600;700&family=Noto+Sans+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/* Palette: off-black #2e2e38 / #1a1a24, ground #f6f6fa, greys #c4c4cd / #747480, yellow #ffe600, blue #1a9afa. */
:root {
  --ground: #f6f6fa; --surface: #ffffff; --raised: #fbfbfd; --ink: #2e2e38; --muted: #6b6b78; --rule: #e1e1e6;
  --rule-strong: #c4c4cd; --bar: #1a1a24; --bar-ink: #ffffff; --bar-muted: #c4c4cd; --yellow: #ffe600;
  --on-yellow: #2e2e38; --link: #1270c2; --blue: #1a9afa;
  --ok-bg: #e5f3ea; --ok: #16692f; --warn-bg: #fff3cc; --warn: #7a5200; --bad-bg: #fbe7e5; --bad: #a3261c;
  --info-bg: #e3f1fd; --info: #0f5a9c; --code-bg: #f0f0f4;
  --sans: "Noto Sans", system-ui, -apple-system, sans-serif; --mono: "Noto Sans Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #1a1a24; --surface: #23232f; --raised: #2a2a36; --ink: #f0f0f5; --muted: #a8a8b5; --rule: #34343f;
    --rule-strong: #4a4a57; --bar: #121219; --link: #4bb0fb; --blue: #1a9afa;
    --ok-bg: #173323; --ok: #7fd49a; --warn-bg: #3a3012; --warn: #f3cf62; --bad-bg: #3d1d1b; --bad: #f4a39b;
    --info-bg: #15304a; --info: #8cc8f7; --code-bg: #2e2e38; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #1a1a24; --surface: #23232f; --raised: #2a2a36; --ink: #f0f0f5; --muted: #a8a8b5; --rule: #34343f;
  --rule-strong: #4a4a57; --bar: #121219; --link: #4bb0fb; --blue: #1a9afa;
  --ok-bg: #173323; --ok: #7fd49a; --warn-bg: #3a3012; --warn: #f3cf62; --bad-bg: #3d1d1b; --bad: #f4a39b;
  --info-bg: #15304a; --info: #8cc8f7; --code-bg: #2e2e38; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 300 15px/1.55 var(--sans); }
b, strong, th, h1, h2, h3 { font-weight: 600; }
a { color: var(--link); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.small { font-size: 13px; }
.nowrap { white-space: nowrap; }

/* header */
header { background: var(--bar); color: var(--bar-ink); position: sticky; top: 0; z-index: 10; }
.hbar { display: flex; align-items: center; gap: 14px; padding: 10px 24px; max-width: 1360px; margin: 0 auto; flex-wrap: wrap; }
.brand { display: flex; align-items: flex-end; gap: 10px; text-decoration: none; color: inherit; }
.brand .mark { width: 5px; align-self: stretch; background: var(--yellow); border-radius: 1px; }
.brand .name { font-size: 18px; font-weight: 600; letter-spacing: .1px; line-height: 1; }
.brand .sub { font-size: 12px; color: var(--bar-muted); font-weight: 400; line-height: 1; margin-left: 2px; }
.hsp { flex: 1; }
.hctl { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--bar-muted); flex-wrap: wrap; }
.hctl select { background: #2e2e38; color: #fff; border: 1px solid #4a4a57; border-radius: 4px; padding: 4px 8px; font-size: 13px; max-width: 280px; }
.chip { background: #2e2e38; border: 1px solid #4a4a57; color: #fff; border-radius: 99px; padding: 3px 10px; font-size: 12.5px; cursor: default; white-space: nowrap; }
.yellow-rule { height: 3px; background: var(--yellow); }

/* steps */
nav.steps { display: flex; gap: 0; max-width: 1360px; margin: 0 auto; padding: 0 24px; overflow-x: auto; }
nav.steps button { background: none; border: 0; border-bottom: 3px solid transparent; color: var(--bar-muted); padding: 10px 16px 9px;
  cursor: pointer; font-size: 14px; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
nav.steps button:hover { color: #fff; }
nav.steps button.on { color: #fff; border-bottom-color: var(--yellow); font-weight: 600; }
nav.steps button:disabled { opacity: .45; cursor: not-allowed; }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #74747f; display: inline-grid; place-items: center; font-size: 11px; font-weight: 600; }
.dot.done { background: var(--yellow); border-color: var(--yellow); color: #2e2e38; }
.dot.work { border-color: var(--blue); color: var(--blue); }

main { max-width: 1360px; margin: 0 auto; padding: 22px 24px 60px; display: grid; gap: 18px; }
.lede { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.lede h1 { font-size: 24px !important; margin: 0; font-weight: 300; }
.lede h1 b { font-weight: 600; }
.lede p { margin: 4px 0 0; color: var(--muted); max-width: 820px; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 18px; min-width: 0; }
.card > h2, .card h2, .lede h1, .node .small b { font-size: 16px; margin: 0 0 2px; overflow-wrap: anywhere; }
.card > .sub { font-size: 13.5px; color: var(--muted); margin: 0 0 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 18px; }
.stack { display: grid; gap: 18px; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px; }

.btn { background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 6px 14px; cursor: pointer; font-size: 14px; font-weight: 400; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--yellow); border-color: var(--yellow); color: var(--on-yellow); font-weight: 600; }
.btn.primary:hover { filter: brightness(.95); }
.btn.small { padding: 3px 9px; font-size: 12.5px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--link); padding-left: 4px; padding-right: 4px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
input[type=text], select.in, textarea { background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 6px 9px; font-size: 14px; }
textarea { width: 100%; font-family: var(--mono); font-size: 12.5px; min-height: 160px; }

.pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--code-bg); color: var(--muted); white-space: nowrap; letter-spacing: .1px; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.info { background: var(--info-bg); color: var(--info); }
.callout { border-radius: 4px; padding: 10px 14px; font-size: 14px; border-left: 4px solid; }
.callout.warn { background: var(--warn-bg); color: var(--warn); border-color: #e0b400; }
.callout.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.callout.info { background: var(--info-bg); color: var(--info); border-color: var(--blue); }

.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font-size: 12px; color: var(--muted); padding: 7px 10px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap; font-weight: 600; }
td { padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tr.sel td { background: var(--raised); }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--raised); }
.bar { height: 5px; border-radius: 3px; background: var(--rule); overflow: hidden; margin-top: 5px; min-width: 120px; }
.bar i { display: block; height: 100%; background: var(--blue); transition: width .4s; }

.drop { border: 2px dashed var(--rule-strong); border-radius: 6px; padding: 26px; text-align: center; background: var(--raised); cursor: pointer; }
.drop.over { border-color: var(--yellow); background: var(--warn-bg); }
.drop b { font-size: 16px; }
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; margin-top: 14px; text-align: left; }
.slot { border: 1px solid var(--rule); border-radius: 4px; padding: 9px 12px; background: var(--surface); font-size: 13px; }
.slot b { display: block; font-size: 13.5px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--rule); border-radius: 4px; padding: 10px 14px; background: var(--surface); }
.tile b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile span { font-size: 12.5px; color: var(--muted); }

.md { font-size: 14px; }
.md table { width: auto; margin: 8px 0; }
.md td, .md th { border: 1px solid var(--rule); padding: 4px 8px; }
.md h2 { font-size: 15px; border-top: 1px solid var(--rule); padding-top: 12px; margin-top: 18px; }
.md h3 { font-size: 14px; }
.review { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 900px) { .review { grid-template-columns: 1fr; } }
.review img { max-width: 100%; border: 1px solid var(--rule); background: #fff; border-radius: 3px; }
.checks { list-style: none; padding: 0; margin: 0; font-size: 12.5px; }
.checks li::before { content: "✓ "; color: var(--ok); font-weight: 700; }
.checks li.no::before { content: "✗ "; color: var(--bad); }
details > summary { cursor: pointer; color: var(--link); font-size: 13px; }
.quote { font-size: 12.5px; color: var(--muted); border-left: 3px solid var(--rule-strong); padding-left: 8px; margin-top: 4px; }
.why { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--muted); }
.why li { margin: 2px 0; }

/* roles */
.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; align-items: stretch; }
@media (max-width: 900px) { .flow { grid-template-columns: 1fr; } }
.node { border: 1px solid var(--rule-strong); border-top: 4px solid var(--yellow); border-radius: 4px; padding: 12px 14px; background: var(--surface); position: relative; margin-right: 26px; }
.node:last-child { margin-right: 0; }
.node::after { content: "→"; position: absolute; right: -22px; top: 40%; color: var(--muted); font-size: 18px; }
.node:last-child::after { content: none; }
@media (max-width: 900px) { .node { margin-right: 0; margin-bottom: 22px; } .node::after { content: "↓"; right: 45%; top: auto; bottom: -24px; } }
.node h3 { margin: 0 0 6px; font-size: 14px; }
.node .small b { font-size: 13px; }
.node select { width: 100%; }
.sheets { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 12.5px; }
.sheets label { display: flex; gap: 4px; align-items: center; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--bar); color: #fff; padding: 9px 16px; border-radius: 4px; font-size: 14px; z-index: 30; border-left: 4px solid var(--yellow); max-width: 90vw; }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
@media (max-width: 640px) { .hbar, nav.steps, main { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header>
  <div class="hbar">
    <a class="brand" href="#" id="brand"><span class="mark" aria-hidden="true"></span><span><span class="name">Valuation Desk</span><br><span class="sub">Recurring valuation workbench</span></span></a>
    <div class="hsp"></div>
    <div class="hctl">
      <label for="engSel">Engagement</label><select id="engSel"></select>
      <button class="btn small" id="newEng" style="background:#2e2e38;color:#fff;border-color:#4a4a57">New</button>
    </div>
    <div class="hctl" id="modelCtl" hidden>
      <label for="mSel">Model</label><select id="mSel"></select>
      <label for="rSel">Reviewer</label><select id="rSel"></select>
      <span class="chip" id="spend" title="Azure model spend for this engagement">$0.00</span>
    </div>
  </div>
  <nav class="steps" id="steps"></nav>
  <div class="yellow-rule"></div>
</header>
<main id="main"></main>
<input type="file" id="picker" multiple accept=".pdf,.pptx,.xlsx,.xlsm" hidden>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const md = s => DOMPurify.sanitize(marked.parse(s || ""));
const fmt = (v, d = 1) => v == null || v === "" ? "" : (typeof v === "number" ? v.toLocaleString(undefined, {maximumFractionDigits: d, minimumFractionDigits: Math.abs(v) < 10 && d ? Math.min(d, 2) : 0}) : String(v));
const size = b => b > 1e6 ? (b / 1e6).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1e3)) + " KB";
const busy = s => ["queued", "processing", "running"].includes(s);
function toast(msg, ms = 3500) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), ms); }
async function api(path, opts = {}) {
  const r = await fetch(path, {headers: opts.body && !(opts.body instanceof FormData) ? {"Content-Type": "application/json"} : {}, ...opts,
    body: opts.body && !(opts.body instanceof FormData) ? JSON.stringify(opts.body) : opts.body});
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m } catch {} throw new Error(m); }
  return r.json();
}

const STEPS = [
  {id: "files", name: "Files"}, {id: "reference", name: "Report reference"}, {id: "roles", name: "Roles"},
  {id: "compare", name: "Compare models"}, {id: "map", name: "Map"}, {id: "python", name: "Python overlay"}];
const ROLE_HELP = {
  prior_report: "Last year's final report: conclusions and assumptions.",
  prior_model: "The client's model behind last year's valuation.",
  prior_overlay: "Our workings linking the client model to the report: a separate workbook, or sheets inside the client model.",
  current_model: "This year's client model, to roll the valuation forward.",
};
let CFG, E = null, state = {step: "files", doc: null, table: null, tableFilter: "flagged", factEdit: null, docView: null};
let uploads = [], pollTimer = null;

// ---- boot / navigation -------------------------------------------------------------------------------------
async function boot() {
  CFG = await api("/api/config");
  for (const id of ["mSel", "rSel"]) $("#" + id).innerHTML = CFG.models.map(m => `<option>${esc(m)}</option>`).join("");
  const h = new URLSearchParams(location.hash.slice(1));
  state.step = h.get("s") || "files";
  await loadList(+h.get("e") || null);
}
async function loadList(select) {
  const list = await api("/api/engagements");
  $("#engSel").innerHTML = list.length ? list.map(e => `<option value="${e.id}">${esc(e.name)}</option>`).join("") : `<option value="">No engagements yet</option>`;
  const id = select && list.some(e => e.id === select) ? select : list[0]?.id;
  if (id) { $("#engSel").value = id; await open(id); } else { E = null; render(); }
}
async function open(id) { E = await api(`/api/engagements/${id}`); state.doc = null; state.table = null; render(); schedule(); spend(); }
// While someone is typing (a fact or table edit, or any focused field), polling updates the data and the step
// dots but doesn't rebuild the page, so the edit isn't lost.
function editing() {
  const a = document.activeElement;
  return state.factEdit != null || state.editingTable || !!(a && a.closest("main") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
async function refresh(force = false) {
  if (!E) return;
  E = await api(`/api/engagements/${E.id}`);
  if (!force && editing()) renderSteps(); else render();
  schedule();
}
function schedule() {
  clearTimeout(pollTimer);
  if (!E) return;
  const working = E.documents.some(d => busy(d.status) || busy(d.facts_status)) || E.workbooks.some(w => busy(w.status))
    || busy(E.compare_status) || busy(E.map_status) || busy(E.overlay_status) || uploads.some(u => !u.done);
  if (working) pollTimer = setTimeout(async () => { await refresh(); spend(); }, 1500);
}
async function spend() {
  if (!E) return;
  try { const u = await api(`/api/usage?session=${encodeURIComponent(E.session)}`); const s = u.session || {};
    $("#spend").textContent = `$${(s.cost_usd || 0).toFixed(3)} · ${((s.input_tokens || 0) + (s.output_tokens || 0)).toLocaleString()} tokens`;
    $("#spend").title = `Azure model spend for this engagement: ${s.calls || 0} calls (list prices)`; } catch {}
}
$("#engSel").onchange = e => { if (e.target.value) { go(state.step, +e.target.value); open(+e.target.value); } };
$("#newEng").onclick = () => { E = null; state.step = "files"; render(true); };
$("#mSel").onchange = async e => { E = {...E, ...await api(`/api/engagements/${E.id}`, {method: "PATCH", body: {model: e.target.value}})}; toast(`Extraction model: ${e.target.value}`); };
$("#rSel").onchange = async e => { E = {...E, ...await api(`/api/engagements/${E.id}`, {method: "PATCH", body: {reviewer_model: e.target.value}})}; toast(`Reviewer model: ${e.target.value}`); };
function go(step, eid = E?.id) { state.step = step; history.replaceState(null, "", `#e=${eid || ""}&s=${step}`); render(); }

// ---- progress of each step ---------------------------------------------------------------------------------
function progress() {
  if (!E) return {};
  const report = E.documents.find(d => d.id === E.roles.prior_report?.id) || E.documents[0];
  const f = E.facts, approved = f.filter(x => x.status === "approved").length;
  const r = E.roles, nConf = Object.values(r).filter(x => x.confirmed).length;
  return {
    files: E.documents.length && E.workbooks.length >= 2 && !E.documents.some(d => busy(d.status)) && !E.workbooks.some(w => busy(w.status)) ? "done" : (E.documents.length + E.workbooks.length ? "work" : ""),
    reference: approved && !f.some(x => x.status === "pending") ? "done" : (f.length || report?.facts_status ? "work" : ""),
    roles: nConf === 4 ? "done" : (Object.keys(r).length ? "work" : ""),
    compare: E.compare_status === "done" ? "done" : (E.compare_status ? "work" : ""),
    map: E.map_status === "done" ? "done" : (E.map_status ? "work" : ""),
    python: E.overlay_status === "done" ? "done" : (E.overlay_status ? "work" : ""),
  };
}
function renderSteps() {
  const p = progress();
  $("#steps").innerHTML = STEPS.map((s, i) => `<button data-s="${s.id}" class="${state.step === s.id ? "on" : ""}" ${!E ? "disabled" : ""}>
      <span class="dot ${p[s.id] || ""}">${p[s.id] === "done" ? "✓" : i + 1}</span>${esc(s.name)}</button>`).join("");
  $("#steps").querySelectorAll("button").forEach(b => b.onclick = () => go(b.dataset.s));
}

function render(creating = false) {
  $("#modelCtl").hidden = !E;
  if (E) { $("#mSel").value = E.model || CFG.default_model; $("#rSel").value = E.reviewer_model || CFG.default_reviewer; }
  renderSteps();
  const m = $("#main");
  if (!E || creating) { m.innerHTML = viewNew(); bindNew(); return; }
  const views = {files: viewFiles, reference: viewReference, roles: viewRoles, compare: viewCompare, map: viewMap, python: viewPython};
  m.innerHTML = (views[state.step] || viewFiles)();
  bind[state.step]?.();
}

// ---- new engagement ----------------------------------------------------------------------------------------
function viewNew() {
  return `<div class="lede"><div><h1><b>Start an engagement</b></h1><p>One engagement per asset and year. You'll upload last year's report, last year's client model and overlay, and this year's client model; then check the report's key figures, confirm which file is which, compare the models and map them together.</p></div></div>
  <div class="card" style="max-width:640px"><h2>Engagement name</h2><p class="sub">For example the asset and the valuation year.</p>
  <form class="row" id="newForm"><input type="text" id="newName" placeholder="Asset name, FY26 valuation" style="flex:1;min-width:240px" required>
  <button class="btn primary">Create</button>${E ? `<button type="button" class="btn" id="cancelNew">Cancel</button>` : ""}</form></div>`;
}
function bindNew() {
  $("#newForm").onsubmit = async ev => { ev.preventDefault(); const e = await api("/api/engagements", {method: "POST", body: {name: $("#newName").value}}); state.step = "files"; await loadList(e.id); go("files", e.id); };
  $("#cancelNew")?.addEventListener("click", () => render());
  $("#newName").focus();
}

// ---- step 1: files -----------------------------------------------------------------------------------------
function statusCell(s, step, pct, err) {
  if (s === "error") return `<span class="pill bad">Failed</span><div class="small" style="color:var(--bad)">${esc(err)}</div>`;
  if (s === "done") return `<span class="pill ok">Ready</span>${err ? `<div class="small" style="color:var(--warn)">${esc(err)}</div>` : ""}`;
  return `<span class="pill info">${s === "queued" ? "Queued" : "Processing"}</span><div class="small muted">${esc(step || "")}</div><div class="bar"><i style="width:${Math.round((pct || 0) * 100)}%"></i></div>`;
}
function viewFiles() {
  const docs = E.documents, wbs = E.workbooks;
  const up = uploads.filter(u => !u.done || u.error);

  return `<div class="lede"><div><h1><b>Who's who</b></h1><p>Which file plays which part. The overlay is chosen as a set of sheets, because it sometimes sits inside a copy of the client model and sometimes stands alone. Suggestions come from the files: where the report's figures sit, which DCFs recompute in Python, external links and their cached values, and the model timelines.</p></div></div>
  <div class="row"><button class="btn ${Object.keys(r).length ? "" : "primary"}" id="suggest">${Object.keys(r).length ? "Suggest again" : "Suggest roles"}</button>

};

// ---- step 6: python overlay ------------------------------------------------------------------------------
const OV = {mode: "workbook", changes: {}, vd: null, months: null, result: null, running: false, trace: null, q: "", found: [], eid: null};
const serialToISO = s => new Date(Date.UTC(1899, 11, 30) + Math.round(s) * 86400000).toISOString().slice(0, 10);
function leverShown(l, v) {
  if (v == null || typeof v !== "number") return v ?? "";
  if (l.unit === "date" || l.key === "valuation_date") return serialToISO(v);
  return +(v / (l.scale || 1)).toPrecision(12);
}
function leverRaw(l, shown) {
  if (l.unit === "date" || l.key === "valuation_date") return shown;
  return +shown * (l.scale || 1);
}
function viewPython() {
  const head = `<div class="lede"><div><h1><b>Python overlay</b></h1><p>Last year's overlay rebuilt as a Python module from its own formulas: every formula cell becomes Python, checked against the value Excel saved, then against the report. Run it live: change the assumptions, or feed it from the prior or the current client model to roll the valuation forward.</p></div></div>`;
  if (!E.roles.prior_overlay) return head + `<div class="card empty">Assign the prior overlay in step 3 first.</div>`;
  if (OV.eid !== E.id) Object.assign(OV, {mode: "workbook", changes: {}, vd: null, months: null, result: null, trace: null, q: "", found: [], eid: E.id});
  const O = E.overlay;
  const run = `<div class="row"><button class="btn ${E.overlay_status === "done" ? "" : "primary"}" id="buildOv" ${busy(E.overlay_status) ? "disabled" : ""}>${E.overlay_status === "done" ? "Rebuild the Python overlay" : "Build the Python overlay"}</button>
    ${busy(E.overlay_status) ? `<span class="pill info">${esc(E.overlay_step || "Working")}</span>` : ""}${E.overlay_status === "error" ? `<span class="pill bad">Failed</span> <span class="small">${esc(E.overlay_error)}</span>` : ""}
    ${O ? `<a class="btn" href="/api/engagements/${E.id}/overlay/module.py" target="_blank" rel="noopener">Open the Python module</a>` : ""}
    ${!Object.values(E.roles).every(r => r.confirmed) ? `<span class="small muted">Roles aren't all confirmed; the build uses the current assignment.</span>` : ""}</div>`;
  if (!O) return head + run + `<div class="card"><h2>What the build does</h2><ul class="why" style="color:var(--ink);font-size:14px">
    <li>Compiles every formula on the overlay sheets into Python, one function per line item, with the Excel formula alongside.</li>
    <li>Recomputes every formula cell from the overlay's own inputs and compares each with the value Excel saved.</li>
    <li>Feeds it from the prior client model and checks the results don't move, then reruns the report's conclusions and sensitivities.</li>
    <li>Finds the levers (the report's assumptions) so you can change them and roll the valuation onto the current model.</li></ul></div>`;
  const v = O.validation, st = O.stats;
  const ties = O.outputs.filter(o => o.tie), tiesOk = ties.filter(o => o.tie.ok).length;
  const sens = O.sensitivities.filter(p => p.tie), sensOk = sens.filter(p => p.tie.ok).length;
  const pct = v.cells ? (100 * v.matched / v.cells) : 0;
  const tiles = [[`${v.matched.toLocaleString()} / ${v.cells.toLocaleString()}`, `formula cells reproduced (${pct.toFixed(pct === 100 ? 0 : 2)}%)`],
    [st.rows.toLocaleString(), "line items as Python functions"],
    [ties.length ? `${tiesOk} / ${ties.length}` : "–", "report conclusions tie"],
    [sens.length ? `${sensOk} / ${sens.length}` : "–", "report sensitivities reproduced"],
    [O.feeds.prior ? (O.feeds.prior.same ? "unchanged" : "moves") : (O.wiring?.same_file ? "same file" : "–"), "results fed from the prior client model"]];
  return head + run + `
  ${!O.reference_approved ? `<div class="callout warn">Built with report facts that aren't all approved; levers and tie-out may be incomplete. Approve them in step 2 and rebuild.</div>` : ""}
  <div class="tiles">${tiles.map(([b, t]) => `<div class="tile"><b>${esc(b)}</b><span>${esc(t)}</span></div>`).join("")}</div>
  ${validationCard(O)}
  ${busy(E.overlay_status) ? `<div class="card empty">Rebuilding the module… the live panel comes back when it's done.</div>` : `<div class="card" id="ovLive">${liveCard(O)}</div>`}
  ${tieCard(O)}
  <div class="card"><h2>The module</h2><p class="sub">${esc(O.files.overlay || "")}, sheets ${esc(O.sheets.join(", "))}: ${st.formula_cells.toLocaleString()} formula cells in ${st.rows.toLocaleString()} functions (${st.branches.toLocaleString()} branches). Each function returns its line item's value for a column; the Excel formula is in the comment beside each branch.
  ${st.volatile?.length ? ` Volatile functions (${esc(st.volatile.join(", "))}) depend on the day or the file and won't match.` : ""}</p>
  <div class="row"><a class="btn" href="/api/engagements/${E.id}/overlay/module.py" target="_blank" rel="noopener">Open overlay_e${E.id}.py</a><span class="small muted">Runtime: bench/xlruntime.py · compiler: bench/xlcompile.py</span></div></div>`;
}
function validationCard(O) {
  const v = O.validation, st = O.stats, issues = [];
  if (Object.keys(v.quirks || {}).length) issues.push(...Object.entries(v.quirks).map(([k, n]) => `Excel behaviour reproduced on purpose: ${k} (${n} cell(s)).`));
  if (Object.keys(v.unsupported || {}).length) issues.push(`Functions not yet supported: ${Object.keys(v.unsupported).join(", ")}.`);
  if (v.cycles) issues.push(`${v.cycles} circular reference(s): the saved value is used there.`);
  if (O.not_compiled?.length) issues.push(`${O.not_compiled.length} formula(s) couldn't be compiled.`);
  if (!v.mismatches.length && !issues.length) return "";
  return `<div class="card"><h2>Validation details</h2>${issues.map(i => `<div class="callout info small" style="margin-bottom:6px">${esc(i)}</div>`).join("")}
  ${v.mismatches.length ? `<div class="scroll"><table><thead><tr><th>Cell</th><th>Line item</th><th class="num">Python</th><th class="num">Excel</th><th>Formula</th></tr></thead><tbody>
  ${v.mismatches.map(m => `<tr><td class="mono">${esc(m.cell)}</td><td class="small">${esc(m.label)}</td><td class="num">${esc(fmt(m.python, 6))}</td><td class="num">${esc(fmt(m.workbook, 6))}</td><td class="mono small">${esc((m.formula || "").slice(0, 120))}</td></tr>`).join("")}</tbody></table></div>` : ""}</div>`;
}
function tieCard(O) {
  const outs = O.outputs.filter(o => o.report), sens = O.sensitivities;
  if (!outs.length && !sens.length) return "";
  return `<div class="card"><h2>Tie-out to the report</h2><p class="sub">The module's results rounded to the report's printed precision. Sensitivities are rerun by setting the discount rate and growth levers to the report's values.</p>
  ${outs.length ? `<div class="scroll"><table><thead><tr><th>Conclusion</th><th>Cell</th><th class="num">Report</th><th class="num">Python</th><th></th></tr></thead><tbody>
  ${outs.map(o => `<tr><td>${esc(o.label)}</td><td class="mono">${esc(o.cell)}</td><td class="num">${esc(o.report)}</td><td class="num">${esc(fmt(o.tie?.python, 2))}</td><td>${o.tie ? (o.tie.ok ? `<span class="pill ok">Ties</span>` : `<span class="pill bad">Differs</span>`) : ""}</td></tr>`).join("")}</tbody></table></div>` : ""}
  ${sens.length ? `<details ${sens.some(p => p.tie && !p.tie.ok) ? "open" : ""} style="margin-top:10px"><summary>Sensitivities (${sens.filter(p => p.tie?.ok).length} of ${sens.length} reproduced)</summary><div class="scroll"><table><thead><tr><th>Scenario</th><th>Levers set</th><th class="num">Report</th><th class="num">Python</th><th></th></tr></thead><tbody>
  ${sens.map(p => `<tr><td>${esc(p.basis)}</td><td class="mono small">${esc(Object.entries(p.set || {}).map(([k, v]) => `${k} = ${+v.toPrecision(10)}`).join(", "))}</td><td class="num">${esc(p.report)}</td><td class="num">${esc(fmt(p.tie?.python, 2))}</td>
    <td>${p.skip ? `<span class="small muted">${esc(p.skip)}</span>` : p.tie ? (p.tie.ok ? `<span class="pill ok">Reproduced</span>` : `<span class="pill bad">Differs</span>`) : ""}</td></tr>`).join("")}</tbody></table></div></details>` : ""}</div>`;
}
function liveCard(O) {
  const w = O.wiring || {}, roll = O.roll || {};
  const modes = [["workbook", "As saved", "the client values saved in the overlay workbook"], ["prior", "Prior client model", w.prior ? "read from " + w.prior.filename : "no prior client model assigned"],
    ["current", "Current model, rolled forward", w.current ? "read from " + w.current.filename : "no current client model assigned"]];
  const avail = {workbook: true, prior: !!w.prior, current: !!w.current};
  const nChanges = Object.keys(OV.changes).length;
  return `<div class="row" style="justify-content:space-between"><div><h2>Run it live</h2><p class="sub">Change a lever or any input; results update as you type.</p></div>
    <div class="row" role="radiogroup" aria-label="Feed">${modes.map(([m, t, why]) => `<button class="btn small ${OV.mode === m ? "primary" : ""}" data-mode="${m}" title="${esc(why)}" ${avail[m] ? "" : "disabled"} role="radio" aria-checked="${OV.mode === m}">${esc(t)}</button>`).join("")}</div></div>
  ${OV.mode === "current" ? `<div class="row small" style="margin-bottom:10px;gap:14px"><label>New valuation date <input type="date" id="ovVd" value="${esc(OV.vd || roll.current_valuation_date || "")}"></label>
    <label>Roll forward by <input type="text" id="ovMonths" value="${esc(OV.months ?? roll.months ?? 12)}" style="width:52px"> months</label>
    <span class="muted">Overlay periods move on by the roll; client values come from the same line item in the period with the rolled date${roll.valuation_date_cell ? `; valuation date cell ${esc(roll.valuation_date_cell)}` : "; no valuation-date lever found, so set it below"}.</span></div>` : ""}
  <div class="grid2">
    <div><h3 style="font-size:14px;margin:0 0 6px">Levers <span class="muted small">(the report's assumptions, found in the overlay)</span></h3>
    ${O.levers.length ? `<div class="scroll"><table><thead><tr><th>Assumption</th><th>Cell</th><th class="num">Report</th><th>Value</th></tr></thead><tbody>
    ${O.levers.map(l => { const cur = OV.changes[l.cell]; const isDate = l.unit === "date" || l.key === "valuation_date";
      const shown = cur !== undefined ? (isDate ? cur : leverShown(l, cur)) : leverShown(l, l.value);
      return `<tr><td>${esc(l.label)}<div class="small muted">${esc(l.row_label || "")}</div></td><td class="mono small">${esc(l.cell)}${l.formula ? ` <span class="pill">formula</span>` : ""}</td><td class="num small">${esc(l.report || "")}</td>
      <td><input type="${isDate ? "date" : "text"}" data-lever="${esc(l.cell)}" value="${esc(shown)}" style="width:${isDate ? 150 : 110}px" aria-label="${esc(l.label)}">${!isDate && l.unit === "%" ? " %" : ""}${cur !== undefined ? ` <button class="btn small ghost" data-unset="${esc(l.cell)}">reset</button>` : ""}</td></tr>`; }).join("")}</tbody></table></div>` : `<p class="small muted">No levers: approve the report's assumptions in step 2 and rebuild, or change inputs directly.</p>`}
    <h3 style="font-size:14px;margin:14px 0 6px">Any other input</h3>
    <div class="row"><input type="text" id="ovQ" placeholder="Search the overlay's inputs by label or cell" value="${esc(OV.q)}" style="flex:1;min-width:200px"></div>
    <div id="ovFound">${foundList()}</div>
    ${nChanges ? `<div class="row small" style="margin-top:10px"><b>Changes:</b> ${Object.entries(OV.changes).map(([k, v]) => `<span class="pill info">${esc(k)} = ${esc(typeof v === "number" ? +v.toPrecision(10) : v)} <a href="#" data-unset="${esc(k)}" aria-label="Remove">×</a></span>`).join(" ")} <button class="btn small ghost" id="ovClear">Clear all</button></div>` : ""}
    </div>
    <div><h3 style="font-size:14px;margin:0 0 6px">Results ${OV.running ? `<span class="pill info">Calculating…</span>` : ""}</h3><div id="ovResults">${resultsTable()}</div></div>
  </div>
  <div id="ovTrace">${traceBlock()}</div>`;
}
function foundList() {
  if (!OV.found.length) return OV.q ? `<p class="small muted">No numeric inputs match.</p>` : "";
  return `<div class="scroll" style="max-height:220px;overflow-y:auto"><table><tbody>${OV.found.map(x => `<tr><td class="mono small">${esc(x.cell)}</td><td class="small">${esc(x.label)}</td>
    <td><input type="text" data-input="${esc(x.cell)}" value="${esc(OV.changes[x.cell] ?? +x.value.toPrecision(12))}" style="width:110px" aria-label="${esc(x.cell)}"></td></tr>`).join("")}</tbody></table></div>`;
}
function resultsTable() {
  const r = OV.result;
  if (!r) return `<p class="small muted">${OV.running ? "Calculating…" : "Choose a feed or change a value."}</p>`;
  const label = {workbook: "As saved", prior: "Prior model", current: "Rolled forward"}[r.mode];
  const roll = r.roll;
  return `${roll ? `<div class="callout info small" style="margin-bottom:8px">Rolled forward ${roll.months} months to ${esc(roll.valuation_date || "?")}: periods ${esc(roll.first_period || "?")} to ${esc(roll.last_period || "?")} (${roll.periods}).</div>` : ""}
  ${r.n_unmatched ? `<div class="callout warn small" style="margin-bottom:8px">${r.n_unmatched} client value(s) couldn't be matched in the current model and are blank: ${esc(r.unmatched.slice(0, 4).map(u => `${u.cell} (${u.why})`).join("; "))}${r.n_unmatched > 4 ? "…" : ""}</div>` : ""}
  <div class="scroll"><table><thead><tr><th>Output</th><th class="num">Workbook</th><th class="num">${esc(label)}</th>${Object.keys(r.changes || {}).length ? `<th class="num">With changes</th><th class="num">Change</th>` : ""}<th></th></tr></thead><tbody>
  ${r.outputs.map(o => `<tr><td>${esc(o.label)}<div class="mono small muted">${esc(o.cell)}</div></td><td class="num">${esc(fmt(o.workbook, 2))}</td><td class="num">${esc(fmt(o.base, 2))}</td>
    ${Object.keys(r.changes || {}).length ? `<td class="num"><b>${esc(fmt(o.value, 2))}</b></td><td class="num">${o.change == null ? "" : `${o.change > 0 ? "+" : ""}${esc(fmt(o.change, 2))}`}</td>` : ""}
    <td><button class="btn small ghost" data-trace="${esc(o.cell)}">Python</button></td></tr>`).join("")}</tbody></table></div>`;
}
function traceBlock() {
  const t = OV.trace;
  if (!t) return "";
  return `<div style="margin-top:14px;border-top:1px solid var(--rule);padding-top:12px"><div class="row" style="justify-content:space-between"><h3 style="margin:0;font-size:14px">${esc(t.cell)} ${esc(t.label || "")} = ${esc(fmt(t.value, 4))}</h3><button class="btn small ghost" id="ovTraceClose">Close</button></div>
  <pre class="mono" style="background:var(--code-bg);padding:10px 12px;border-radius:4px;overflow-x:auto;font-size:12px;line-height:1.5">${esc(t.source || "(an input)")}</pre>
  ${t.n_client_reads ? `<details><summary>${t.n_client_reads} value(s) read from the client model to compute it</summary><div class="scroll"><table><tbody>${t.client_reads.slice(0, 60).map(x => `<tr><td class="small">${esc(x.source)}</td><td class="mono small">${esc(x.cell)}</td><td class="num small">${esc(fmt(x.value, 4))}</td></tr>`).join("")}</tbody></table></div></details>` : `<p class="small muted">Reads nothing from the client model directly (its inputs are the overlay's own).</p>`}</div>`;
}
let ovTimer = null, ovSeq = 0;
function ovSchedule(delay = 300) { clearTimeout(ovTimer); ovTimer = setTimeout(ovRun, delay); }
async function ovRun() {
  const seq = ++ovSeq; OV.running = true; const box = $("#ovResults"); if (box) box.innerHTML = resultsTable();
  try {
    const body = {mode: OV.mode, changes: OV.changes};
    if (OV.mode === "current") { body.valuation_date = OV.vd || E.overlay?.roll?.current_valuation_date || null; if (OV.months != null && OV.months !== "") body.months = +OV.months; }
    const r = await api(`/api/engagements/${E.id}/overlay/run`, {method: "POST", body});
    if (seq === ovSeq) OV.result = r;
  } catch (e) { toast(e.message, 6000); }
  if (seq === ovSeq) { OV.running = false; const b = $("#ovResults"); if (b) { b.innerHTML = resultsTable(); bindResults(); } }
}
function bindResults() {
  document.querySelectorAll("#ovResults [data-trace]").forEach(b => b.onclick = async () => {
    try { OV.trace = await api(`/api/engagements/${E.id}/overlay/trace?cell=${encodeURIComponent(b.dataset.trace)}`); } catch (e) { toast(e.message); }
    $("#ovTrace").innerHTML = traceBlock(); $("#ovTraceClose")?.addEventListener("click", () => { OV.trace = null; $("#ovTrace").innerHTML = ""; });
    $("#ovTrace").scrollIntoView({behavior: "smooth", block: "nearest"});
  });
}
function rerenderLive() { const c = $("#ovLive"); if (c && E.overlay) { c.innerHTML = liveCard(E.overlay); bindLive(); } }
function bindLive() {
  document.querySelectorAll("#ovLive [data-mode]").forEach(b => b.onclick = () => { OV.mode = b.dataset.mode; OV.result = null; rerenderLive(); ovSchedule(0); });
  document.querySelectorAll("#ovLive [data-lever]").forEach(inp => inp.oninput = () => {
    const l = E.overlay.levers.find(x => x.cell === inp.dataset.lever);
    if (inp.value === "" ) delete OV.changes[l.cell]; else if (inp.type === "date" || !isNaN(+inp.value)) OV.changes[l.cell] = leverRaw(l, inp.value); else return;
    ovSchedule();
  });
  document.querySelectorAll("#ovLive [data-lever]").forEach(inp => inp.onchange = () => rerenderLive());
  document.querySelectorAll("#ovLive [data-input]").forEach(inp => {
    inp.oninput = () => { if (inp.value === "") delete OV.changes[inp.dataset.input]; else if (!isNaN(+inp.value)) OV.changes[inp.dataset.input] = +inp.value; else return; ovSchedule(); };
    inp.onchange = () => rerenderLive();
  });
  document.querySelectorAll("#ovLive [data-unset]").forEach(b => b.onclick = ev => { ev.preventDefault(); delete OV.changes[b.dataset.unset]; rerenderLive(); ovSchedule(0); });
  $("#ovClear")?.addEventListener("click", () => { OV.changes = {}; rerenderLive(); ovSchedule(0); });
  $("#ovVd")?.addEventListener("change", e => { OV.vd = e.target.value; ovSchedule(0); });
  $("#ovMonths")?.addEventListener("input", e => { OV.months = e.target.value; if (!isNaN(+e.target.value) && e.target.value !== "") ovSchedule(); });
  let qTimer = null;
  $("#ovQ")?.addEventListener("input", e => { OV.q = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(async () => {
    OV.found = OV.q ? await api(`/api/engagements/${E.id}/overlay/inputs?q=${encodeURIComponent(OV.q)}`) : [];
    $("#ovFound").innerHTML = foundList(); bindLive(); }, 250); });
  bindResults();
  $("#ovTraceClose")?.addEventListener("click", () => { OV.trace = null; $("#ovTrace").innerHTML = ""; });
}
bind.python = () => {
  $("#buildOv")?.addEventListener("click", () => { OV.result = null; act(() => api(`/api/engagements/${E.id}/overlay`, {method: "POST"})); });
  // no runs while a rebuild is replacing the module
  if (E.overlay && !busy(E.overlay_status)) { bindLive(); if (!OV.result && !OV.running) ovSchedule(0); }
};

boot().catch(e => { $("#main").innerHTML = `<div class="callout bad">Couldn't start: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
