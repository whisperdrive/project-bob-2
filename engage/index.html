<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valuation Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;600;700&family=Noto+Sans+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Palette: off-black #2e2e38 / #1a1a24, ground #f6f6fa, greys #c4c4cd / #747480, yellow #ffe600, blue #1a9afa. */
:root {
  --ground: #f6f6fa; --surface: #ffffff; --raised: #fbfbfd; --ink: #2e2e38; --muted: #6b6b78; --rule: #e1e1e6;
  --rule-strong: #c4c4cd; --bar: #1a1a24; --bar-ink: #ffffff; --bar-muted: #c4c4cd; --yellow: #ffe600;
  --on-yellow: #2e2e38; --link: #1270c2; --blue: #1a9afa;
  --ok-bg: #e5f3ea; --ok: #16692f; --warn-bg: #fff3cc; --warn: #7a5200; --bad-bg: #fbe7e5; --bad: #a3261c;
  --info-bg: #e3f1fd; --info: #0f5a9c; --code-bg: #f0f0f4;
  --s1: #1a9afa; --s2: #747480; --s3: #2e2e38;
  --c1: #1a9afa; --c2: #2e2e38; --c3: #d97a00; --c4: #8a8a96; --c5: #16692f; --c6: #a3261c;
  --q1: #d6ebfd; --q2: #aed6fb; --q3: #7fbef8; --q4: #4ea5f5; --q5: #1a8ae6; --q6: #126cb8; --q7: #0b4f8a;
  --sans: "Noto Sans", system-ui, -apple-system, sans-serif; --mono: "Noto Sans Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #1a1a24; --surface: #23232f; --raised: #2a2a36; --ink: #f0f0f5; --muted: #a8a8b5; --rule: #34343f;
    --rule-strong: #4a4a57; --bar: #121219; --link: #4bb0fb; --blue: #1a9afa;
    --ok-bg: #173323; --ok: #7fd49a; --warn-bg: #3a3012; --warn: #f3cf62; --bad-bg: #3d1d1b; --bad: #f4a39b;
    --info-bg: #15304a; --info: #8cc8f7; --code-bg: #2e2e38; color-scheme: dark;
    --s1: #1a9afa; --s2: #9a9aa8; --s3: #f0f0f5;
    --c1: #4bb0fb; --c2: #f0f0f5; --c3: #f3a43b; --c4: #9a9aa8; --c5: #7fd49a; --c6: #f4a39b;
    --q1: #0b2e4f; --q2: #0f3d69; --q3: #154f87; --q4: #1a63a8; --q5: #1a7fd6; --q6: #4ba3f0; --q7: #8cc8f7;
  }
}
:root[data-theme="dark"] {
  --ground: #1a1a24; --surface: #23232f; --raised: #2a2a36; --ink: #f0f0f5; --muted: #a8a8b5; --rule: #34343f;
  --rule-strong: #4a4a57; --bar: #121219; --link: #4bb0fb; --blue: #1a9afa;
  --ok-bg: #173323; --ok: #7fd49a; --warn-bg: #3a3012; --warn: #f3cf62; --bad-bg: #3d1d1b; --bad: #f4a39b;
  --info-bg: #15304a; --info: #8cc8f7; --code-bg: #2e2e38; color-scheme: dark;
  --s1: #1a9afa; --s2: #9a9aa8; --s3: #f0f0f5;
  --c1: #4bb0fb; --c2: #f0f0f5; --c3: #f3a43b; --c4: #9a9aa8; --c5: #7fd49a; --c6: #f4a39b;
  --q1: #0b2e4f; --q2: #0f3d69; --q3: #154f87; --q4: #1a63a8; --q5: #1a7fd6; --q6: #4ba3f0; --q7: #8cc8f7;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 300 15px/1.55 var(--sans); }
b, strong, th, h1, h2, h3 { font-weight: 600; }
a { color: var(--link); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.small { font-size: 13px; }
.nowrap { white-space: nowrap; }

/* header */
header { background: var(--bar); color: var(--bar-ink); position: sticky; top: 0; z-index: 10; }
.hbar { display: flex; align-items: center; gap: 14px; padding: 10px 24px; max-width: 1360px; margin: 0 auto; flex-wrap: wrap; }
.brand { display: flex; align-items: flex-end; gap: 10px; text-decoration: none; color: inherit; }
.brand .mark { width: 5px; align-self: stretch; background: var(--yellow); border-radius: 1px; }
.brand .name { font-size: 18px; font-weight: 600; letter-spacing: .1px; line-height: 1; }
.brand .sub { font-size: 12px; color: var(--bar-muted); font-weight: 400; line-height: 1; margin-left: 2px; }
.hsp { flex: 1; }
.hctl { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--bar-muted); flex-wrap: wrap; }
.hctl select { background: #2e2e38; color: #fff; border: 1px solid #4a4a57; border-radius: 4px; padding: 4px 8px; font-size: 13px; max-width: 280px; }
.chip { background: #2e2e38; border: 1px solid #4a4a57; color: #fff; border-radius: 99px; padding: 3px 10px; font-size: 12.5px; cursor: default; white-space: nowrap; }
.yellow-rule { height: 3px; background: var(--yellow); }

/* steps */
nav.steps { display: flex; gap: 0; max-width: 1360px; margin: 0 auto; padding: 0 24px; overflow-x: auto; }
nav.steps button { background: none; border: 0; border-bottom: 3px solid transparent; color: var(--bar-muted); padding: 10px 16px 9px;
  cursor: pointer; font-size: 14px; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
nav.steps button:hover { color: #fff; }
nav.steps button.on { color: #fff; border-bottom-color: var(--yellow); font-weight: 600; }
nav.steps button:disabled { opacity: .45; cursor: not-allowed; }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #74747f; display: inline-grid; place-items: center; font-size: 11px; font-weight: 600; }
.dot.done { background: var(--yellow); border-color: var(--yellow); color: #2e2e38; }
.dot.work { border-color: var(--blue); color: var(--blue); }

main { max-width: 1360px; margin: 0 auto; padding: 22px 24px 60px; display: grid; gap: 18px; }
.lede { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.lede h1 { font-size: 24px !important; margin: 0; font-weight: 300; }
.lede h1 b { font-weight: 600; }
.lede p { margin: 4px 0 0; color: var(--muted); max-width: 820px; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 18px; min-width: 0; }
.card > h2, .card h2, .lede h1, .node .small b { font-size: 16px; margin: 0 0 2px; overflow-wrap: anywhere; }
.card > .sub { font-size: 13.5px; color: var(--muted); margin: 0 0 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 18px; }
.stack { display: grid; gap: 18px; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px; }

.btn { background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 6px 14px; cursor: pointer; font-size: 14px; font-weight: 400; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--yellow); border-color: var(--yellow); color: var(--on-yellow); font-weight: 600; }
.btn.primary:hover { filter: brightness(.95); }
.btn.small { padding: 3px 9px; font-size: 12.5px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--link); padding-left: 4px; padding-right: 4px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
input[type=text], select.in, textarea { background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 6px 9px; font-size: 14px; }
textarea { width: 100%; font-family: var(--mono); font-size: 12.5px; min-height: 160px; }

.pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--code-bg); color: var(--muted); white-space: nowrap; letter-spacing: .1px; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.info { background: var(--info-bg); color: var(--info); }
.callout { border-radius: 4px; padding: 10px 14px; font-size: 14px; border-left: 4px solid; }
.callout.warn { background: var(--warn-bg); color: var(--warn); border-color: #e0b400; }
.callout.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.callout.info { background: var(--info-bg); color: var(--info); border-color: var(--blue); }

.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font-size: 12px; color: var(--muted); padding: 7px 10px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap; font-weight: 600; }
td { padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tr.sel td { background: var(--raised); }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--raised); }
.bar { height: 5px; border-radius: 3px; background: var(--rule); overflow: hidden; margin-top: 5px; min-width: 120px; }
.bar i { display: block; height: 100%; background: var(--blue); transition: width .4s; }

.drop { border: 2px dashed var(--rule-strong); border-radius: 6px; padding: 26px; text-align: center; background: var(--raised); cursor: pointer; }
.drop.over { border-color: var(--yellow); background: var(--warn-bg); }
.drop b { font-size: 16px; }
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; margin-top: 14px; text-align: left; }
.slot { border: 1px solid var(--rule); border-radius: 4px; padding: 9px 12px; background: var(--surface); font-size: 13px; }
.slot b { display: block; font-size: 13.5px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--rule); border-radius: 4px; padding: 10px 14px; background: var(--surface); }
.tile b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile span { font-size: 12.5px; color: var(--muted); }

.md { font-size: 14px; }
.md table { width: auto; margin: 8px 0; }
.md td, .md th { border: 1px solid var(--rule); padding: 4px 8px; }
.md h2 { font-size: 15px; border-top: 1px solid var(--rule); padding-top: 12px; margin-top: 18px; }
.md h3 { font-size: 14px; }
.review { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 900px) { .review { grid-template-columns: 1fr; } }
.review img { max-width: 100%; border: 1px solid var(--rule); background: #fff; border-radius: 3px; }
.checks { list-style: none; padding: 0; margin: 0; font-size: 12.5px; }
.checks li::before { content: "✓ "; color: var(--ok); font-weight: 700; }
.checks li.no::before { content: "✗ "; color: var(--bad); }
details > summary { cursor: pointer; color: var(--link); font-size: 13px; }
.quote { font-size: 12.5px; color: var(--muted); border-left: 3px solid var(--rule-strong); padding-left: 8px; margin-top: 4px; }
.why { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--muted); }
.why li { margin: 2px 0; overflow-wrap: anywhere; }

/* roles */
.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; align-items: stretch; }
@media (max-width: 900px) { .flow { grid-template-columns: 1fr; } }
.node { border: 1px solid var(--rule-strong); border-top: 4px solid var(--yellow); border-radius: 4px; padding: 12px 14px; background: var(--surface); position: relative; margin-right: 26px; }
.node:last-child { margin-right: 0; }
.node::after { content: "→"; position: absolute; right: -22px; top: 40%; color: var(--muted); font-size: 18px; }
.node:last-child::after { content: none; }
@media (max-width: 900px) { .node { margin-right: 0; margin-bottom: 22px; } .node::after { content: "↓"; right: 45%; top: auto; bottom: -24px; } }
.node h3 { margin: 0 0 6px; font-size: 14px; }
.node .small b { font-size: 13px; }
.node select { width: 100%; }
.sheets { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 12.5px; }
.sheets label { display: flex; gap: 4px; align-items: center; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--bar); color: #fff; padding: 9px 16px; border-radius: 4px; font-size: 14px; z-index: 30; border-left: 4px solid var(--yellow); max-width: 90vw; }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
/* model dashboards (map step) and charts */
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 4px; overflow: hidden; flex-wrap: wrap; }
.seg button { background: var(--surface); border: 0; border-right: 1px solid var(--rule-strong); padding: 5px 12px; font-size: 13px; cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--bar); color: #fff; font-weight: 600; box-shadow: inset 0 -3px 0 var(--yellow); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.chart { position: relative; height: 280px; }
.heat { border-collapse: separate; border-spacing: 2px; width: auto; font-size: 12px; }
.heat th { border: 0; padding: 2px 6px; font-weight: 400; color: var(--ink); }
.heat th.col { writing-mode: vertical-rl; transform: rotate(180deg); text-align: left; padding: 6px 2px; }
.heat th.ov { font-weight: 600; box-shadow: inset 3px 0 0 var(--yellow); }
.heat th.col.ov { box-shadow: inset 0 -3px 0 var(--yellow); }
.heat td { border: 0; width: 34px; height: 26px; padding: 0; text-align: center; border-radius: 3px; font-variant-numeric: tabular-nums; }
.heat td.z { background: var(--raised); }
.heat td:not(.z):hover { outline: 2px solid var(--ink); }
.legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 22px; height: 10px; border-radius: 2px; }
.hbar-cell { height: 8px; border-radius: 0 4px 4px 0; background: var(--s1); min-width: 2px; }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 3px; background: var(--warn-bg); color: var(--warn); margin: 1px 3px 1px 0; white-space: nowrap; }
.tag.lever { background: var(--info-bg); color: var(--info); }
.tag.out { background: var(--ok-bg); color: var(--ok); }
#tip { position: fixed; pointer-events: none; background: var(--bar); color: #fff; font-size: 12.5px; padding: 6px 9px; border-radius: 4px; z-index: 40; max-width: 320px; display: none; border-left: 3px solid var(--yellow); }
/* charts, the DCF tab and the chat (python overlay step), after the Model Desk's */
.chart-card { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px 12px; }
.chart-card h4 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
.chart-card .sub { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.chart-box { position: relative; height: 300px; }
.chart-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.chart-tools button { background: none; border: 1px solid var(--rule-strong); border-radius: 4px; padding: 3px 10px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.chart-tools button:hover, .chart-tools button.on { color: var(--ink); border-color: var(--ink); }
.chart-tools .src { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; }
.chart-note { font-size: 13px; margin: 8px 0 0; max-width: 80ch; }
details.creview { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
details.creview ul { margin: 4px 0 0; padding-left: 18px; }
.copy-panel { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.copy-panel textarea { height: 140px; }
.val-cases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .val-cases { grid-template-columns: minmax(0, 1fr); } }
.val-case { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; display: grid; gap: 2px; }
.val-case.base { border-color: var(--ink); box-shadow: inset 0 3px 0 var(--yellow); }
.val-case span { font-size: 12px; color: var(--muted); }
.val-case b { font-size: 22px; font-variant-numeric: tabular-nums; }
.val-case em { font-style: normal; font-size: 12.5px; }
.up { color: var(--ok); } .down { color: var(--bad); }
.sc-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px 18px; }
.sc-form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.sc-form input, .sc-form select { font-size: 14px; padding: 6px 8px; width: 100%; min-width: 0; background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 4px; }
.sc-pair { display: flex; gap: 6px; }
.sc-bridge { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); font-size: 13.5px; }
.sc-bridge label { display: flex; gap: 6px; align-items: center; }
tr.tot td { font-weight: 600; border-top: 1px solid var(--ink); }
tr.pick { cursor: pointer; } tr.pick:hover td { background: var(--raised); }
.dcf-card { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; display: grid; gap: 8px; }
.dcf-card h4 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.dcf-card .big { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dcf-card .facts { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--muted); }
.dcf-card .facts b { color: var(--ink); }
.dcf-card table { width: auto; font-size: 13px; }
.dcf-card td { padding: 3px 12px 3px 0; }
.thread { display: flex; flex-direction: column; gap: 22px; margin: 14px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 99px; padding: 6px 14px; font-size: 13.5px; cursor: pointer; text-align: left; }
.chips button:hover { border-color: var(--ink); }
.q { align-self: flex-end; max-width: 80%; background: var(--bar); color: #fff; padding: 10px 14px; border-radius: 10px 10px 2px 10px; white-space: pre-wrap; border-left: 3px solid var(--yellow); }
.a { display: flex; flex-direction: column; gap: 10px; }
details.work { border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); font-size: 13px; }
details.work summary { padding: 8px 12px; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 8px; }
details.work summary::-webkit-details-marker { display: none; }
details.work summary::before { content: "▸"; transition: transform .15s; }
details.work[open] summary::before { transform: rotate(90deg); }
.wsteps { border-top: 1px solid var(--rule); padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.wstep .call { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
.wstep .call b { color: var(--link); }
.wstep pre { margin: 4px 0 0; max-height: 180px; overflow: auto; background: var(--code-bg); padding: 8px 10px; border-radius: 4px; font: 12px/1.45 var(--mono); color: var(--muted); white-space: pre; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); animation: pulse 1s infinite alternate; flex: none; }
@keyframes pulse { from { opacity: .25; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } .bar i { transition: none; } }
.answer { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 18px; overflow-x: auto; font-size: 14.5px; }
.answer h1, .answer h2, .answer h3, .answer h4 { font-size: 15px; margin: 14px 0 6px; }
.answer code { font: 12.5px var(--mono); background: var(--code-bg); padding: 1px 5px; border-radius: 3px; }
.answer table { width: auto; }
.chat-stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chat-stats b { color: var(--ink); }
.composer { display: flex; gap: 10px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; min-height: 46px; max-height: 180px; font-family: var(--sans); font-size: 14.5px; padding: 10px 12px; }
/* the status panel: stages, what's happening now, what needs you */
.nowbox { max-width: 1360px; margin: 16px auto 0; padding: 0 24px; }
.pipe { list-style: none; margin: 0; padding: 12px 14px 10px; display: flex; align-items: flex-start; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px 6px 0 0; overflow-x: auto; }
.pipe > li { flex: none; }
.pipe > li.link { flex: 1 1 24px; min-width: 14px; height: 2px; background: var(--rule-strong); margin: 15px 2px 0; }
.pipe > li.link.done { background: var(--yellow); }
.pipe > li.link.flowing, .sf-link.flowing { background: repeating-linear-gradient(90deg, var(--blue) 0 6px, transparent 6px 12px); background-size: 12px 2px; animation: flow .7s linear infinite; }
.st { display: grid; justify-items: center; gap: 2px; background: none; border: 0; cursor: pointer; padding: 2px 6px; min-width: 104px; text-align: center; color: inherit; }
.st:hover .nm { text-decoration: underline; }
.st .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--rule-strong); font-weight: 700; font-size: 12.5px; position: relative; color: var(--muted); background: var(--surface); }
.st.done .ic { background: var(--yellow); border-color: var(--yellow); color: #2e2e38; }
.st.you .ic { border-color: #e0b400; color: var(--warn); background: var(--warn-bg); animation: glowy 1.8s ease-out infinite; }
.st.error .ic { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }
.st.running .ic { border-color: var(--rule); }
.st.running .ic::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--blue); border-top-color: transparent; border-right-color: transparent; animation: spin .9s linear infinite; }
.st .nm { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.st .ln { font-size: 11.5px; color: var(--muted); max-width: 150px; line-height: 1.3; }
.st.you .ln { color: var(--warn); font-weight: 600; }
.now-row { display: flex; gap: 10px 18px; align-items: center; flex-wrap: wrap; justify-content: space-between; padding: 10px 14px; background: var(--raised); border: 1px solid var(--rule); border-top: 0; border-radius: 0 0 6px 6px; }
.live { flex: 1 1 420px; min-width: 0; }
.live-head { display: flex; gap: 8px; align-items: center; font-size: 13.5px; flex-wrap: wrap; }
.todo { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dot-idle { width: 8px; height: 8px; border-radius: 50%; background: var(--rule-strong); display: inline-block; }
.subflow { display: flex; align-items: center; flex-wrap: wrap; row-gap: 6px; margin-top: 8px; font-size: 12px; }
.sf-node { padding: 3px 10px; border-radius: 99px; border: 1px solid var(--rule-strong); color: var(--muted); background: var(--surface); white-space: nowrap; }
.sf-node.past { color: var(--ink); border-color: var(--yellow); }
.sf-node.cur { color: #fff; background: var(--blue); border-color: var(--blue); font-weight: 600; animation: glow 1.6s ease-out infinite; }
.sf-link { width: 20px; height: 2px; background: var(--rule-strong); }
.sf-link.past { background: var(--yellow); }
.swap .arr { display: inline-block; animation: flip 1.2s steps(1) infinite; }
.dot.work { animation: glow 1.8s ease-out infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes flow { to { background-position: 12px 0; } }
@keyframes flip { 50% { transform: scaleX(-1); } }
@keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(26, 154, 250, .55); } 70%, 100% { box-shadow: 0 0 0 7px rgba(26, 154, 250, 0); } }
@keyframes glowy { 0% { box-shadow: 0 0 0 0 rgba(224, 180, 0, .6); } 70%, 100% { box-shadow: 0 0 0 7px rgba(224, 180, 0, 0); } }
@media (prefers-reduced-motion: reduce) {
  .st.running .ic::after, .pipe > li.link.flowing, .sf-link.flowing, .sf-node.cur, .swap .arr, .st.you .ic, .dot.work { animation: none; }
}
@media (max-width: 640px) { .hbar, nav.steps, main { padding-left: 16px; padding-right: 16px; } .nowbox { padding: 0 16px; } .st { min-width: 84px; } }
</style>
</head>
<body>
<header>
  <div class="hbar">
    <a class="brand" href="#" id="brand"><span class="mark" aria-hidden="true"></span><span><span class="name">Valuation Desk</span><br><span class="sub">Recurring valuation workbench</span></span></a>
    <div class="hsp"></div>
    <div class="hctl">
      <label for="engSel">Engagement</label><select id="engSel"></select>
      <button class="btn small" id="newEng" style="background:#2e2e38;color:#fff;border-color:#4a4a57">New</button>
    </div>
    <div class="hctl" id="modelCtl" hidden>
      <label for="mSel">Model</label><select id="mSel"></select>
      <label for="rSel">Reviewer</label><select id="rSel"></select>
      <span class="chip" id="spend" title="Azure model spend for this engagement">$0.00</span>
    </div>
  </div>
  <nav class="steps" id="steps"></nav>
  <div class="yellow-rule"></div>
</header>
<div id="now" class="nowbox" hidden aria-live="polite"></div>
<main id="main"></main>
<div id="tip"></div>
<input type="file" id="picker" multiple accept=".pdf,.pptx,.xlsx,.xlsm" hidden>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const md = s => DOMPurify.sanitize(marked.parse(s || ""));
const fmt = (v, d = 1) => v == null || v === "" ? "" : (typeof v === "number" ? v.toLocaleString(undefined, {maximumFractionDigits: d, minimumFractionDigits: Math.abs(v) < 10 && d ? Math.min(d, 2) : 0}) : String(v));
const size = b => b > 1e6 ? (b / 1e6).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1e3)) + " KB";
const busy = s => ["queued", "processing", "running"].includes(s);
function toast(msg, ms = 3500) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), ms); }
async function api(path, opts = {}) {
  const r = await fetch(path, {headers: opts.body && !(opts.body instanceof FormData) ? {"Content-Type": "application/json"} : {}, ...opts,
    body: opts.body && !(opts.body instanceof FormData) ? JSON.stringify(opts.body) : opts.body});
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m } catch {} throw new Error(m); }
  return r.json();
}

const STEPS = [
  {id: "files", name: "Files"}, {id: "reference", name: "Report reference"}, {id: "roles", name: "Roles"},
  {id: "compare", name: "Compare models"}, {id: "map", name: "Map"}, {id: "python", name: "Python overlay"}];
const ROLE_HELP = {
  prior_report: "Last year's final report: conclusions and assumptions.",
  prior_model: "The client's model behind last year's valuation.",
  prior_overlay: "Our workings linking the client model to the report: a separate workbook, or sheets inside the client model.",
  current_model: "This year's client model, to roll the valuation forward.",
};
let CFG, E = null, state = {step: "files", doc: null, table: null, tableFilter: "flagged", factEdit: null, docView: null};
let uploads = [], pollTimer = null;

// ---- boot / navigation -------------------------------------------------------------------------------------
async function boot() {
  CFG = await api("/api/config");
  for (const id of ["mSel", "rSel"]) $("#" + id).innerHTML = CFG.models.map(m => `<option>${esc(m)}</option>`).join("");
  const h = new URLSearchParams(location.hash.slice(1));
  state.step = h.get("s") || "files";
  await loadList(+h.get("e") || null);
}
async function loadList(select) {
  const list = await api("/api/engagements");
  $("#engSel").innerHTML = list.length ? list.map(e => `<option value="${e.id}">${esc(e.name)}</option>`).join("") : `<option value="">No engagements yet</option>`;
  const id = select && list.some(e => e.id === select) ? select : list[0]?.id;
  if (id) { $("#engSel").value = id; await open(id); } else { E = null; render(); }
}
async function open(id) { E = await api(`/api/engagements/${id}`); state.doc = null; state.table = null; render(); schedule(); spend(); }
// While someone is typing (a fact or table edit, or any focused field), polling updates the data and the step
// dots but doesn't rebuild the page, so the edit isn't lost.
function editing() {
  const a = document.activeElement;
  return state.factEdit != null || state.editingTable || CHAT.streaming || !!(a && a.closest("main") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
async function refresh(force = false) {
  if (!E) return;
  E = await api(`/api/engagements/${E.id}`);
  if (!force && editing()) { renderSteps(); renderNow(); } else render();
  schedule();
}
function schedule() {
  clearTimeout(pollTimer);
  if (!E) return;
  const working = E.documents.some(d => busy(d.status) || busy(d.facts_status)) || E.workbooks.some(w => busy(w.status))
    || busy(E.compare_status) || busy(E.map_status) || busy(E.overlay_status) || E.roles_pending || uploads.some(u => !u.done);
  if (working) pollTimer = setTimeout(async () => { await refresh(); spend(); }, 1500);
}
async function spend() {
  if (!E) return;
  try { const u = await api(`/api/usage?session=${encodeURIComponent(E.session)}`); const s = u.session || {};
    $("#spend").textContent = `$${(s.cost_usd || 0).toFixed(3)} · ${((s.input_tokens || 0) + (s.output_tokens || 0)).toLocaleString()} tokens`;
    $("#spend").title = `Azure model spend for this engagement: ${s.calls || 0} calls (list prices)`; } catch {}
}
$("#engSel").onchange = e => { if (e.target.value) { go(state.step, +e.target.value); open(+e.target.value); } };
$("#newEng").onclick = () => { E = null; state.step = "files"; render(true); };
$("#mSel").onchange = async e => { E = {...E, ...await api(`/api/engagements/${E.id}`, {method: "PATCH", body: {model: e.target.value}})}; toast(`Extraction model: ${e.target.value}`); };
$("#rSel").onchange = async e => { E = {...E, ...await api(`/api/engagements/${E.id}`, {method: "PATCH", body: {reviewer_model: e.target.value}})}; toast(`Reviewer model: ${e.target.value}`); };
function go(step, eid = E?.id) { state.step = step; history.replaceState(null, "", `#e=${eid || ""}&s=${step}`); render(); }

// ---- progress of each step ---------------------------------------------------------------------------------
function progress() {
  if (!E) return {};
  const report = E.documents.find(d => d.id === E.roles.prior_report?.id) || E.documents[0];
  const f = E.facts, approved = f.filter(x => x.status === "approved").length;
  const r = E.roles, nConf = Object.values(r).filter(x => x.confirmed).length;
  return {
    files: E.documents.length && E.workbooks.length >= 2 && !E.documents.some(d => busy(d.status)) && !E.workbooks.some(w => busy(w.status)) ? "done" : (E.documents.length + E.workbooks.length ? "work" : ""),
    reference: approved && !f.some(x => x.status === "pending") ? "done" : (f.length || report?.facts_status ? "work" : ""),
    roles: nConf === 4 ? "done" : (Object.keys(r).length ? "work" : ""),
    compare: E.compare_status === "done" ? "done" : (E.compare_status ? "work" : ""),
    map: E.map_status === "done" ? "done" : (E.map_status ? "work" : ""),
    python: E.overlay_status === "done" ? "done" : (E.overlay_status ? "work" : ""),
  };
}
function renderSteps() {
  const p = progress();
  $("#steps").innerHTML = STEPS.map((s, i) => `<button data-s="${s.id}" class="${state.step === s.id ? "on" : ""}" ${!E ? "disabled" : ""}>
      <span class="dot ${p[s.id] || ""}">${p[s.id] === "done" ? "✓" : i + 1}</span>${esc(s.name)}</button>`).join("");
  $("#steps").querySelectorAll("button").forEach(b => b.onclick = () => go(b.dataset.s));
}

function render(creating = false) {
  $("#modelCtl").hidden = !E;
  if (E) { $("#mSel").value = E.model || CFG.default_model; $("#rSel").value = E.reviewer_model || CFG.default_reviewer; }
  renderSteps();
  renderNow();
  const m = $("#main");
  if (!E || creating) { m.innerHTML = viewNew(); bindNew(); $("#now").hidden = true; return; }
  const views = {files: viewFiles, reference: viewReference, roles: viewRoles, compare: viewCompare, map: viewMap, python: viewPython};
  m.innerHTML = (views[state.step] || viewFiles)();
  bind[state.step]?.();
}

// ---- the status panel: what's happening now, where each stage is, and what needs you ------------------------
// Worked out from the engagement on every refresh; redrawn only when something changed, so the animations run on.
const WB_FLOW = ["Open the file", "Row map, sheet by sheet", "Target and valuation date", "Compare with an earlier version"];
const DOC_FLOW = ["Read the pages", "Read each table (luna) and check it", "Review loop on flagged tables"];
const FACT_FLOW = ["Extract key facts (luna)", "Check quotes and numbers", "Review (sol)", "Review loop: luna fixes, sol checks", "Approve what both agree", "Write down lessons"];
const TABLE_LOOP = ["Flagged table", "luna corrects it", "Code checks the page", "sol checks the image"];
function stageOf(text, rules) { for (const [rx, i] of rules) if (rx.test(text || "")) return i; return -1; }
function pipeline() {
  const docs = E.documents, wbs = E.workbooks, f = E.facts, r = E.roles, name = x => shortName(x.filename);
  const st = [];
  // 1 files
  const bDoc = docs.find(d => busy(d.status) && !/review loop/i.test(d.step || "")), bWb = wbs.find(w => busy(w.status));
  const bad = [...docs.filter(d => d.status === "error"), ...wbs.filter(w => w.status === "error")];
  const files = {id: "files", name: "Files"};
  if (bDoc || bWb || uploads.some(u => !u.done)) {
    const x = bDoc || bWb;
    Object.assign(files, {state: "running", line: `${docs.filter(d => busy(d.status)).length + wbs.filter(w => busy(w.status)).length || 1} being read`,
      live: x ? `Reading ${name(x)}: ${x.step || "waiting to start"}` : "Uploading…",
      flow: x === bWb ? [WB_FLOW, stageOf(x?.step, [[/Opening/i, 0], [/Identif/i, 2], [/earlier version|Comparing/i, 3], [/./, 1]])]
        : x ? [DOC_FLOW, stageOf(x.step, [[/Reading page/i, 0], [/table/i, 1]])] : null});
  } else if (bad.length) Object.assign(files, {state: "error", line: `${bad.length} failed`, todo: {text: `Retry ${name(bad[0])}`, go: "files"}});
  else if (!docs.length || wbs.length < 2) Object.assign(files, {state: "you", line: !docs.length ? "no report yet" : "models missing",
    todo: {text: !docs.length ? "Upload last year's report" : "Upload the client models and the overlay", go: "files"}});
  else Object.assign(files, {state: "done", line: `${docs.length + wbs.length} files read`});
  st.push(files);
  // 2 report reference
  const rep = {id: "reference", name: "Report reference"};
  const tLoop = docs.find(d => busy(d.status) && /review loop/i.test(d.step || "")), fBusy = docs.find(d => busy(d.facts_status));
  const you = f.filter(needsYou).length, flagged = docs.filter(d => d.status === "done").reduce((a, d) => a + (d.n_flagged || 0), 0);
  if (tLoop) Object.assign(rep, {state: "running", line: "review loop on tables", live: `${tLoop.step}. luna corrects each flagged table, code checks it against the page, sol checks it against the image.`, flow: [TABLE_LOOP, 1], loop: true});
  else if (fBusy) Object.assign(rep, {state: "running", line: "key facts", live: fBusy.facts_step || "Starting",
    flow: [FACT_FLOW, stageOf(fBusy.facts_step, [[/Extracting/i, 0], [/Reviewing/i, 2], [/review loop/i, 3], [/Writing down/i, 5]])], loop: /review loop/i.test(fBusy.facts_step || "")});
  else if (you || flagged) Object.assign(rep, {state: "you", line: [you && `${you} fact(s)`, flagged && `${flagged} table(s)`].filter(Boolean).join(", ") + " need you",
    todo: {text: you ? `Decide ${you} fact(s) the agents couldn't settle` : `Check ${flagged} table(s) the agents couldn't settle`, go: "reference"}});
  else if (f.length) Object.assign(rep, {state: "done", line: `${f.filter(x => x.status === "approved").length} facts approved`});
  else Object.assign(rep, {state: docs.some(d => d.status === "done") ? "running" : "idle", line: docs.some(d => d.status === "done") ? "starting" : "after the report is read"});
  st.push(rep);
  // 3 roles
  const roles = {id: "roles", name: "Roles"}, nConf = Object.values(r).filter(x => x.confirmed).length;
  if (E.roles_pending) Object.assign(roles, {state: "running", line: "suggesting", live: "Comparing the workbooks (how alike they are, what each contains) and the report's figures to suggest who's who."});
  else if (nConf === 4) Object.assign(roles, {state: "done", line: "confirmed"});
  else if (Object.keys(r).length) Object.assign(roles, {state: "you", line: `${Object.keys(r).length - nConf} to confirm`, todo: {text: "Confirm who's who", go: "roles"}});
  else Object.assign(roles, {state: "idle", line: "after the models are read"});
  st.push(roles);
  // 4-6 compare, map, python overlay
  const ready = nConf === 4;
  for (const [id, key, label, verb] of [["compare", "compare", "Compare models", "Compare the client models"], ["map", "map", "Map", "Build the map"], ["python", "overlay", "Python overlay", "Build the Python overlay"]]) {
    const s = E[`${key}_status`], x = {id, name: label};
    if (busy(s)) Object.assign(x, {state: "running", line: "building", live: `${label}: ${E[`${key}_step`] || "starting"}`});
    else if (s === "error") Object.assign(x, {state: "error", line: "failed", todo: {text: `Retry: ${verb.toLowerCase()}`, go: id}});
    else if (s === "done") Object.assign(x, {state: "done", line: "built"});
    else if (ready && st.every(y => y.state !== "you" && y.state !== "error")) Object.assign(x, {state: "you", line: "ready to build", todo: {text: verb, go: id}});
    else Object.assign(x, {state: "idle", line: "after the roles"});
    st.push(x);
  }
  return st;
}
const ICON = {done: "✓", you: "!", error: "×", idle: "", running: ""};
function flowHtml(flow, loop) {
  const [nodes, cur] = flow;
  return `<div class="subflow" aria-hidden="true">${nodes.map((n, i) => `${i ? `<span class="sf-link ${i <= cur ? "past" : ""} ${i === cur ? "flowing" : ""}"></span>` : ""}<span class="sf-node ${i < cur ? "past" : i === cur ? "cur" : ""}">${i === cur && loop ? `Review loop: <span class="swap">luna <span class="arr">⇄</span> sol</span>` : esc(n)}</span>`).join("")}</div>`;
}
let nowHtml = "";
function renderNow() {
  const box = $("#now");
  if (!E) { box.hidden = true; nowHtml = ""; return; }
  box.hidden = false;
  const st = pipeline(), run = st.find(s => s.state === "running" && s.live), todos = st.filter(s => s.todo);
  const html = `<ol class="pipe" aria-label="Where the engagement is">${st.map((s, i) => `${i ? `<li class="link ${st[i - 1].state === "done" ? "done" : ""} ${s.state === "running" ? "flowing" : ""}" aria-hidden="true"></li>` : ""}
      <li><button class="st ${s.state}" data-go="${s.id}" title="${esc(s.name)}: ${esc(s.line || "")}"><span class="ic">${ICON[s.state] || i + 1}</span><span class="nm">${esc(s.name)}</span><span class="ln">${esc(s.line || "")}</span></button></li>`).join("")}</ol>
    <div class="now-row">
      <div class="live">${run ? `<div class="live-head"><span class="pulse"></span><b>Now</b><span>${esc(run.live)}</span></div>${run.flow && run.flow[1] >= 0 ? flowHtml(run.flow, run.loop) : ""}`
        : `<div class="live-head muted"><span class="dot-idle"></span>${todos.length ? "The agents are waiting for you." : "Nothing running. Everything built so far is up to date."}</div>`}</div>
      <div class="todo">${todos.length ? `<span class="small muted">Next for you</span>${todos.map((t, i) => `<button class="btn ${i ? "small" : "primary"}" data-go="${t.todo.go}">${esc(t.todo.text)}</button>`).join("")}` : ""}</div>
    </div>`;
  if (html === nowHtml) return;
  nowHtml = html;
  box.innerHTML = html;
  box.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
}

// ---- new engagement ----------------------------------------------------------------------------------------
function viewNew() {
  return `<div class="lede"><div><h1><b>Start an engagement</b></h1><p>One engagement per asset and year. You'll upload last year's report, last year's client model and overlay, and this year's client model; then check the report's key figures, confirm which file is which, compare the models and map them together.</p></div></div>
  <div class="card" style="max-width:640px"><h2>Engagement name</h2><p class="sub">For example the asset and the valuation year.</p>
  <form class="row" id="newForm"><input type="text" id="newName" placeholder="Asset name, FY26 valuation" style="flex:1;min-width:240px" required>
  <button class="btn primary">Create</button>${E ? `<button type="button" class="btn" id="cancelNew">Cancel</button>` : ""}</form></div>`;
}
function bindNew() {
  $("#newForm").onsubmit = async ev => { ev.preventDefault(); const e = await api("/api/engagements", {method: "POST", body: {name: $("#newName").value}}); state.step = "files"; await loadList(e.id); go("files", e.id); };
  $("#cancelNew")?.addEventListener("click", () => render());
  $("#newName").focus();
}

// ---- step 1: files -----------------------------------------------------------------------------------------
function statusCell(s, step, pct, err) {
  if (s === "error") return `<span class="pill bad">Failed</span><div class="small" style="color:var(--bad)">${esc(err)}</div>`;
  if (s === "done") return `<span class="pill ok">Ready</span>${err ? `<div class="small" style="color:var(--warn)">${esc(err)}</div>` : ""}`;
  return `<span class="pill info">${s === "queued" ? "Queued" : "Processing"}</span><div class="small muted">${esc(step || "")}</div><div class="bar"><i style="width:${Math.round((pct || 0) * 100)}%"></i></div>`;
}
function viewFiles() {
  const docs = E.documents, wbs = E.workbooks;
  const up = uploads.filter(u => !u.done || u.error);
  return `<div class="lede"><div><h1><b>${esc(E.name)}</b> · files</h1><p>Drop the engagement's files. Reports are converted to Markdown, with every table read from an image of it and checked; models go through the workbook pipeline (row map, dependencies, target and valuation date). You'll say which file is which in step 3.</p></div></div>
  <div class="card"><div class="drop" id="drop" tabindex="0" role="button" aria-label="Upload files"><b>Drop files here</b> or click to choose<div class="muted small">PDF or PPTX reports · XLSX or XLSM models</div>
    <div class="slots">${Object.entries(CFG.roles).map(([k, v]) => `<div class="slot"><b>${esc(v)}</b><span class="muted">${esc(ROLE_HELP[k])}</span></div>`).join("")}</div></div>
    ${up.length ? `<div style="margin-top:10px">${up.map(u => `<div class="small">${u.error ? `<span class="pill bad">Failed</span> ${esc(u.name)}: ${esc(u.error)}` : `<span class="pill info">Uploading</span> ${esc(u.name)}`}</div>`).join("")}</div>` : ""}
  </div>

      <div class="val-case"><span>As saved in Excel · ${esc(r.label)}</span><b>${vN(W.total)}</b><em>${vPct(W.rate)} · ${esc(W.valuation_date)}</em></div>
      <div class="val-case"><span>Python overlay · ${esc(FEED_NAME[feed.mode])}${Object.keys(feed.changes).length ? " + changes" : ""}</span><b>${vN(L.total)}</b><em>${r.agrees ? `✓ the module's own cell agrees` : `<span class="down">✗ the module's cell gives ${vN(L.anchor)}</span>`} · ${vDelta(L.total, W.total)} vs saved</em></div>
      <div class="val-case base"><span>Scenario method</span><b>${vN(S.total)}</b><em>${r.method_changes.length ? `${vDelta(S.total, L.total)} · ${esc(r.method_changes.join("; "))}` : "Same method as the model: change it above"}</em></div></div>
    ${roll ? `<div class="callout info small">Rolled forward ${roll.months} months to ${esc(roll.valuation_date || "?")}${feed.unmatched ? `; ${feed.unmatched} client value(s) couldn't be matched and are blank` : ""}.</div>` : ""}
    <div class="card"><h2>Two independent calculations</h2><p class="sub">The Python overlay computes every cell from the overlay's formulas; the DCF recompute takes only its cash flows, dates and bridge and discounts them again. Agreement checks both.</p>
      <div class="scroll"><table><thead><tr><th>Check</th><th>What</th><th class="num">DCF recompute</th><th class="num">Cell</th><th></th></tr></thead><tbody>
      ${r.checks.map(c => `<tr><td>${esc(c.step)}</td><td class="small">${esc(c.what)} <span class="mono">${esc(c.where)}</span></td><td class="num">${vN(c.ours)}</td><td class="num">${vN(c.theirs)}</td><td>${c.ok ? `<span class="pill ok">✓ Agrees</span>` : `<span class="pill bad">✗ Differs</span>`}</td></tr>`).join("")}</tbody></table></div></div>
    <div class="card"><h2>Saved vs live vs scenario</h2><div class="scroll"><table><thead><tr><th></th><th class="num">As saved</th><th class="num">Python overlay</th><th class="num">Scenario</th></tr></thead><tbody>
      ${row("Discount rate", vPct(W.rate), vPct(L.rate), vPct(S.rate))}
      ${row("Valuation date", esc(W.valuation_date), esc(L.valuation_date), esc(S.valuation_date))}
      ${row("Discount at", TIMING[W.timing], TIMING[L.timing], TIMING[S.timing])}
      ${row("Time measured by", DAYCOUNT[W.day_count], DAYCOUNT[L.day_count], DAYCOUNT[S.day_count])}
      ${row("Cut-off", esc(W.terminal_date || "none"), esc(L.terminal_date || "none"), esc(S.terminal_date || "none"))}
      ${row("Periods", `${W.periods} (${esc(W.first_period)} to ${esc(W.last_period)})`, `${L.periods} (${esc(L.first_period)} to ${esc(L.last_period)})`, `${S.periods}`)}
      ${row("Cash flows (undiscounted)", vN(W.undiscounted), vN(L.undiscounted), vN(S.undiscounted))}
      ${row("PV of cash flows", vN(W.pv), vN(L.pv), vN(S.pv))}${bridge}
      <tr class="tot"><td>${esc(r.label)}</td><td class="num">${vN(W.total)}</td><td class="num">${vN(L.total)}</td><td class="num">${vN(S.total)}</td></tr></tbody></table></div></div>
    <div class="card"><h2>Sensitivity to the discount rate (around the scenario)</h2><div class="scroll"><table><thead><tr><th></th>${r.sensitivity.map(x => `<th class="num">${x.case === "scenario" ? "Scenario" : x.case === "low" ? "Low" : "High"}</th>`).join("")}</tr></thead><tbody>
      <tr><td>Discount rate</td>${r.sensitivity.map(x => `<td class="num">${vPct(x.rate)}</td>`).join("")}</tr>
      <tr><td>PV of cash flows</td>${r.sensitivity.map(x => `<td class="num">${vN(x.pv)}</td>`).join("")}</tr>
      <tr class="tot"><td>Value</td>${r.sensitivity.map(x => `<td class="num">${vN(x.total)}</td>`).join("")}</tr>
      <tr><td>vs Python overlay</td>${r.sensitivity.map(x => `<td class="num">${vDelta(x.total, L.total)}</td>`).join("")}</tr></tbody></table></div><p class="small muted" style="margin:8px 0 0">${esc(units)}</p></div>
    <div id="dcfChart"></div>`;
}
async function loadOvValuation() {
  if (VAL.loading) return;
  VAL.loading = true;
  try { VAL.v = await api(`/api/engagements/${E.id}/overlay/valuation${VAL.cell ? "?cell=" + encodeURIComponent(VAL.cell) : ""}`); VAL.cell = VAL.v.selected; }
  catch (e) { VAL.v = null; const b = $("#ovVal"); if (b) b.innerHTML = `<div class="callout bad">Couldn't load the valuation: ${esc(e.message)}</div>`; VAL.loading = false; return; }
  VAL.loading = false;
  if (state.step === "python" && OV.tab === "valuation" && $("#ovVal")) { $("#ovVal").innerHTML = ovValuationPane(); bindOvValuation(); }
}
function readMethod() {
  const num = id => { const x = parseFloat($(id)?.value); return isNaN(x) ? null : x / 100; };
  const c = $("#scCut").value; $("#scCutDate").hidden = c !== "custom";
  VAL.sc = {rate: num("#scRate"), valuation_date: $("#scVd").value || null, timing: $("#scTiming").value, day_count: $("#scDc").value,
    cutoff: c === "model" ? null : c === "none" ? "" : ($("#scCutDate").value || null),
    include: [...document.querySelectorAll("#valBody [data-bi]")].map(x => x.checked), low: num("#scLow"), high: num("#scHigh")};
}
async function runOvDcf() {
  const sc = VAL.sc, seq = ++VAL.seq;
  const body = {mode: OV.mode, changes: OV.changes, cell: VAL.cell, rate: sc.rate, dcf_valuation_date: sc.valuation_date, timing: sc.timing, day_count: sc.day_count,
    cutoff: sc.cutoff == null ? "model" : sc.cutoff, include: sc.include?.length ? sc.include : null, low: sc.low, high: sc.high};
  if (OV.mode === "current") { body.valuation_date = OV.vd || E.overlay?.roll?.current_valuation_date || null; if (OV.months != null && OV.months !== "") body.months = +OV.months; }
  let r;
  try { r = await api(`/api/engagements/${E.id}/overlay/dcf`, {method: "POST", body}); }
  catch (e) { if (seq === VAL.seq && $("#dcfResults")) $("#dcfResults").innerHTML = `<div class="callout bad">${esc(e.message)}</div>`; return; }
  if (seq !== VAL.seq) return;
  VAL.dcf = r;
  const box = $("#dcfResults"); if (!box) return;
  box.innerHTML = dcfResultsHtml(r);
  $("#dcfChart").append(chartCard(r.chart)); mountCharts($("#dcfChart"));
}
function bindOvValuation() {
  if (!VAL.v) { loadOvValuation(); return; }
  $("#valCell")?.addEventListener("change", e => { VAL.cell = e.target.value; VAL.v = null; VAL.dcf = null; VAL.sc = {}; $("#ovVal").innerHTML = ovValuationPane(); loadOvValuation(); });
  document.querySelectorAll("#ovVal [data-anchor]").forEach(tr => tr.onclick = () => { if (!tr.classList.contains("pick")) return; VAL.cell = tr.dataset.anchor; VAL.v = null; VAL.dcf = null; VAL.sc = {}; VAL.step = "validate"; $("#ovVal").innerHTML = ovValuationPane(); loadOvValuation(); });
  document.querySelectorAll("#ovVal [data-vstep]").forEach(b => b.onclick = () => { if (b.disabled) return; VAL.step = b.dataset.vstep; $("#ovVal").innerHTML = ovValuationPane(); bindOvValuation(); });
  if (!(VAL.step === "methods" && VAL.v.validated)) {
    if (VAL.v.chart && $("#valChart")) { $("#valChart").append(chartCard(VAL.v.chart)); mountCharts($("#valChart")); }
    return;
  }
  document.querySelectorAll("#ovVal [data-vfeed]").forEach(b => b.onclick = () => { OV.mode = b.dataset.vfeed; OV.result = null; VAL.dcf = null; $("#ovVal").innerHTML = ovValuationPane(); bindOvValuation(); });
  let t;
  document.querySelectorAll("#valBody .sc-form input, #valBody .sc-form select, #valBody .sc-bridge input").forEach(el => el.onchange = el.oninput = () => { clearTimeout(t); t = setTimeout(() => { readMethod(); runOvDcf(); }, 350); });
  $("#scReset").onclick = () => { VAL.sc = {}; $("#ovVal").innerHTML = ovValuationPane(); bindOvValuation(); };
  if (VAL.dcf) { $("#dcfChart").append(chartCard(VAL.dcf.chart)); mountCharts($("#dcfChart")); }
  runOvDcf();
}

// ---- python overlay: Ask tab (the Model Desk's chat, with the overlay's tools) ------------------------------
const CHAT = {eid: null, history: [], html: "", session: null, streaming: false, model: null};
const EXAMPLES = ["Roll the valuation forward onto this year's client model. What are enterprise and equity value, and what drives the change?",
  "What if the discount rate were 8% and terminal growth 2%? Compare with the report's sensitivities.",
  "Chart the valuation cash flows: last year's client model against this year's, rolled forward.",
  "Which client-model rows does the overlay read, and how did they change this year?",
  "On this year's numbers, what does mid-period discounting do to enterprise value?"];
const newSession = () => { try { return crypto.randomUUID(); } catch { return String(Date.now()) + Math.random(); } };
function ovAskPane() {
  if (CHAT.eid !== E.id) Object.assign(CHAT, {eid: E.id, history: [], html: "", session: newSession(), model: null});
  const intro = `<div id="chatIntro"><p class="muted" style="margin:0 0 12px;max-width:72ch">The model uses the Model Desk's tools (search, rows, trace, cells, SQL, charts, DCF) on any of the engagement's workbooks, plus tools that run the Python overlay: what-ifs that recompute the cash flows, the roll-forward onto this year's model, charts of recomputed rows and the DCF under other methods. It knows the report's key facts, the levers and the outputs.</p>
    <div class="chips" id="examples">${EXAMPLES.map(q => `<button type="button">${esc(q)}</button>`).join("")}</div></div>`;
  return `<div class="card"><div class="row" style="justify-content:space-between"><div><h2>Ask about the engagement</h2><p class="sub" style="margin:0">Answers cite cells; every number comes from a tool call you can open.</p></div>
    <div class="row small"><label for="chatModel" class="muted">Model</label><select class="in" id="chatModel">${CFG.models.map(m => `<option ${m === (CHAT.model || E.model) ? "selected" : ""}>${esc(m)}</option>`).join("")}</select>
    ${CHAT.history.length ? `<button class="btn small" id="newChat">New chat</button>` : ""}</div></div>
    <div class="thread" id="thread">${CHAT.html || intro}</div>
    <form class="composer" id="askForm"><textarea id="question" rows="1" placeholder="Ask about the valuation, the models or a what-if…" aria-label="Question"></textarea><button class="btn primary" id="send" ${CHAT.streaming ? "disabled" : ""}>Ask</button></form></div>`;
}
function bindOvAsk() {
  mountCharts($("#thread"));
  $("#chatModel").onchange = e => { CHAT.model = e.target.value; };
  $("#newChat")?.addEventListener("click", () => { Object.assign(CHAT, {history: [], html: "", session: newSession()}); $("#ovAsk").innerHTML = ovAskPane(); bindOvAsk(); });
  $("#examples")?.addEventListener("click", e => { const b = e.target.closest("button"); if (b) ovAsk(b.textContent); });
  const q = $("#question"), grow = () => { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 180) + "px"; };
  $("#askForm").onsubmit = e => { e.preventDefault(); const t = q.value.trim(); if (!t || CHAT.streaming) return; q.value = ""; grow(); ovAsk(t); };
  q.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#askForm").requestSubmit(); } };
  q.oninput = grow;
}
const argText = a => Object.entries(a).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(", ");
function runCard(res) {  // an overlay_run result, as a compact table
  const d = document.createElement("div"); d.className = "dcf-card";
  const ch = Object.keys(res.changes || {}).length;
  d.innerHTML = `<h4>Python overlay · ${esc(FEED_NAME[res.mode])}${res.roll ? ` to ${esc(res.roll.valuation_date || "")}` : ""}${ch ? ` · ${ch} change(s)` : ""}</h4>
    <div class="scroll"><table><thead><tr><th>Output</th><th class="num">Workbook</th><th class="num">This feed</th>${ch ? `<th class="num">With changes</th>` : ""}</tr></thead><tbody>
    ${res.outputs.map(o => `<tr><td>${esc(o.label)} <span class="mono small muted">${esc(o.cell)}</span></td><td class="num">${esc(fmt(o.workbook, 1))}</td><td class="num">${esc(fmt(o.base, 1))}</td>${ch ? `<td class="num"><b>${esc(fmt(o.value, 1))}</b></td>` : ""}</tr>`).join("")}</tbody></table></div>
    ${ch ? `<div class="small muted">${Object.entries(res.changes).map(([k, v]) => `${esc(k)} = ${esc(v)}`).join(" · ")}</div>` : ""}`;
  return d;
}
async function ovAsk(text) {
  const eid = E.id, model = $("#chatModel")?.value || E.model;
  CHAT.streaming = true; $("#chatIntro")?.remove();
  const thread = $("#thread");
  thread.insertAdjacentHTML("beforeend", `<div class="q">${esc(text)}</div>`);
  const a = document.createElement("div"); a.className = "a";
  a.innerHTML = `<details class="work"><summary><span class="pulse"></span><span class="label">Looking things up…</span></summary><div class="wsteps"></div></details>`;
  thread.append(a); $("#send").disabled = true;
  const steps = a.querySelector(".wsteps"), label = a.querySelector(".label");
  let calls = 0, chars = 0, answer = "", t0 = performance.now(), last;
  const handle = e => {
    if (e.type === "tool_call") { calls++; label.textContent = `Looking things up… ${calls} tool call${calls === 1 ? "" : "s"}`;
      last = document.createElement("div"); last.className = "wstep"; last.innerHTML = `<div class="call"><b>${esc(e.name)}</b>(${esc(argText(e.args))})</div>`; steps.append(last); }
    else if (e.type === "tool_result") { chars += e.chars; last?.insertAdjacentHTML("beforeend", `<pre>${esc(e.output)}</pre>`); }
    else if (e.type === "answer") { answer = e.text; const div = document.createElement("div"); div.className = "answer"; div.innerHTML = md(e.text || "_(empty answer)_"); a.append(div); }
    else if (e.type === "usage") a.insertAdjacentHTML("beforeend", `<div class="chat-stats"><span><b>${nfmt(e.input_tokens)}</b> input tokens</span><span><b>${nfmt(e.cached_tokens || 0)}</b> cached</span><span><b>${nfmt(e.output_tokens)}</b> output tokens</span><span><b>${e.calls}</b> model turns</span><span><b>${((performance.now() - t0) / 1000).toFixed(1)}s</b></span><span>${esc(model)}</span></div>`);
    else if (e.type === "waiting") label.textContent = `Waiting ${e.seconds}s to stay under ${e.model}'s rate limit…`;
    else if (e.type === "chart_review") label.textContent = `Checking the chart “${e.title || ""}” before showing it…`;
    else if (e.type === "chart") { a.append(chartCard(e.spec)); mountCharts(a); }
    else if (e.type === "dcf") a.append(dcfCard(e.result));
    else if (e.type === "overlay_run") a.append(runCard(e.result));
    else if (e.type === "error") a.insertAdjacentHTML("beforeend", `<div class="callout bad">${esc(e.text)}</div>`);
    a.scrollIntoView({block: "end", behavior: "smooth"});
  };
  try {
    const res = await fetch(`/api/engagements/${eid}/overlay/ask`, {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: text, model, history: CHAT.history, session: CHAT.session})});
    if (!res.ok) { let m = res.statusText; try { m = (await res.json()).detail || m; } catch {} throw new Error(m); }
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) { const {value, done} = await reader.read(); if (done) break; buf += dec.decode(value, {stream: true});
      let i; while ((i = buf.indexOf("\n")) >= 0) { handle(JSON.parse(buf.slice(0, i))); buf = buf.slice(i + 1); } }
  } catch (e) { handle({type: "error", text: `Couldn't get an answer: ${e.message}`}); }
  a.querySelector(".pulse")?.remove();
  label.textContent = `Lookups: ${calls} tool call${calls === 1 ? "" : "s"}, ${nfmt(chars)} characters read`;
  if (answer) CHAT.history.push({role: "user", content: text}, {role: "assistant", content: answer});
  CHAT.streaming = false;
  if (CHAT.eid === eid) {
    // keep the thread without live chart objects; charts are re-mounted from their JSON when the tab is drawn again
    const copy = thread.cloneNode(true); copy.querySelectorAll(".chart-card").forEach(c => { c.querySelector(".chart-box").innerHTML = `<canvas role="img"></canvas>`; });
    CHAT.html = copy.innerHTML;
  }
  const s = $("#send"); if (s) { s.disabled = false; $("#question")?.focus(); }
  if (!$("#newChat") && CHAT.history.length && state.step === "python" && OV.tab === "ask") { $("#ovAsk").innerHTML = ovAskPane(); bindOvAsk(); }
  spend();
}

boot().catch(e => { $("#main").innerHTML = `<div class="callout bad">Couldn't start: ${esc(e.message)}</div>`; });
</script>
