<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root {
  --ground: #f4f6f4; --surface: #ffffff; --ink: #1b2320; --muted: #5d6a64; --rule: #d8ded9;
  --accent: #1d6b47; --accent-ink: #ffffff; --accent-soft: #e3efe7; --ref-bg: #e3efe7; --ref-ink: #17563a;
  --warn-bg: #fbeeea; --warn-ink: #8a2f1b; --amber-bg: #fbf1dc; --amber-ink: #7a5310; --code-bg: #eef1ee;
  --up: #1d6b47; --down: #a33a22;
  --s1: #1d6b47; --s2: #3f6fb0; --s3: #b7791f; --s4: #9b4d8f; --s5: #2f8f8f; --s6: #a33a22;
  --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #111513; --surface: #181e1b; --ink: #e2e9e5; --muted: #93a39b; --rule: #2b3430;
    --accent: #58bd8a; --accent-ink: #0d1a13; --accent-soft: #1d3328; --ref-bg: #1d3328; --ref-ink: #8fdcb2;
    --warn-bg: #3a1f18; --warn-ink: #f2a58f; --amber-bg: #3a2e14; --amber-ink: #f0cb7e; --code-bg: #1f2622;
    --up: #6fd09d; --down: #f08f78; color-scheme: dark;
    --s1: #58bd8a; --s2: #7ea8e6; --s3: #e0b25c; --s4: #d18ac6; --s5: #6cc6c6; --s6: #f08f78;
  }
}
:root[data-theme="dark"] {
  --ground: #111513; --surface: #181e1b; --ink: #e2e9e5; --muted: #93a39b; --rule: #2b3430;
  --accent: #58bd8a; --accent-ink: #0d1a13; --accent-soft: #1d3328; --ref-bg: #1d3328; --ref-ink: #8fdcb2;
  --warn-bg: #3a1f18; --warn-ink: #f2a58f; --amber-bg: #3a2e14; --amber-ink: #f0cb7e; --code-bg: #1f2622;
  --up: #6fd09d; --down: #f08f78; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.55 var(--sans);
  display: flex; flex-direction: column; }
select, textarea, button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ref { font: 12.5px var(--mono); background: var(--ref-bg); color: var(--ref-ink); padding: 1px 6px;
  border-radius: 4px; white-space: nowrap; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding: 10px 20px;
  border-bottom: 1px solid var(--rule); background: var(--surface); }
header h1 { font-size: 16px; font-weight: 600; margin: 0; }
header h1 span { color: var(--muted); font-weight: 400; }
label.field { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .06em; margin-left: auto; }
select, input[type=text], input[type=date] { background: var(--ground); border: 1px solid var(--rule);
  border-radius: 6px; padding: 5px 8px; font-size: 14px; color: var(--ink); text-transform: none; letter-spacing: 0; }

.layout { flex: 1; display: grid; grid-template-columns: 320px 1fr; min-height: 0; }
aside { border-right: 1px solid var(--rule); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.drop { margin: 14px; border: 1.5px dashed var(--rule); border-radius: 10px; padding: 16px; text-align: center;
  color: var(--muted); font-size: 14px; cursor: pointer; transition: border-color .15s, background .15s; }
.drop b { color: var(--ink); font-weight: 600; display: block; margin-bottom: 2px; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.files { flex: 1; overflow-y: auto; padding: 0 8px 12px; display: flex; flex-direction: column; gap: 2px; }
.group-h { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
  padding: 12px 8px 4px; }
.fitem { text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: 8px 10px;
  display: flex; flex-direction: column; gap: 3px; width: 100%; }
.fitem:hover { background: var(--ground); }
.fitem.sel { background: var(--accent-soft); border-color: var(--accent); }
.fname { font-size: 13.5px; font-weight: 500; overflow-wrap: anywhere; }
.fmeta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.pill { font-size: 11px; border-radius: 999px; padding: 1px 8px; font-weight: 500; white-space: nowrap; }
.pill.ok { background: var(--accent-soft); color: var(--ref-ink); }
.pill.check { background: var(--amber-bg); color: var(--amber-ink); }
.pill.bad { background: var(--warn-bg); color: var(--warn-ink); }
.pill.ver { background: var(--code-bg); color: var(--muted); }
.bar { height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .4s; }

section.main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.fhead { padding: 16px 24px 0; background: var(--ground); }
.fhead h2 { margin: 0; font-size: 18px; font-weight: 600; overflow-wrap: anywhere; text-wrap: balance; }
.tabs { display: flex; gap: 4px; margin-top: 12px; border-bottom: 1px solid var(--rule); }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--muted);
  font-weight: 500; margin-bottom: -1px; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .count { font-size: 11px; background: var(--code-bg); border-radius: 999px; padding: 0 6px; margin-left: 4px; }
.pane { flex: 1; overflow-y: auto; padding: 20px 24px 32px; min-height: 0; }
.wrap { max-width: 900px; display: flex; flex-direction: column; gap: 20px; }

.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; }
.card h3 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.ident { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.ident label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.ident input { font-size: 15px; padding: 7px 9px; width: 100%; }
.ident .ev { font-size: 12px; min-height: 18px; }
.ident-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
.ident-foot p { margin: 0; font-size: 13px; color: var(--muted); flex: 1; min-width: 200px; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 7px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
.btn.ghost { background: none; color: var(--ink); border: 1px solid var(--rule); font-weight: 500; }
.btn:disabled { opacity: .5; cursor: default; }
.stats-row { display: flex; flex-wrap: wrap; gap: 6px 24px; font-size: 13px; color: var(--muted); }
.stats-row b { color: var(--ink); font-weight: 500; }
details.more summary { cursor: pointer; color: var(--muted); font-size: 13px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--rule); padding: 6px 8px; }
td { border-bottom: 1px solid var(--rule); padding: 6px 8px; vertical-align: top; overflow-wrap: anywhere; }
tr:last-child td { border-bottom: 0; }
.scroll-x { overflow-x: auto; }
.arrow { color: var(--muted); padding: 0 4px; }
.chg-up { color: var(--up); } .chg-down { color: var(--down); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; }
.tile b { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--muted); }
.tile.zero b { color: var(--muted); font-weight: 400; }
.callout { border-radius: 8px; padding: 12px 14px; font-size: 14px; }
.callout.amber { background: var(--amber-bg); color: var(--amber-ink); }
.callout.red { background: var(--warn-bg); color: var(--warn-ink); }
.callout.green { background: var(--accent-soft); color: var(--ref-ink); }
.md p, .md ul { margin: 6px 0; } .md li { margin: 3px 0; } .md h1, .md h2, .md h3 { font-size: 15px; margin: 8px 0 4px; }
.md h1, .md h2, .md h3, .md h4 { text-transform: none; letter-spacing: 0; color: var(--ink); }
.md code { font: 12.5px var(--mono); background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.cmp-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }

/* chat */
.thread { display: flex; flex-direction: column; gap: 24px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
.chips button:hover { border-color: var(--accent); color: var(--accent); }
.q { align-self: flex-end; max-width: 80%; background: var(--accent); color: var(--accent-ink);
  padding: 10px 14px; border-radius: 12px 12px 2px 12px; white-space: pre-wrap; }
.a { display: flex; flex-direction: column; gap: 10px; }
details.work { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); font-size: 13px; }
details.work summary { cursor: pointer; padding: 8px 12px; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 8px; }
details.work summary::-webkit-details-marker { display: none; }
details.work summary::before { content: "▸"; transition: transform .15s; }
details.work[open] summary::before { transform: rotate(90deg); }
.steps { border-top: 1px solid var(--rule); padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.step .call { font-family: var(--mono); font-size: 12.5px; }
.step .call b { color: var(--accent); font-weight: 500; }
.step pre { margin: 4px 0 0; max-height: 180px; overflow: auto; background: var(--code-bg); padding: 8px 10px;
  border-radius: 6px; font: 12px/1.45 var(--mono); color: var(--muted); white-space: pre; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite alternate; flex: none; }
@keyframes pulse { from { opacity: .25; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } .bar i { transition: none; } }
.answer { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 4px 18px; overflow-x: auto; }
.answer h1, .answer h2, .answer h3, .answer h4 { font-size: 16px; margin: 16px 0 6px; }
.answer code { font: 13px var(--mono); background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.answer table { width: auto; }
.chat-stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chat-stats b { color: var(--ink); font-weight: 500; }
.error { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
.composer { border-top: 1px solid var(--rule); background: var(--surface); padding: 12px 24px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.composer form { max-width: 900px; display: flex; gap: 10px; align-items: flex-end; }
textarea { flex: 1; resize: none; min-height: 44px; max-height: 180px; padding: 10px 12px; border-radius: 8px;
  border: 1px solid var(--rule); background: var(--ground); line-height: 1.45; }

.chart-card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px 12px; }
.val-top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
.val-top label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.val-top label:first-child { flex: 1 1 280px; min-width: 0; }
.val-top select { width: 100%; min-width: 0; text-overflow: ellipsis; }
.val-top input { width: 90px; font-variant-numeric: tabular-nums; }
#val-body, #sc-results { display: flex; flex-direction: column; gap: 20px; }
.val-steps { display: inline-flex; }
.val-steps button { background: var(--surface); border: 1px solid var(--rule); padding: 7px 14px; font-size: 13.5px; color: var(--muted); margin-left: -1px; }
.val-steps button:first-child { border-radius: 7px 0 0 7px; margin-left: 0; }
.val-steps button:last-child { border-radius: 0 7px 7px 0; }
.val-steps button.on { background: var(--accent-soft); color: var(--ref-ink); border-color: var(--accent); position: relative; font-weight: 600; }
.val-steps button:disabled { opacity: .45; cursor: not-allowed; }
.val-tables tr.pick { cursor: pointer; } .val-tables tr.pick:hover td { background: var(--accent-soft); }
.sc-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px 18px; }
.sc-form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.sc-form input, .sc-form select { font-size: 14px; padding: 6px 8px; width: 100%; min-width: 0; font-variant-numeric: tabular-nums; }
.sc-form .src, .sc-bridge .src { font-size: 11.5px; color: var(--muted); }
.sc-pair { display: flex; gap: 6px; }
.sc-bridge { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); }
.sc-bridge .chk { display: flex; gap: 6px; align-items: center; font-size: 13.5px; }
.val-cases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.val-case { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; }
.val-case.base { border-color: var(--accent); }
.val-case span { font-size: 12px; color: var(--muted); }
.val-case b { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.val-case em { font-style: normal; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.val-tables td.n, .val-tables th.n { text-align: right; white-space: nowrap; }
.val-tables tr.tot td { font-weight: 600; border-top: 1px solid var(--ink); }
.val-tables .src { font-size: 12px; color: var(--muted); }
@media (max-width: 760px) { .val-cases { grid-template-columns: minmax(0, 1fr); } }
.dcf-card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
.dcf-card .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.dcf-card .top h4 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; flex-basis: 100%; }
.dcf-card .big { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dcf-card .facts { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--muted); }
.dcf-card .facts b { color: var(--ink); font-weight: 500; }
.dcf-card table { width: auto; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
.dcf-card td { padding: 3px 12px 3px 0; border-bottom: 1px solid var(--rule); }
.dcf-card td.n { text-align: right; }
.dcf-card tr.tot td { font-weight: 600; border-bottom: 0; }
.dcf-card ul { margin: 0; padding-left: 18px; font-size: 13px; }
.chart-card h4 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
.chart-card .sub { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.chart-box { position: relative; height: 300px; }
.chart-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.chart-tools button { background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 3px 10px; font-size: 12.5px; color: var(--muted); }
.chart-tools button:hover, .chart-tools button.on { color: var(--ink); border-color: var(--muted); }
.chart-tools .seg { display: inline-flex; margin-right: 6px; }
.chart-tools .seg button { border-radius: 0; margin-left: -1px; }
.chart-tools .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.chart-tools .seg button:last-child { border-radius: 0 6px 6px 0; }
.chart-tools .src { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; }
.chart-note { font-size: 13px; color: var(--ink); margin: 8px 0 0; max-width: 75ch; }
details.review { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
details.review summary { cursor: pointer; }
details.review ul { margin: 4px 0 0; padding-left: 18px; }
.copy-panel { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.copy-panel textarea { width: 100%; height: 140px; font: 12px/1.4 var(--mono); background: var(--code-bg); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 6px; padding: 8px; resize: vertical; }
.usage-chip { background: none; border: 1px solid var(--rule); border-radius: 999px; padding: 4px 12px; font-size: 13px;
  color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
.usage-chip b { color: var(--ink); font-weight: 500; }
.usage-chip:hover { border-color: var(--muted); }
label.field.after-chip { margin-left: 0; }
dialog { border: 1px solid var(--rule); border-radius: 12px; background: var(--ground); color: var(--ink); padding: 0;
  width: min(900px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog::backdrop { background: rgb(0 0 0 / .35); }
.dlg-head { display: flex; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--rule); background: var(--surface); position: sticky; top: 0; }
.dlg-head h2 { margin: 0; font-size: 16px; }
.dlg-head button { margin-left: auto; }
.dlg-body { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 18px; }
.new-chat { display: flex; justify-content: flex-end; }
.toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex;
  flex-direction: column; gap: 8px; z-index: 10; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--ground); border-radius: 8px; padding: 10px 14px; font-size: 14px;
  box-shadow: 0 6px 20px rgb(0 0 0 / .18); }

@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--rule); max-height: 40vh; }
  .ident { grid-template-columns: 1fr; }
  .fhead, .pane, .composer { padding-inline: 16px; }
  label.field { margin-left: 0; }
}
</style>
</head>
<body>
<header>
  <h1>Model Desk <span>· valuation workbooks</span></h1>
  <button class="usage-chip" type="button" id="usage-chip" title="Token usage">Tokens: …</button>
  <label class="field after-chip" for="model">Chat model <select id="model"></select></label>
</header>
<dialog id="usage-dlg" aria-labelledby="usage-title">
  <div class="dlg-head"><h2 id="usage-title">Token usage</h2><button class="btn ghost" type="button" id="usage-close">Close</button></div>
  <div class="dlg-body" id="usage-body"></div>
</dialog>
<div class="layout">
  <aside>
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Upload workbooks">
      <b>Drop workbooks here</b>or click to choose .xlsx / .xlsm files
      <input type="file" id="picker" accept=".xlsx,.xlsm,.xlsb,.xls" multiple hidden>
    </div>
    <div class="files" id="files"></div>
  </aside>
  <section class="main" id="main">
    <div class="pane"><div class="empty" id="nofile">Upload a workbook, or pick one on the left.</div></div>
  </section>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<template id="tpl-file">
  <div class="fhead">
    <h2 id="f-title"></h2>
    <div class="fmeta" id="f-sub"></div>
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="overview">Overview</button>
      <button type="button" data-tab="changes">Changes<span class="count" id="chg-count" hidden></span></button>
      <button type="button" data-tab="valuation">Valuation</button>
      <button type="button" data-tab="ask">Ask</button>
    </nav>
  </div>
  <div class="pane" id="pane"></div>
  <div class="composer" id="composer" hidden>
    <form id="ask-form">
      <textarea id="question" rows="1" placeholder="Ask a question about this workbook…"></textarea>
      <button class="btn" id="send" type="submit">Ask</button>
    </form>
  </div>
</template>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtN = n => Number(n).toLocaleString();
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} };
const fmtDate = d => { if (!d) return null; const t = new Date(d + "T00:00:00"); return isNaN(t) ? d : t.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }); };
const ago = ts => { const s = Date.now() / 1000 - ts; return s < 90 ? "just now" : s < 5400 ? Math.round(s / 60) + " min ago" : s < 129600 ? Math.round(s / 3600) + " h ago" : new Date(ts * 1000).toLocaleDateString(); };
const mb = b => b < 1e6 ? Math.max(1, Math.round(b / 1e3)) + " KB" : (b / 1e6).toFixed(1) + " MB";

let files = [], selId = Number(store("sel")) || null, tab = store("tab") || "overview", detail = null;
const uploads = new Map();       // local id -> {name, pct, step}
const chats = new Map();         // file id -> {history, html}
const seenDone = new Set();

function toast(msg, ms = 6000) {
  const t = document.createElement("div"); t.className = "toast"; t.innerHTML = msg;
  $("#toasts").append(t); setTimeout(() => t.remove(), ms);
}

// ---------- file list ----------
async function loadFiles() {
  files = await (await fetch("/api/files")).json();
  for (const f of files) {
    if (f.status === "done" && !seenDone.has(f.id)) {
      if (seenDone.size && seenDone.has(-f.id)) {  // was processing in this session: announce it
        toast(f.previous_id ? `<b>${esc(f.filename)}</b> is processed. It's a new version, so its changes are ready.`
                            : `<b>${esc(f.filename)}</b> is processed.`);
        if (f.id === selId) { tab = f.previous_id ? "changes" : "overview"; openFile(f.id); }
        updateUsageChip();
      }
      seenDone.add(f.id);
    } else if (f.status !== "done") seenDone.add(-f.id);
  }
  renderList();
  if (selId && !files.some(f => f.id === selId)) selId = null;
  if (!detail && selId) openFile(selId);
  else if (!selId && files.length && !detail) openFile(files[0].id);
  else if (detail && selId) {
    const f = files.find(x => x.id === selId);
    if (f && f.status !== "done") renderProcessing(f);
  }
  const busy = files.some(f => f.status === "queued" || f.status === "processing");
  clearTimeout(loadFiles.t); loadFiles.t = setTimeout(loadFiles, busy || uploads.size ? 1000 : 15000);
}

function groupKey(f) { return f.target_name || "Target not identified"; }

function renderList() {
  const el = $("#files"); el.innerHTML = "";
  for (const [id, u] of uploads) {
    el.insertAdjacentHTML("beforeend", `<div class="fitem"><span class="fname">${esc(u.name)}</span>
      <span class="fmeta">${esc(u.step)}</span><div class="bar"><i style="width:${Math.round(u.pct * 100)}%"></i></div></div>`);
  }
  const groups = new Map();
  for (const f of files) { const k = groupKey(f); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(f); }
  for (const [k, list] of groups) {
    list.sort((a, b) => (b.valuation_date || "").localeCompare(a.valuation_date || "") || b.uploaded_at - a.uploaded_at);
    el.insertAdjacentHTML("beforeend", `<div class="group-h">${esc(k)}</div>`);
    const n = list.length;
    list.forEach((f, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "fitem" + (f.id === selId ? " sel" : "");
      let meta = "";
      if (f.status === "done") {
        meta += f.valuation_date ? `<span class="num">Val. date ${esc(fmtDate(f.valuation_date))}</span>` : `<span>No valuation date found</span>`;
        meta += f.identity_confirmed ? `<span class="pill ok">Confirmed</span>` : `<span class="pill check">Check</span>`;
        if (n > 1) meta += `<span class="pill ver">v${n - i}</span>`;
        if (f.n_warnings) meta += `<span class="pill bad">${f.n_warnings === 1 ? "1 warning" : f.n_warnings + " warnings"}</span>`;
      } else if (f.status === "error") meta = `<span class="pill bad">Failed</span>`;
      else meta = `<span>${esc(f.step)}</span>`;
      b.innerHTML = `<span class="fname">${esc(f.filename)}</span><span class="fmeta">${meta}</span>` +
        (f.status === "processing" || f.status === "queued" ? `<div class="bar"><i style="width:${Math.round(f.pct * 100)}%"></i></div>` : "");
      b.onclick = () => { openFile(f.id); };
      el.append(b);
    });
  }
  if (!files.length && !uploads.size) el.innerHTML = `<p class="muted" style="padding:8px 10px;font-size:13px">No workbooks yet.</p>`;
}

// ---------- upload ----------
const drop = $("#drop"), picker = $("#picker");
drop.onclick = () => picker.click();
drop.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); picker.click(); } };
picker.onchange = () => { [...picker.files].forEach(uploadFile); picker.value = ""; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); [...e.dataTransfer.files].forEach(uploadFile); };
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { if (!drop.contains(e.target)) { e.preventDefault(); [...e.dataTransfer.files].forEach(uploadFile); } });

async function sha256(file) {
  const buf = await file.arrayBuffer();
  return [...new Uint8Array(await crypto.subtle.digest("SHA-256", buf))].map(b => b.toString(16).padStart(2, "0")).join("");
}

async function uploadFile(file) {
  const key = Math.random();
  const setU = (pct, step) => { uploads.set(key, { name: file.name, pct, step }); renderList(); };
  if (!/\.(xlsx|xlsm)$/i.test(file.name)) {
    toast(`<b>${esc(file.name)}</b> can't be read: formulas are only readable from .xlsx and .xlsm. Save a copy as .xlsm in Excel and upload that.`, 9000);
    return;
  }
  setU(0, "Checking if we've seen this file…");
  try {
    const sha = await sha256(file);
    const { file: known } = await (await fetch("/api/files/check?sha=" + sha)).json();
    if (known) {
      uploads.delete(key);
      toast(`<b>${esc(file.name)}</b> was already processed${known.filename !== file.name ? ` as ${esc(known.filename)}` : ""} (${ago(known.uploaded_at)}). Not processed again.`, 8000);
      openFile(known.id); loadFiles(); return;
    }
    const res = await new Promise((resolve, reject) => {
      const x = new XMLHttpRequest(); const fd = new FormData(); fd.append("file", file);
      x.upload.onprogress = e => e.lengthComputable && setU(e.loaded / e.total, `Uploading ${Math.round(100 * e.loaded / e.total)}%`);
      x.onload = () => x.status < 300 ? resolve(JSON.parse(x.responseText)) : reject(new Error(JSON.parse(x.responseText).detail || x.statusText));
      x.onerror = () => reject(new Error("upload failed; is the server running?"));
      x.open("POST", "/api/files"); x.send(fd);
    });
    uploads.delete(key);
    if (res.status === "duplicate") toast(`<b>${esc(file.name)}</b> was already processed as ${esc(res.file.filename)}. Not processed again.`);
    seenDone.add(-res.file.id);
    tab = "overview"; await loadFiles(); openFile(res.file.id);
  } catch (e) {
    uploads.delete(key); renderList();
    toast(`<b>${esc(file.name)}</b>: ${esc(e.message)}`, 9000);
  }
}

// ---------- file view ----------
function mountFile() {
  const main = $("#main"); main.innerHTML = ""; main.append($("#tpl-file").content.cloneNode(true));
  $("#tabs").onclick = e => { const b = e.target.closest("button[data-tab]"); if (b) { tab = b.dataset.tab; store("tab", tab); renderTab(); } };
}

async function openFile(id) {
  selId = id; store("sel", id); renderList();
  const f = files.find(x => x.id === id);
  mountFile();
  if (f && f.status !== "done") { detail = f; renderProcessing(f); return; }
  detail = await (await fetch("/api/files/" + id)).json();
  if (detail.id !== selId) return;
  renderHead(); renderTab(); updateUsageChip();
}

function renderHead() {
  const d = detail;
  $("#f-title").textContent = d.filename;
  $("#f-sub").innerHTML = [d.target_name && `<span>${esc(d.target_name)}</span>`, d.valuation_date && `<span class="num">valued as at ${esc(fmtDate(d.valuation_date))}</span>`,
    `<span>${mb(d.size)}</span>`, `<span>uploaded ${ago(d.uploaded_at)}</span>`].filter(Boolean).join(" · ");
  const CHANGE_KEYS = ["line_items_added", "line_items_removed", "line_items_renamed", "formula_rows_changed",
    "inputs_changed", "formula_vs_hardcode", "calculated_cells_changed", "names_changed"];
  const n = d.diff ? CHANGE_KEYS.reduce((a, k) => a + (d.diff.counts[k] || 0), 0) : 0;
  const c = $("#chg-count"); c.hidden = !d.diff; c.textContent = d.diff ? (d.diff.identical_content && !Object.keys(d.diff.identity).length ? "none" : fmtN(n)) : "";
}

function renderProcessing(f) {
  if (!$("#f-title")) mountFile();
  $("#f-title").textContent = f.filename;
  $("#f-sub").textContent = f.status === "error" ? "Processing failed" : "Processing…";
  $("#tabs").hidden = true; $("#composer").hidden = true;
  const stages = [["Reading sheets", 0, .8], ["Identifying target and valuation date", .8, .9], ["Comparing with the previous version", .9, 1]];
  $("#pane").innerHTML = `<div class="wrap"><div class="card"><h3>${f.status === "error" ? "Failed" : "Processing"}</h3>
    ${f.status === "error" ? `<div class="callout red">${esc(f.error)}</div>` : `
    <div class="bar" style="height:8px"><i style="width:${Math.round(f.pct * 100)}%"></i></div>
    <p style="margin:10px 0 14px" class="num"><b>${Math.round(f.pct * 100)}%</b> · ${esc(f.step)}</p>
    <table><tbody>${stages.map(([s, lo, hi]) => `<tr><td>${f.pct >= hi ? "✓" : f.pct >= lo ? '<span class="pulse" style="display:inline-block"></span>' : "·"}</td>
      <td class="${f.pct < lo ? "muted" : ""}">${s}</td></tr>`).join("")}</tbody></table>`}
  </div></div>`;
}

function renderTab() {
  if (!detail || detail.status !== "done") return;
  $("#tabs").hidden = false;
  for (const b of $("#tabs").children) b.classList.toggle("on", b.dataset.tab === tab);
  $("#composer").hidden = tab !== "ask";
  ({ overview: renderOverview, changes: renderChanges, valuation: renderValuation, ask: renderAsk })[tab || "overview"]();
}

// ---- changes ----
const isNum = v => v !== null && v !== "" && !isNaN(Number(v));
function val(v, units) {
  if (v === null || v === undefined || v === "") return `<span class="muted">empty</span>`;
  if (isNum(v)) { const n = Number(v); const pct = units === "%" && Math.abs(n) < 5;
    return esc(pct ? (n * 100).toLocaleString(undefined, { maximumFractionDigits: 3 }) + "%" : n.toLocaleString(undefined, { maximumFractionDigits: Math.abs(n) < 10 ? 4 : 2 })); }
  return esc(String(v).replace(/ 00:00:00$/, ""));
}
function change(o, n, units) { return `${val(o, units)}<span class="arrow">→</span>${val(n, units)}`; }
function pctCell(p) { return p == null ? "" : `<span class="${p >= 0 ? "chg-up" : "chg-down"}">${p >= 0 ? "+" : ""}${p.toLocaleString(undefined, { maximumFractionDigits: 2 })}%</span>`; }
function tableOf(rows, cols) {
  return `<div class="scroll-x"><table><thead><tr>${cols.map(c => `<th>${c[0]}</th>`).join("")}</tr></thead><tbody>
    ${rows.map(r => `<tr>${cols.map(c => `<td>${c[1](r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function more(total, shown) { return total > shown ? `<p class="muted" style="font-size:13px;margin:8px 0 0">Showing ${shown} of ${fmtN(total)}.</p>` : ""; }

// ---- valuation ----
// Step 1 (Validate): can the workbook's DCF anchors be reproduced in Python, step by step?
// Step 2 (Scenarios): a validated anchor under other assumptions and methodology. All on the server, no model calls.
const valState = {};
const vN = x => x == null ? "–" : Number(x).toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const vPct = x => x == null ? "–" : (x * 100).toFixed(2) + "%";
const vDelta = (x, base) => { const d = x - base; if (Math.abs(d) < 0.05) return "no change";
  return `${d >= 0 ? "+" : "−"}${vN(Math.abs(d))} (${d >= 0 ? "+" : "−"}${Math.abs(d / base * 100).toFixed(1)}%)`; };
const TIMING = { end: "End of period", mid: "Mid-period" };
const DAYCOUNT = { "actual/actual": "Actual/actual (YEARFRAC)", "actual/365": "Actual/365 (XNPV)" };
function valSave(fid, st) { valState[fid] = st; store(`val:${fid}`, JSON.stringify(st)); }

async function renderValuation() {
  const fid = detail.id, st = valState[fid] || JSON.parse(store(`val:${fid}`) || "{}");
  valState[fid] = st;
  $("#pane").innerHTML = `<div class="wrap"><p class="muted">Finding and checking the DCFs in this workbook…</p></div>`;
  let v;
  try {
    const res = await fetch(`/api/files/${fid}/valuation${st.cell ? "?cell=" + encodeURIComponent(st.cell) : ""}`);
    v = await res.json(); if (!res.ok) throw new Error(v.detail || res.statusText);
  } catch (e) { $("#pane").innerHTML = `<div class="wrap"><div class="callout red">Couldn't load the valuation: ${esc(e.message)}</div></div>`; return; }
  if (detail?.id !== fid || tab !== "valuation") return;
  if (!v.selected) {
    $("#pane").innerHTML = `<div class="wrap"><div class="card"><p style="margin:0">No DCF found in this workbook. The Valuation tab looks for
      cells labelled like a valuation (enterprise value, equity value, NPV, total valuation) whose formula is a <code>SUMPRODUCT</code> of a
      cash-flow row and a discount-factor row, possibly plus other amounts.</p></div>${anchorTable(v, true)}</div>`;
    bindAnchorRows(fid); return;
  }
  if (st.cell !== v.selected) { st.cell = v.selected; st.sc = null; }
  const step = st.step === "scenario" && v.validated ? "scenario" : "validate";
  const good = v.anchors.filter(a => a.ok && a.matches);
  $("#pane").innerHTML = `<div class="wrap">
    <div class="val-top">
      <label>Anchor value<select id="val-cell">${v.anchors.filter(a => a.ok).map(a => `<option value="${esc(a.cell)}" ${a.cell === v.selected ? "selected" : ""}>${a.matches ? "✓" : "✗"} ${esc(a.label || a.cell)} · ${esc(a.cell)} · ${vN(a.value)}</option>`).join("")}</select></label>
      <span class="seg val-steps"><button type="button" data-step="validate" class="${step === "validate" ? "on" : ""}">1 · Validate</button><button type="button" data-step="scenario" class="${step === "scenario" ? "on" : ""}" ${v.validated ? "" : "disabled title=\"Validate the anchor first\""}>2 · Scenarios</button></span>
    </div>
    <div id="val-body"></div>
  </div>`;
  $("#val-cell").onchange = e => { valSave(fid, { cell: e.target.value, step }); renderValuation(); };
  $$(".val-steps [data-step]").forEach(b => b.onclick = () => { if (b.disabled) return; st.step = b.dataset.step; valSave(fid, st); renderValuation(); });
  if (step === "validate") renderValidate(fid, v, good); else renderScenario(fid, v);
}

function anchorTable(v, all) {
  const rows = v.anchors.filter(a => all || a.ok);
  if (!rows.length) return "";
  return `<div class="card val-tables"><h3>Anchor values in this workbook</h3><div class="scroll-x"><table>
    <thead><tr><th>Anchor</th><th class="n">Workbook</th><th class="n">Python</th><th>Result</th></tr></thead><tbody>
    ${rows.map(a => `<tr class="${a.ok ? "pick" : ""}" data-cell="${esc(a.cell)}"><td>${esc(a.label || "")} <span class="ref">${esc(a.cell)}</span></td>
      <td class="n">${vN(a.value)}</td><td class="n">${a.ok ? vN(a.total) : "–"}</td>
      <td>${a.ok && a.matches ? `<span class="pill ok">Reproduced</span>` : a.ok ? `<span class="pill bad">Differs</span>` : `<span class="src">${esc(a.reason || "")}</span>`}</td></tr>`).join("")}
    </tbody></table></div></div>`;
}
function bindAnchorRows(fid) {
  $$("#pane tr.pick").forEach(tr => tr.onclick = () => { valSave(fid, { cell: tr.dataset.cell, step: "validate" }); renderValuation(); });
}

function renderValidate(fid, v, good) {
  const A = v.assumptions, anchor = v.checks[v.checks.length - 1];
  const bridgeText = v.bridge.length ? ", then " + v.bridge.map(b => `${b.value < 0 ? "less" : "add"} ${esc(b.label.toLowerCase())}`).join(", ") : "";
  const tick = ok => ok === true ? `<span class="pill ok">✓ Matches</span>` : ok === false ? `<span class="pill bad">✗ Differs</span>` : `<span class="muted" style="font-size:12px">–</span>`;
  $("#val-body").innerHTML = `
    <div class="callout ${v.validated ? "green" : "red"}">${v.validated
      ? `<b>Reproduced.</b> Recomputing ${esc(anchor.what)} in Python gives ${vN(anchor.ours)}, the same as the workbook's <span class="ref">${esc(anchor.where)}</span>. The cash flows and discounting approach below are the model's. You can move on to <b>2 · Scenarios</b>.`
      : `<b>Not reproduced.</b> Python gives ${vN(anchor.ours)}; the workbook's <span class="ref">${esc(anchor.where)}</span> is ${vN(anchor.theirs)}. Scenarios stay locked until the anchor is reproduced.`}</div>
    <div class="card"><h3>Approach found</h3><p style="margin:0;line-height:1.6">Discount <b>${esc(A.cashflow.join("; "))}</b>
      ${A.timing === "mid" ? "at the middle of each period" : "at the end of each period"} at <b>${vPct(A.rate)}</b> a year back to the valuation date
      <b>${esc(A.valuation_date)}</b>, measuring time with ${esc(DAYCOUNT[A.day_count])}; ${A.terminal_date ? `periods after <b>${esc(A.terminal_date)}</b> aren't discounted` : "every later period is discounted"}${bridgeText}.
      <span class="muted">${A.periods} periods, ${esc(A.first_period)} to ${esc(A.last_period)}.</span></p></div>
    <div class="card val-tables"><h3>Step-by-step check</h3><div class="scroll-x"><table>
      <thead><tr><th>Step</th><th>What</th><th class="n">Python</th><th class="n">Workbook</th><th></th></tr></thead><tbody>
      ${v.checks.map(c => `<tr class="${c.step === "Anchor value" ? "tot" : ""}"><td>${esc(c.step)}</td><td>${esc(c.what)}${c.where ? `<div class="src">${esc(c.where)}${c.note ? " · " + esc(c.note) : ""}</div>` : c.note ? `<div class="src">${esc(c.note)}</div>` : ""}</td>

    </tbody></table></div></div>

// ---- ask ----
const REF = /\b([A-Za-z_][\w.]*!(?:r\d+(?:[-–]r?\d+)?|\$?[A-Z]{1,3}\$?\d+(?::\$?[A-Z]{1,3}\$?\d+)?))/g;
function chipRefs(root) {
  root.querySelectorAll("code").forEach(c => { if (/^[A-Za-z_][\w.]*![$A-Za-z0-9:–-]+$/.test(c.textContent)) c.className = "ref"; });
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) {
    if (n.parentElement.closest("code,pre,a,.ref") || !REF.test(n.data)) continue;
    REF.lastIndex = 0;
    const span = document.createElement("span");
    span.innerHTML = esc(n.data).replace(REF, '<span class="ref">$1</span>');
    n.replaceWith(...span.childNodes);
  }
}
const EXAMPLES = ["What drives equity value?", "What discount rate is used, and where is it set?",
  "Which sheets are hidden and what do they do?", "Explain the changes from the previous version."];

function renderAsk() {
  const d = detail, chat = chats.get(d.id);
  $("#pane").innerHTML = `<div class="wrap">${chat?.history.length ? `<div class="new-chat"><button class="btn ghost" type="button" id="new-chat">New chat</button></div>` : ""}<div class="thread" id="thread">${chat?.html || `
    <div id="intro"><p class="muted" style="margin:0 0 12px;max-width:62ch">The model looks things up in this workbook with search,
      row, trace and SQL tools and cites cells like <span class="ref">Valuation!r178</span>. It knows the confirmed target,
      valuation date${d.diff ? " and the changes from the previous version" : ""}.</p>
      <div class="chips" id="examples">${[...EXAMPLES, "Chart the valuation cash flows over time."].filter(q => d.diff || !q.startsWith("Explain")).map(q => `<button type="button">${q}</button>`).join("")}</div></div>`}
  </div></div>`;
  mountCharts($("#thread"));
  const nc = $("#new-chat"); if (nc) nc.onclick = () => { chats.delete(d.id); renderAsk(); updateUsageChip(); };
  const ex = $("#examples"); if (ex) ex.onclick = e => { if (e.target.tagName === "BUTTON") ask(e.target.textContent); };
  const q = $("#question"), form = $("#ask-form");
  form.onsubmit = e => { e.preventDefault(); const t = q.value.trim(); if (!t || $("#send").disabled) return; q.value = ""; autosize(); ask(t); };
  q.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } };
  q.oninput = autosize; scrollDown();
}
function autosize() { const q = $("#question"); q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 180) + "px"; }
function scrollDown() { const p = $("#pane"); if (p) p.scrollTop = p.scrollHeight; }
function argText(a) { return Object.entries(a).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(", "); }

async function ask(text) {
  const fid = detail.id, model = $("#model").value;
  const chat = chats.get(fid) || { history: [], html: "", session: newSession() }; chats.set(fid, chat);
  $("#intro")?.remove();
  const thread = $("#thread");
  thread.insertAdjacentHTML("beforeend", `<div class="q">${esc(text)}</div>`);
  const a = document.createElement("div"); a.className = "a";
  a.innerHTML = `<details class="work"><summary><span class="pulse"></span><span class="label">Looking things up…</span></summary><div class="steps"></div></details>`;
  thread.append(a); scrollDown();
  const steps = a.querySelector(".steps"), label = a.querySelector(".label");
  let calls = 0, chars = 0, answer = "", t0 = performance.now(), lastStep;
  $("#send").disabled = true;
  const handle = e => {
    if (e.type === "tool_call") {
      calls++; label.textContent = `Looking things up… ${calls} tool call${calls === 1 ? "" : "s"}`;
      lastStep = document.createElement("div"); lastStep.className = "step";
      lastStep.innerHTML = `<div class="call"><b>${esc(e.name)}</b>(${esc(argText(e.args))})</div>`; steps.append(lastStep);
    } else if (e.type === "tool_result") { chars += e.chars; updateUsageChip(); lastStep?.insertAdjacentHTML("beforeend", `<pre>${esc(e.output)}</pre>`); }
    else if (e.type === "answer") {
      answer = e.text; const div = document.createElement("div"); div.className = "answer";
      div.innerHTML = DOMPurify.sanitize(marked.parse(e.text || "_(empty answer)_")); chipRefs(div); a.append(div);
    } else if (e.type === "usage") {
      a.insertAdjacentHTML("beforeend", `<div class="chat-stats"><span><b>${fmtN(e.input_tokens)}</b> input tokens</span>
        <span><b>${fmtN(e.cached_tokens || 0)}</b> of them cached</span><span><b>${fmtN(e.output_tokens)}</b> output tokens</span>
        <span><b>${e.calls}</b> model turns</span><span><b>${((performance.now() - t0) / 1000).toFixed(1)}s</b></span><span>${esc(model)}</span></div>`);
    } else if (e.type === "waiting") {
      label.textContent = `Waiting ${e.seconds}s to stay under ${e.model}'s rate limit (${fmtN(e.tpm_budget)} tokens / ${fmtN(e.rpm_budget)} requests a minute)…`;
      steps.insertAdjacentHTML("beforeend", `<div class="step muted">Paused ${e.seconds}s: ${esc(e.model)} is near its per-minute budget (limit minus a safety margin).</div>`);
    } else if (e.type === "chart_review") {
      label.textContent = `Checking the chart “${e.title || ""}” before showing it…`;
    } else if (e.type === "dcf") {
      a.append(dcfCard(e.result));
    } else if (e.type === "chart") {
      const card = chartCard(e.spec); a.append(card); mountCharts(a);
    } else if (e.type === "error") a.insertAdjacentHTML("beforeend", `<div class="error">${esc(e.text)}</div>`);
    if (detail?.id === fid) scrollDown();
  };
  try {
    const res = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: text, file_id: fid, model, history: chat.history, session: chat.session }) });
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf("\n")) >= 0) { handle(JSON.parse(buf.slice(0, i))); buf = buf.slice(i + 1); }
    }
  } catch (e) { handle({ type: "error", text: "Could not reach the local server. Is it still running? (" + e.message + ")" }); }
  a.querySelector(".pulse")?.remove();
  label.textContent = `Lookups: ${calls} tool call${calls === 1 ? "" : "s"}, ${fmtN(chars)} characters read`;
  if (answer) chat.history.push({ role: "user", content: text }, { role: "assistant", content: answer });
  chat.html = a.parentElement ? a.parentElement.innerHTML : chat.html + a.outerHTML;
  const s = $("#send"); if (s) { s.disabled = false; $("#question")?.focus(); }
  updateUsageChip();
  const wrap = $("#pane .wrap");
  if (detail?.id === fid && tab === "ask" && wrap && !$("#new-chat")) {
    wrap.insertAdjacentHTML("afterbegin", `<div class="new-chat"><button class="btn ghost" type="button" id="new-chat">New chat</button></div>`);
    $("#new-chat").onclick = () => { chats.delete(fid); renderAsk(); updateUsageChip(); };
  }
}

// ---------- charts ----------
function newSession() { try { return crypto.randomUUID(); } catch (e) { return String(Date.now()) + Math.random(); } }
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
// What the chart shows for a mode: formatted period labels ("Sep-2017", "FY2018"), and every value multiplied
// by spec.sign, which is -1 only when all values are negative (e.g. capex, shown as positive). Mirrors
// bench/chartdata.py display(); the workbook values in spec.series are never changed.
function shownData(spec, mode) {
  const sign = spec.sign || 1, a = spec.annual, annual = mode === "annual" && a;
  const labels = annual ? a.labels : (spec.period_labels || spec.labels);
  const series = (annual ? a.series : spec.series).map(s => ({ name: s.name, method: s.method,
    data: s.data.map(v => v == null ? null : v * sign + 0) }));
  const phases = annual ? a.phases : spec.phases;
  return { labels, series, phases: phases || null };
}
// Chart.js plugin: shade alternate Actuals / Business plan / Forecast spans and label them above the plot.
const phasePlugin = {
  id: "phases",
  beforeDatasetsDraw(chart, args, opts) {
    const ph = opts.phases; if (!ph || !ph.length) return;
    const { ctx, chartArea: area, scales: { x } } = chart;
    ctx.save();
    ph.forEach((p, k) => {
      const x0 = Math.max(area.left, x.getPixelForValue(p.start) - (x.getPixelForValue(1) - x.getPixelForValue(0)) / 2);
      const x1 = Math.min(area.right, x.getPixelForValue(p.end) + (x.getPixelForValue(1) - x.getPixelForValue(0)) / 2);
      if (x1 <= area.left || x0 >= area.right) return;
      if (k % 2 === 0) { ctx.fillStyle = opts.shade; ctx.fillRect(x0, area.top, x1 - x0, area.bottom - area.top); }
      if (x1 - x0 > Math.max(60, ctx.measureText(p.name).width + 16)) {
        ctx.fillStyle = opts.text; ctx.font = "11px " + getComputedStyle(document.body).fontFamily;
        ctx.textAlign = "center"; ctx.fillText(p.name, (x0 + x1) / 2, area.top + 12);
      }
    });
    ctx.restore();
  },
};
const FREQ_WORD = { monthly: "Monthly", quarterly: "Quarterly", "semi-annual": "Half-yearly", annual: "Annual" };
const METHOD_WORD = { sum: "totals", last: "year-end values", first: "opening values", average: "averages" };
function chartSubtitle(spec, mode) {
  const units = spec.units && !/not\s+label/i.test(spec.units) ? esc(spec.units) : "Units not labelled";
  const signNote = spec.sign === -1 ? " · negative values shown as positive" : "";
  const d = shownData(spec, mode), n = d.labels.length;
  const span = n ? ` · ${esc(d.labels[0])} to ${esc(d.labels[n - 1])}` : "";
  if (mode === "annual" && spec.annual) {
    const a = spec.annual, methods = [...new Set(a.series.map(s => METHOD_WORD[s.method]))].join(" / ");
    return `${units}${signNote} · ${n} years: annual ${methods} by ${esc(a.basis)}${span}` +
      (a.partial.some(Boolean) ? " · * partial year" : "") + phaseText(d);
  }
  return `${units}${signNote} · ${n} ${(FREQ_WORD[spec.frequency] || "").toLowerCase() || "points"}${n ? " periods" : ""}${span}`
    .replace(" periods periods", " periods") + phaseText(d);
}
function phaseText(d) {
  if (!d.phases || !d.phases.length) return "";
  return "<br>" + d.phases.map(p => `${esc(p.name)} ${esc(d.labels[p.start])}–${esc(d.labels[p.end])}`).join(" · ");
}
function dcfCard(r) {
  const n = v => v == null ? "" : v.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const pct = v => (v * 100).toFixed(2) + "%";
  const units = r.units.length ? r.units.join(", ") : "units not labelled";
  const badge = r.compare_to == null ? "" : r.matches
    ? `<span class="pill ok">Matches ${esc(r.compare_source.split(" ")[0])}</span>`
    : `<span class="pill bad">Workbook ${esc(r.compare_source.split(" ")[0])}: ${n(r.compare_to)}</span>`;
  const bridge = r.bridge.length ? `<table><tr><td>PV of cash flows</td><td class="n">${n(r.pv)}</td></tr>${r.bridge.map(b => {
      return `<tr><td>${b.value < 0 ? "Less" : "Add"}: ${esc(b.label)}</td><td class="n">${n(b.value)}</td></tr>`; }).join("")}
      <tr class="tot"><td>Total</td><td class="n">${n(r.total)}</td></tr></table>` : "";
  const sens = r.sensitivity.length ? `<table><tr><td class="muted">Discount rate</td>${r.sensitivity.map(x => `<td class="n">${pct(x.rate)}</td>`).join("")}<td class="n"><b>${pct(r.rate)}</b></td></tr>
      <tr><td class="muted">Value</td>${r.sensitivity.map(x => `<td class="n">${n(x.total)}</td>`).join("")}<td class="n"><b>${n(r.total)}</b></td></tr></table>
      <div class="muted" style="font-size:12px">What-ifs hold the workbook's saved cash flows and bridge fixed.</div>` : "";
  const fixes = r.corrections.length ? `<div class="callout amber" style="font-size:13px"><b>Corrected to follow the workbook's formula:</b><ul>${r.corrections.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>` : "";
  const card = document.createElement("div"); card.className = "dcf-card";
  card.innerHTML = `<div class="top"><h4>DCF recomputed in Python</h4><span class="big">${n(r.total)}</span><span class="muted">${esc(units)}</span>${badge}</div>
    <div class="facts"><span>Rate <b>${pct(r.rate)}</b></span><span>Valuation date <b>${esc(r.valuation_date)}</b></span>
      <span>Periods <b>${r.periods}</b> (${esc(r.first_period || "")} to ${esc(r.last_period || "")})</span>
      <span>Convention <b>${esc(r.timing)}-of-period, ${esc(r.day_count)}</b></span></div>
    <div class="facts"><span>Cash flows <b>${r.rows.map(esc).join("; ")}</b></span></div>
    ${fixes}${bridge}${sens}`;
  return card;
}

function chartCard(spec) {
  const card = document.createElement("div"); card.className = "chart-card";
  const refs = [...new Set(spec.series.map(s => s.range))].map(r => `<span class="ref">${esc(r)}</span>`).join("");
  const modes = spec.annual ? `<span class="seg"><button type="button" data-mode="periodic">${FREQ_WORD[spec.frequency] || "Periodic"}</button><button type="button" data-mode="annual">Annual</button></span>` : "";
  card.innerHTML = `<h4>${esc(spec.title)}</h4><div class="sub"></div>
    <div class="chart-box"><canvas role="img" aria-label="${esc(spec.title)}"></canvas></div>
    <div class="chart-tools">${modes}<button type="button" data-kind="line">Line</button><button type="button" data-kind="bar">Bar</button>
      <button type="button" data-act="copy">Copy data</button><button type="button" data-act="reset">Full range</button>
      <span class="src">Source ${refs}</span></div>
    <div class="review-slot"></div>
    <script type="application/json">${JSON.stringify(spec).replace(/</g, "\\u003c")}<\/script>`;
  return card;
}
function mountCharts(root) {
  root.querySelectorAll(".chart-card").forEach(card => {
    if (card._chart) return;
    const spec = card._spec = JSON.parse(card.querySelector('script[type="application/json"]').textContent);
    card._mode = spec.mode || "periodic";
    const draw = card._draw = (kind, useView = true) => {
      card._chart?.destroy();
      const mode = card._mode, d = shownData(spec, mode);
      const ink = tok("--ink"), muted = tok("--muted"), rule = tok("--rule");
      const fmt = v => v == null ? "–" : Number(v).toLocaleString(undefined, { maximumFractionDigits: Math.abs(v) < 10 ? 4 : 1 });
      card._chart = new Chart(card.querySelector("canvas"), {
        type: kind, plugins: [phasePlugin],
        data: { labels: d.labels, datasets: d.series.map((s, i) => {
          const c = tok(`--s${(i % 6) + 1}`);
          return { label: s.name, data: s.data, borderColor: c, backgroundColor: kind === "bar" ? c : c + "22",
            borderWidth: 2, pointRadius: d.labels.length > 60 ? 0 : 2.5, pointHoverRadius: 4, tension: 0,
            fill: false, spanGaps: true };
        }) },
        options: { responsive: true, maintainAspectRatio: false, animation: false,
          interaction: { mode: "index", intersect: false },
          plugins: { phases: { phases: d.phases, shade: tok("--code-bg"), text: muted },
            legend: { display: d.series.length > 1, labels: { color: ink, boxWidth: 12 } },
            tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${fmt(c.raw)}${spec.units && !/not\s+label/i.test(spec.units) ? " " + spec.units : ""}` } } },
          scales: { x: { ticks: { color: muted, maxRotation: 0, autoSkip: true, maxTicksLimit: 10 }, grid: { display: false }, border: { color: rule } },
                    y: { ticks: { color: muted, callback: v => Number(v).toLocaleString() }, grid: { color: rule }, border: { display: false } } },
          onClick: (evt, els, chart) => zoomTo(chart, els) } });
      // Framing chosen by the chart review (data unchanged). Its period window maps to financial years in
      // the annual view; its y-axis limits are for periodic values only.
      const v = useView && spec.view;
      if (v) {
        const o = card._chart.options.scales, py = spec.annual?.period_year;
        const annual = mode === "annual" && py;
        // In the annual view, keep a year only if the window covers all of its periods
        if (v.x_start != null) o.x.min = !annual ? v.x_start : py[v.x_start] + (py[v.x_start - 1] === py[v.x_start] ? 1 : 0);
        if (v.x_end != null) o.x.max = !annual ? v.x_end : py[v.x_end] - (py[v.x_end + 1] === py[v.x_end] ? 1 : 0);
        if (mode !== "annual") { if (v.y_min != null) o.y.min = v.y_min; if (v.y_max != null) o.y.max = v.y_max; }
        card._chart.update();
      }
      spec.kind = kind; spec.mode = mode;
      card.querySelector(".sub").innerHTML = chartSubtitle(spec, mode);
      card.querySelectorAll("[data-kind]").forEach(b => b.classList.toggle("on", b.dataset.kind === kind));
      card.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
    };
    renderReview(card);
    // Click a point to zoom into the 20 periods around it; Full range goes back to everything.
    function zoomTo(chart, els) {
      if (!els.length) return; const i = els[0].index, n = chart.data.labels.length;
      chart.options.scales.x.min = Math.max(0, i - 10); chart.options.scales.x.max = Math.min(n - 1, i + 10); chart.update();
    }
    card.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => draw(b.dataset.kind));
    card.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { card._mode = b.dataset.mode; draw(spec.kind || "line"); });
    card.querySelector('[data-act="reset"]').onclick = () => draw(spec.kind || "line", false);
    card.querySelector('[data-act="copy"]').onclick = e => {
      const d = shownData(spec, card._mode), flip = spec.sign === -1 ? " (shown as positive)" : "";
      const rows = [["Period", ...d.series.map(s => s.name + flip)], ...d.labels.map((l, i) => [l, ...d.series.map(s => s.data[i] ?? "")])];
      copyText(rows.map(r => r.join("\t")).join("\n"), e.currentTarget, card);
    };
    draw(spec.kind || "line");
  });
}

// Copy with fallbacks: the async clipboard API is refused in some browsers and embedded views, the older
// execCommand("copy") works in more of them, and if both fail the data is shown selected for Cmd/Ctrl+C.
async function copyText(text, btn, card) {
  const done = msg => { btn.textContent = msg; setTimeout(() => btn.textContent = "Copy data", 1800); };
  try { await navigator.clipboard.writeText(text); return done("Copied"); } catch (e) {}
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
  document.body.append(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  if (ok) return done("Copied");
  let panel = card.querySelector(".copy-panel");
  if (!panel) {
    panel = document.createElement("div"); panel.className = "copy-panel";
    panel.innerHTML = `<span class="muted" style="font-size:12.5px">This browser blocked automatic copying. The data is selected below: press Cmd+C (Ctrl+C on Windows), then paste into Excel.</span><textarea readonly></textarea><div><button type="button" class="btn ghost">Close</button></div>`;
    panel.querySelector("button").onclick = () => panel.remove();
    card.append(panel);
  }
  const box = panel.querySelector("textarea"); box.value = text; box.focus(); box.select();
  done("Select + copy below");
}

// ---------- chart review ----------
// Charts arrive already reviewed: the server renders each one to PNG, a vision model checks it and may
// change the presentation (title, type, visible window, y-axis range, note). This shows what it changed.
function renderReview(card) {
  const spec = card._spec, rv = spec.review, slot = card.querySelector(".review-slot");
  if (!slot) return;
  if (!rv) { slot.innerHTML = spec.note ? `<p class="chart-note">${esc(spec.note)}</p>` : ""; return; }
  const names = { title: "title", kind: "chart type", x_start: "visible range", x_end: "visible range", y_min: "y-axis range", y_max: "y-axis range", note: "note" };
  const changed = [...new Set(rv.changed.map(k => names[k] || k))];
  const head = rv.verdict === "skipped" ? `Not reviewed: ${esc(rv.issues[0] || "")}`
    : changed.length ? `Checked before showing (${esc(rv.model || "")}): adjusted the ${changed.join(", ")}. The data is unchanged; “Full range” shows everything.`
    : `Checked before showing (${esc(rv.model || "")}): no changes needed.`;
  slot.innerHTML = (spec.note ? `<p class="chart-note">${esc(spec.note)}</p>` : "") +
    (rv.issues.length && rv.verdict !== "skipped"
      ? `<details class="review"><summary>${head}</summary><ul>${rv.issues.map(i => `<li>${esc(i)}</li>`).join("")}</ul></details>`
      : `<p class="review muted" style="font-size:12.5px;margin:6px 0 0">${head}</p>`);
}

// ---------- token usage ----------
const usd = v => v == null ? "–" : v < 0.01 && v > 0 ? "<$0.01" : "$" + Number(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: v < 1 ? 3 : 2 });
const kfmt = n => n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e4 ? Math.round(n / 1e3) + "k" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n);
const currentSession = () => detail && chats.get(detail.id)?.session;
async function updateUsageChip() {
  try {
    const s = currentSession(), u = await (await fetch("/api/usage" + (s ? "?session=" + s : ""))).json();
    const tot = u.total.input_tokens + u.total.output_tokens;
    const ses = u.session ? u.session.input_tokens + u.session.output_tokens : 0;
    $("#usage-chip").innerHTML = `Tokens: <b>${kfmt(ses)}</b> this chat · <b>${kfmt(tot)}</b> total · <b>${usd(u.total.cost_usd)}</b>`;
  } catch (e) {}
}
$("#usage-chip").onclick = openUsage;
$("#usage-close").onclick = () => $("#usage-dlg").close();
async function openUsage() {
  const s = currentSession(), u = await (await fetch("/api/usage" + (s ? "?session=" + s : ""))).json();
  const cols = [["Calls", r => fmtN(r.calls)], ["Input", r => fmtN(r.input_tokens)], ["of which cached", r => fmtN(r.cached_tokens)], ["Output", r => fmtN(r.output_tokens)],
    ["Cost (USD)", r => usd(r.cost_usd) + (r.unpriced_calls ? ` <span class="muted">+${r.unpriced_calls} unpriced</span>` : "") + (r.model && u.estimated_models.includes(r.model) ? ' <span class="pill check">est.</span>' : "")]];
  const tiles = (t, label) => `<div class="card"><h3>${label}</h3><div class="tiles">
      <div class="tile"><b>${fmtN(t.input_tokens)}</b><span>input tokens</span></div>
      <div class="tile"><b>${fmtN(t.cached_tokens)}</b><span>of them cached (${t.input_tokens ? Math.round(100 * t.cached_tokens / t.input_tokens) : 0}%)</span></div>
      <div class="tile"><b>${fmtN(t.output_tokens)}</b><span>output tokens</span></div>
      <div class="tile"><b>${fmtN(t.calls)}</b><span>model calls</span></div>
      <div class="tile"><b>${usd(t.cost_usd)}</b><span>cost at list price</span></div></div></div>`;
  const PURPOSE = { chat: "Questions (Ask tab)", identify: "Identifying target and date", summary: "Change summaries", "chart review": "Chart reviews" };
  $("#usage-body").innerHTML = `
    ${u.session ? tiles(u.session, "This chat" + (detail ? " · " + esc(detail.filename) : "")) : ""}
    ${tiles(u.total, "All time" + (u.total.since ? " · since " + new Date(u.total.since * 1000).toLocaleDateString() : ""))}
    ${u.by_day.length ? `<div class="card"><h3>By day (input + output)</h3><div class="chart-box" style="height:200px"><canvas id="usage-days"></canvas></div></div>` : ""}
    ${u.limits ? `<div class="card"><h3>Rate limits (kept ${Math.round(u.limits.buffer * 100)}% below)</h3>${tableOf(Object.entries(u.limits.models).map(([m, l]) => ({ m, ...l })), [
      ["Deployment", r => esc(r.m)], ["Limit / min", r => `${fmtN(r.tpm)} tokens · ${fmtN(r.rpm)} requests`],
      ["App budget / min", r => `${fmtN(r.tpm_budget)} · ${fmtN(r.rpm_budget)}`],
      ["Used in last minute", r => `${fmtN(r.tokens_last_min)} · ${fmtN(r.requests_last_min)}`]])}
      <p class="muted" style="margin:8px 0 0;font-size:13px">Capacities from ${esc(u.limits.source)}. Requests per minute follow Microsoft's published ratios (gpt-4o confirmed from your portal: 2,700 a minute).</p></div>` : ""}
    <div class="card"><h3>By purpose</h3>${tableOf(u.by_purpose, [["", r => esc(PURPOSE[r.purpose] || r.purpose)], ...cols])}</div>
    <div class="card"><h3>By model</h3>${tableOf(u.by_model, [["", r => esc(r.model)], ...cols])}</div>
    <div class="card"><h3>Recent chats</h3>${u.sessions.length ? tableOf(u.sessions, [["Last used", r => new Date(r.last * 1000).toLocaleString()],
      ["Workbook", r => esc(r.filename || "removed file")], ["Models", r => esc(r.models)], ...cols]) : '<p class="muted" style="margin:0">No chats yet.</p>'}</div>
    <p class="muted" style="margin:0;font-size:13px;max-width:75ch">Counted from the usage figures Azure returns with each response. Usage before this log was added isn't included.
      Costs use Azure list prices in USD (East US, checked 25 Sep 2026); your bill can differ with discounts or credits.
      <b>est.</b> models: gpt-6 uses short-context rates and excludes cache-write charges, so it's a minimum.</p>`;
  $("#usage-dlg").showModal();
  const days = [...u.by_day].reverse();
  if (days.length) new Chart($("#usage-days"), { type: "bar",
    data: { labels: days.map(d => d.day), datasets: [{ label: "Tokens", data: days.map(d => d.input_tokens + d.output_tokens), backgroundColor: tok("--s1") }] },
    options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: tok("--muted") }, grid: { display: false } }, y: { ticks: { color: tok("--muted") }, grid: { color: tok("--rule") } } } } });
}

async function init() {
  const cfg = await (await fetch("/api/config")).json();
  $("#model").innerHTML = cfg.models.map(m => `<option>${esc(m)}</option>`).join("");
  $("#model").value = store("model") || cfg.models[0];
  if (!$("#model").value) $("#model").value = cfg.models[0];
  $("#model").onchange = e => store("model", e.target.value);
  loadFiles(); updateUsageChip();
}
init();
</script>
